requisite: Қарағанды облысы Жаңаарқа ауданының Мұқажан Жұмажанов атындағы селолық округі әкімінің 2010 жылғы 8 қыркүйектегі № 1 шешімі. Қарағанды облысы Жаңаарқа ауданының Әділет басқармасында 2010 жылғы 20 қыркүйекте № 8-12-90
