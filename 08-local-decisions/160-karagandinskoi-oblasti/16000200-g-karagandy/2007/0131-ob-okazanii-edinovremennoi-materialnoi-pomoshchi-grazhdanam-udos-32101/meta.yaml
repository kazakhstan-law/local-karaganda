requisite: Решение XLV сессии III созыва Карагандинского городского Маслихата от 31 января 2007 года № 9. Зарегистрировано Управлением юстиции города Караганды 27 февраля 2007 года за № 8-1-53. Утратило силу решением Карагандинского городского маслихата от 19 декабря 2012 года № 115
title:
  rus: Об оказании единовременной материальной помощи гражданам, удостоенным званий Героя Советского союза, "Халық қаһарманы", Героя Социалистического труда, награжденным орденом "Отан" и орденом "Даңқ" І и ІІ степеней по расходам на содержание жилища и оплату коммунальных услуг
