requisite: Қарағанды қалалық мәслихатының III шақырылған кезекті XVI сессиясының 2005 жылғы 10 наурыздағы № 3 шешімі. Қарағанды облысының Әділет департаментінде 2005 жылғы 12 сәуірде № 1760 тіркелді. Күші жойылды - Қарағанды қалалық мәслихатының 2012 жылғы 23 мамырдағы № 52 шешімімен
