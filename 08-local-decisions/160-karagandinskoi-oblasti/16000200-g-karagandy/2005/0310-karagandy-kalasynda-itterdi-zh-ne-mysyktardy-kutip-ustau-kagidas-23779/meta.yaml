requisite: Қарағанды қалалық мәслихатының III шақырылған кезекті XVI сессиясының 2005 жылғы 10 наурыздағы № 4 шешімі. Қарағанды қаласының Әділет басқармасында 2005 жылғы 21 сәуірде № 8-1-1 тіркелді. Күші жойылды - Қарағанды қалалық мәслихатының IV шақырылған ХV сессиясының 2008 жылғы 26 қарашадағы № 156 шешімімен
