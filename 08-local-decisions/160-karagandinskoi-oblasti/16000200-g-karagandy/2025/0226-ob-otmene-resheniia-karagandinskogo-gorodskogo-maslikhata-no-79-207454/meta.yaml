title:
  rus: Об отмене решения Карагандинского городского маслихата № 79 от 28 июля 2023 года «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат Карагандинского городского маслихата»
  kaz: Қарағанды қалалық мәслихатының 2023 жылғы 28 шілдедегі № 79 «Қарағанды қалалық мәслихатының аппараты» мемлекеттік мекемесінің «Б» корпусының әкімшілік мемлекеттік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» шешімін жою туралы
