  requisite: Решение Карагандинского городского маслихата от 21 декабря 2022 года № 229. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 декабря 2022 года № 31269. Утратило силу решением Карагандинского городского маслихата от 27 сентября 2023 года № 96 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в решение Карагандинского городского маслихата от 27 ноября 2014 года № 363 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Караганды»
    kaz: Қарағанды қалалық мәслихатының 2014 жылғы 27 қарашадағы № 363 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Қарағанды қаласындағы мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау Қағидасын бекіту туралы» шешіміне өзгерістер енгізу туралы
