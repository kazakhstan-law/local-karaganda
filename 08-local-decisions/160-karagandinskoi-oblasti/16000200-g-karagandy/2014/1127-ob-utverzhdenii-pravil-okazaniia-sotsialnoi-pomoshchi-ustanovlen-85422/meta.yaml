  title:
    rus: О внесении изменений и дополнений в решение XLI сессии Карагандинского городского маслихата от 27 ноября 2014 года № 363 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Караганды»
    kaz: Қарағанды қалалық мәслихатының XLI сессиясының 2014 жылғы 27 қарашадағы №363 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Қарағанды қаласындағы мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау Қағидасын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
