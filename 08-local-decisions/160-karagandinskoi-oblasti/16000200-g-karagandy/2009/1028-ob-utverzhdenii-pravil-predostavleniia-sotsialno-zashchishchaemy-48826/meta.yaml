requisite: Решение XXV сессии IV созыва Карагандинского городского маслихата от 28 октября 2009 года № 267. Зарегистрировано Управлением юстиции города Караганды Карагандинской области 26 ноября 2009 года № 8-1-100. Утратило силу - решением XXХIV сессии IV созыва Карагандинского городского маслихата от 16 июня 2010 года № 368
title:
  rus: Об утверждении Правил предоставления социально защищаемым гражданам города Караганды жилищной помощи на содержание жилья, оплату коммунальных услуг, компенсацию повышения тарифов абонентской платы за оказание услуг телекоммуникаций
  kaz: Қарағанды қаласының әлеуметтік тұрғыдан қорғалатын азаматтарына тұрғын үйді ұстау, коммуналдық қызметтер ақысын төлеу, телекоммуникация қызметтерін көрсеткені үшін абоненттік төлемақы тарифінің көтерілуіне өтемақы төлеу үшін тұрғын үй көмегін беру Қағидасын бекіту туралы
