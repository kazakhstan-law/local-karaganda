  title:
    rus: О внесении изменений в решение Карагандинского городского маслихата от 25 мая 2023 года № 30 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану по городу Караганда»
    kaz: Қарағанды қалалық мәслихатының 2023 жылғы 25 мамырдағы № 30 «Қарағанды қаласы бойынша мүгедектігі бар балалар қатарындағы кемтар балаларды үйде оқытуға жұмсалған шығындарды өтеу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
