title:
  rus: Об отмене решения Карагандинского городского маслихата № 48 от 07 июня 2023 года "Об утверждении Методики оценки деятельности административных государственных служащих корпуса "Б" в государственном учреждении "Аппарат Карагандинского городского маслихата"
  kaz: '"Қарағанды қалалық мәслихатының аппараты" мемлекеттік мекемесінде "Б" корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы" Қарағанды қалалық мәслихатының 2023 жылғы 07 маусымдағы № 48 шешімінің күшін жою туралы'
