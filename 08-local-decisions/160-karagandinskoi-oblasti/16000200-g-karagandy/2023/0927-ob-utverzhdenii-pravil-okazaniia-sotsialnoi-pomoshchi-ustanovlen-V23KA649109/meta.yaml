  title:
    rus: О внесении изменений в решение Карагандинского городского маслихата от 27 сентября 2023 года № 96 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Караганды»
    kaz: Қарағанды қалалық мәслихатының 2023 жылғы 27 қыркүйектегі № 96 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Қарағанды қаласындағы мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау Қағидасын бекіту туралы» шешіміне өзгерiстер енгізу туралы
