act_code: '28992'
requisite: Қарағанды қалалық мәслихатының III шақырылған XXXIII сессиясының 2006 жылғы 7 маусымдағы № 13 шешімі. Қарағанды қаласы әділет басқармасында 2006 жылғы 19 шілдеде № 8-1-35 тіркелді. Күші жойылды - Қарағанды қалалық мәслихатының IV шақырылған XXV сессиясының 2009 жылғы 28 қазандағы № 267 шешімімен
title:
  rus: Қарағанды қаласының аз қамтылған азаматтарына тұрғын үйді ұстау, коммуналдық қызметтер ақысын төлеу, қалалық телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің көтерілуіне байланысты өтемақы төлеу үшін тұрғын үй жәрдемақысын беру Қағидасын бекіту туралы
