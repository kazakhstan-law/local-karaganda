requisite: Решение ХIII сессии V созыва Карагандинского городского маслихата от 19 декабря 2012 года № 115. Зарегистрировано Департаментом юстиции Карагандинской области 26 декабря 2012 года № 2073. Утратило силу решением Карагандинского городского маслихата от 5 августа 2020 года № 530 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
