act_code: '153130'
requisite: Решение Жанааркинского районного маслихата Карагандинской области от 18 февраля 2021 года № 2/15. Зарегистрировано Департаментом юстиции Карагандинской области 25 февраля 2021 года № 6212
title:
  rus: Об установлении специалистам в области социального обеспечения, культуры и спорта, являющимся гражданскими служащими и работающим в сельских населенных пунктах, а также указанным специалистам, работающим в государственных организациях, финансируемых из местных бюджетов повышенные на двадцать пять процентов оклады и тарифные ставки по сравнению со ставками специалистов, занимающихся этими видами деятельности в городских условиях
  kaz: Азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, мәдениет және спорт саласындағы мамандарға, сондай-ақ жергілікті бюджеттерден қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандарға қызметтiң осы түрлерiмен қалалық жағдайда айналысатын мамандардың мөлшерлемелерімен салыстырғанда жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтiк мөлшерлемелер белгiлеу туралы
