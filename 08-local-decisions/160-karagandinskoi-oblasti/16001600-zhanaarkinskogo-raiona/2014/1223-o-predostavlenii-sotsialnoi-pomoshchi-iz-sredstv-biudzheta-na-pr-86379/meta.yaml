requisite: Решение XХХVIII сессии Жанааркинского районного маслихата Карагандинской области от 23 декабря 2014 года № 38/255. Зарегистрировано Департаментом юстиции Карагандинской области 14 января 2015 года № 2921. Утратило силу решением Жанааркинского районного маслихата Карагандинской области от 10 декабря 2020 года № 64/517 (вводится в действие со дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи из средств бюджета на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Жанааркинского района
  kaz: Жаңаарқа ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін бюджет қаражаты есебінен әлеуметтік көмек беру туралы
