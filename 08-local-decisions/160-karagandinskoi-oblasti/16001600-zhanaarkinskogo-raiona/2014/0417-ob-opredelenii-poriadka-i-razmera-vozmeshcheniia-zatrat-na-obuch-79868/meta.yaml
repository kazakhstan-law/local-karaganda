requisite: Решение XХХ сессии Жанааркинского районного маслихата Карагандинской области от 17 апреля 2014 года № 30/192. Зарегистрировано Департаментом юстиции Карагандинской области 12 мая 2014 года № 2637. Утратило силу решением Жанааркинского районного маслихата области Ұлытау от 3 ноября 2023 года № 9/70 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Жанааркинском районе области Ұлытау
  kaz: Ұлытау облысы Жаңаарқа ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы
