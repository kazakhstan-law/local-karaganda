act_code: '86382'
requisite: Решение XХХVIII сессии Жанааркинского районного маслихата Карагандинской области от 23 декабря 2014 года № 38/253. Зарегистрировано Департаментом юстиции Карагандинской области 14 января 2015 года № 2922
title:
  rus: 'О предоставлении мер социальной поддержки в виде подъемного пособия и кредита для приобретения или строительства жилья специалистам здравоохранения, образования,  социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жанааркинского района в 2015 году '
  kaz: '2015 жылы Жаңаарқа ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға несие түрінде әлеуметтік қолдау шараларын ұсыну туралы  '
