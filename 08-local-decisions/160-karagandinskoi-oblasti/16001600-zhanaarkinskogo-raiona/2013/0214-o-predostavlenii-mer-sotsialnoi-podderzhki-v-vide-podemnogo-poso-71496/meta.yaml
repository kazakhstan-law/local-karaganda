requisite: Решение XV сессии Жанааркинского районного маслихата Карагандинской области от 14 февраля 2013 года № 15/96. Зарегистрировано Департаментом юстиции Карагандинской области 13 марта 2013 года № 2225. Утратило силу решением Жанааркинского районного маслихата Карагандинской области от 25 декабря 2013 года № 25/159
title:
  rus: О предоставлении мер социальной поддержки в виде подъемного пособия и кредита для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Жанааркинского района в 2013 году
  kaz: 2013 жылы Жаңаарқа ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға несие түрінде әлеуметтік қолдау шараларын ұсыну туралы
