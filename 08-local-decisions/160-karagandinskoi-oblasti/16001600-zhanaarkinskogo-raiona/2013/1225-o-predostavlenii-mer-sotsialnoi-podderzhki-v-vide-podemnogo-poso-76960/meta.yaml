  title:
    rus: О внесении изменений в решение 25 сессии Жанааркинского районного маслихата от 25 декабря 2013 года № 25/159 "О предоставлении мер социальной поддержки в виде подъемного пособия и кредита для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Жанааркинского района в 2014 году"
    kaz: Жаңаарқа аудандық мәслихатының 25 сессиясының 2013 жылғы 25 желтоқсандағы № 25/159 "2014 жылы Жаңаарқа ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға несие түрінде әлеуметтік қолдау шараларын ұсыну туралы" шешіміне өзгерістер енгізу туралы
