requisite: Решение XХV сессии Жанааркинского районного маслихата Карагандинской области от 25 декабря 2013 года № 25/159. Зарегистрировано Департаментом юстиции Карагандинской области 23 января 2014 года № 2522. Утратило силу решением Жанааркинского районного маслихата Карагандинской области от 24 ноября 2014 года № 37/245
title:
  rus: О предоставлении мер социальной поддержки в виде подъемного пособия и кредита для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жанааркинского района в 2014 году
  kaz: 2014 жылы Жаңаарқа ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға несие түрінде әлеуметтік қолдау шараларын ұсыну туралы
