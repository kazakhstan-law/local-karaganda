act_code: '36402'
requisite: Қарағанды облысы Жаңаарқа ауданы мәслихатының 2007 жылғы 21 желтоқсандағы № 5/44 шешімі. Қарағанды облысы Жаңаарқа ауданы әділет басқармасында 2007 жылғы 29 желтоқсанда № 8-12-40 тіркелді. Қолданылу мерзімінің аяқталуына байланысты шешімнің күші жойылды - Қарағанды облысы Жаңаарқа аудандық мәслихат аппараты хатшысының 2013 жылғы 1 қазандағы № 01-18/48 хатымен
