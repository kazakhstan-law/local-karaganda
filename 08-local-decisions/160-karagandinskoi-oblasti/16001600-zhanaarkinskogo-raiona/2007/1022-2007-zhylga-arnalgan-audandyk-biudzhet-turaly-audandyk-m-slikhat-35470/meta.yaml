act_code: '35470'
requisite: Қарағанды облысы Жаңаарқа ауданы мәслихатының 2007 жылғы 22 қазандағы № 3/23 шешімі. Қарағанды облысы Жаңаарқа ауданы әділет басқармасында 2007 жылғы 24 қазанда № 8-12-36 тіркелді. Қолданылу мерзімінің аяқталуына байланысты шешімнің күші жойылды - Қарағанды облысы Жаңаарқа аудандық мәслихат аппараты хатшысының 2013 жылғы 1 қазандағы № 01-18/48 хатымен
