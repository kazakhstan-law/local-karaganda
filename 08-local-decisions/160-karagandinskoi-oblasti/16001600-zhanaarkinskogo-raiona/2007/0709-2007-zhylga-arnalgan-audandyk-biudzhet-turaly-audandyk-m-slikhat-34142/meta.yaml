act_code: '34142'
requisite: Қарағанды облысы Жаңаарқа ауданы мәслихатының 2007 жылғы 9 шілдедегі № 39/312 шешімі. Қарағанды облысы Жаңаарқа ауданы әділет басқармасында 2007 жылғы 16 шілдеде № 8-12-31 тіркелді. Қолданылу мерзімінің аяқталуына байланысты шешімнің күші жойылды - Қарағанды облысы Жаңаарқа аудандық мәслихат аппараты хатшысының 2013 жылғы 1 қазандағы № 01-18/48 хатымен
