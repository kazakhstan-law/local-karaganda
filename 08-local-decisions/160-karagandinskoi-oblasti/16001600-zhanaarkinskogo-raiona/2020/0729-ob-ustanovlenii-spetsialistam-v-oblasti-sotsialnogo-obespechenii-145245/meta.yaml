act_code: '145245'
requisite: Решение Жанааркинского районного маслихата Карагандинской области от 29 июля 2020 года № 57/389. Зарегистрировано Департаментом юстиции Карагандинской области 1 августа 2020 года № 5992. Утратило силу решением Жанааркинского районного маслихата Карагандинской области от 18 февраля 2021 года № 2/15 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении специалистам в области социального обеспечения, образования, культуры и спорта, являющимся гражданскими служащими и работающим в сельских населенных пунктах, а также специалистам, работающим в государственных организациях, финансируемых из местных бюджетов повышенные не менее чем на двадцать пять процентов оклады и тарифные ставки по сравнению со ставками специалистов, занимающихся этими видами деятельности в городских условиях
  kaz: Азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет және спорт саласындағы мамандарға, сондай-ақ жергілікті бюджеттерден қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін мамандарға қызметтiң осы түрлерiмен қалалық жағдайда айналысатын мамандардың мөлшерлемелерімен салыстырғанда кемiнде жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтiк мөлшерлемелер белгiлеу туралы
