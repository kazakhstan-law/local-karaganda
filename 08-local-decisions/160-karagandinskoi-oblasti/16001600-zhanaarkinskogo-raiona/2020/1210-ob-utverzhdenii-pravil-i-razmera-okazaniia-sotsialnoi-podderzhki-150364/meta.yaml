act_code: '150364'
requisite: Решение Жанааркинского районного маслихата Карагандинской области от 10 декабря 2020 года № 64/517. Зарегистрировано Департаментом юстиции Карагандинской области 24 декабря 2020 года № 6131
title:
  rus: Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Жанааркинского района
  kaz: Жаңаарқа ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету қағидалары мен мөлшерін бекіту туралы
