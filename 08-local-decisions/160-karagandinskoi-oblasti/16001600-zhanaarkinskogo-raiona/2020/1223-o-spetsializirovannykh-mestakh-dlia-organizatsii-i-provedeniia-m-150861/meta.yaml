  title:
    rus: О внесении изменения и дополнения в решение Жанааркинского районного маслихата от 23 декабря 2020 года № 66/527 «О специализированных местах для организации и проведения мирных собраний, порядок использования специализированных мест для организации и проведения мирных собраний, нормы их предельной заполняемости, а также требования к материально–техническому и организационному обеспечению специализированных мест для организации и проведения мирных собраний и границ прилегающих территорий, в которых запрещено проведение пикетирования на территории Жанааркинского района»
    kaz: Жаңаарқа аудандық мәслихатының 2020 жылғы 23 желтоқсандағы № 66/527 «Жаңаарқа ауданының аумағында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды пайдалану тәртібін, олардың шекті толу нормаларын, сондай–ақ бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптар мен пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекаралары туралы» шешіміне өзгеріс пен толықтыру енгізу туралы
