act_code: '128548'
requisite: Решение Жанааркинского районного маслихата Карагандинской области от 28 декабря 2018 года № 37/263. Зарегистрировано Департаментом юстиции Карагандинской области 11 января 2019 года № 5143. Утратило силу решением Жанааркинского районного маслихата Карагандинской области от 28 августа 2019 года № 44/307 (вводится в действие со дня его первого официального опубликования)
title:
  rus: О предоставлении в 2019 году мер социальной поддержки в виде подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жанааркинского района
  kaz: Жаңаарқа ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит түрінде әлеуметтік қолдау шараларын ұсыну туралы
