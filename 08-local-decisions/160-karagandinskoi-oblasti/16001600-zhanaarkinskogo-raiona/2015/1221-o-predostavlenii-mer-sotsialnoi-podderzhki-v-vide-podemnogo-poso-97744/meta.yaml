act_code: '97744'
requisite: Решение XLIX сессии Жанааркинского районного маслихата Карагандинской области от 21 декабря 2015 года № 49/344. Зарегистрировано Департаментом юстиции Карагандинской области 11 января 2016 года № 3608
title:
  rus: О предоставлении мер социальной поддержки в виде подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания  в сельские населенные пункты Жанааркинского района в 2016 году
  kaz: 2016 жылы Жаңаарқа ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға бюджеттік кредит түрінде әлеуметтік қолдау шараларын ұсыну туралы
