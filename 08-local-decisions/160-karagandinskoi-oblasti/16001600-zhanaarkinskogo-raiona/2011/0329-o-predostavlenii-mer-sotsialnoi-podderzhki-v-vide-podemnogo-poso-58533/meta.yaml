requisite: Решение XXXIV сессии Жанааркинского районного маслихата Карагандинской области от 29 марта 2011 года № 34/297. Зарегистрировано Управлением юстиции Жанааркинского района Карагандинской области 25 апреля 2011 года № 8-12-106. Утратило силу - решением Жанааркинского районного маслихата Карагандинской области от 25 февраля 2012 года № 2/16
title:
  rus: О предоставлении мер социальной поддержки в виде подъемного пособия и кредита для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Жанааркинского района в 2011 году
  kaz: 2011 жылы Жаңаарқа ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға несие түрінде әлеуметтік қолдау шараларын ұсыну туралы
