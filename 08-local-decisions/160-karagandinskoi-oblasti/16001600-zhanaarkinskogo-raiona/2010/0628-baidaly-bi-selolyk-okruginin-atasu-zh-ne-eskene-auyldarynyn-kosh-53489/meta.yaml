act_code: '53489'
requisite: Қарағанды облысы Жаңаарқа ауданының Байдалы би селолық округі әкімінің 2010 жылғы 28 маусымдағы № 1 шешімі. Қарағанды облысы Жаңаарқа ауданының Әділет басқармасында 2010 жылғы 12 шілдеде № 8-12-77 тіркелді
