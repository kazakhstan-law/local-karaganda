requisite: Қарағанды облысы Жаңаарқа ауданы әкімінің 2010 жылғы 6 желтоқсандағы № 1 шешімі. Қарағанды облысы Жаңаарқа ауданының Әділет басқармасында 2010 жылғы 8 желтоқсанда № 8-12-97 тіркелді. Күші жойылды - Қарағанды облысы Жаңаарқа ауданы әкімінің 2011 жылғы 22 қарашадағы № 2 шешімімен
