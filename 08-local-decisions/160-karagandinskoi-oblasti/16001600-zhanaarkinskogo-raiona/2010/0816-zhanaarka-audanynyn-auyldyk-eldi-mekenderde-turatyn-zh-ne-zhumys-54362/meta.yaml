requisite: Қарағанды облысы Жаңаарқа ауданы мәслихатының 2010 жылғы 16 тамыздағы № 25/228 шешімі. Қарағанды облысы Жаңаарқа ауданының Әділет басқармасында 2010 жылғы 6 қыркүйекте № 8-12-79 тіркелді. Күші жойылды - Қарағанды облысы Жаңаарқа аудандық мәслихатының 2014 жылғы 23 желтоқсандағы № 38/254 шешімімен
