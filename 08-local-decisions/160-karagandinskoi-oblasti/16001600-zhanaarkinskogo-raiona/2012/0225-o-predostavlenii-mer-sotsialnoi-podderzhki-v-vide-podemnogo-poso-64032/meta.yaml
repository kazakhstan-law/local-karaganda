  title:
    rus: О внесении изменений и дополнений в решение 2 сессии Жанааркинского районного маслихата от 25 февраля 2012 года № 2/16 "О предоставлении мер социальной поддержки в виде подъемного пособия и кредита для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Жанааркинского района в 2012 году"
    kaz: Жаңаарқа аудандық мәслихатының 2012 жылғы 25 ақпандағы 2 сессиясының "2012 жылы Жаңаарқа ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға несие түрінде әлеуметтік қолдау шараларын ұсыну туралы" № 2/16 шешіміне өзгерістер мен толықтырулар енгізу туралы
