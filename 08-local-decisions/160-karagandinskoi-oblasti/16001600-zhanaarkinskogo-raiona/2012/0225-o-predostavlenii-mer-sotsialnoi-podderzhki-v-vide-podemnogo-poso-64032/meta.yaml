requisite: Решение II сессии Жанааркинского районного маслихата Карагандинской области от 25 февраля 2012 года № 2/16. Зарегистрировано Управлением юстиции Жанааркинского района Карагандинской области 12 марта 2012 года № 8-12-124. Утратило силу решением XV сессии Жанааркинского районного маслихата Карагандинской области от 14 февраля 2013 года № 15/96
title:
  rus: О предоставлении мер социальной поддержки в виде подъемного пособия и кредита для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Жанааркинского района в 2012 году
  kaz: 2012 жылы Жаңаарқа ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға несие түрінде әлеуметтік қолдау шараларын ұсыну туралы
