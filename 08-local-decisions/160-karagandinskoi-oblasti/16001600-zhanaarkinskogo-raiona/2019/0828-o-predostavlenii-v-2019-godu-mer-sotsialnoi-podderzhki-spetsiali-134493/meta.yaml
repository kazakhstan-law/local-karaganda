act_code: '134493'
requisite: Решение Жанааркинского районного маслихата Карагандинской области от 28 августа 2019 года № 44/307. Зарегистрировано Департаментом юстиции Карагандинской области 6 сентября 2019 года № 5456
title:
  rus: О предоставлении в 2019 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жанааркинского района
  kaz: Жаңаарқа ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылы әлеуметтік қолдау шараларын ұсыну туралы
