act_code: '138671'
requisite: Решение Жанааркинского районного маслихата Карагандинской области от 31 декабря 2019 года № 49/338. Зарегистрировано Департаментом юстиции Карагандинской области 15 января 2020 года № 5682
title:
  rus: О предоставлении в 2020 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жанааркинского района
  kaz: Жаңаарқа ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы әлеуметтік қолдау шараларын ұсыну туралы
