requisite: Решение акима Сарытерекского сельского округа Актогайского района Карагандинской области от 29 октября 2013 года № 1. Зарегистрировано Департаментом юстиции Карагандинской области 6 ноября 2013 года № 2413. Утратило силу решением акима Сарытерекского сельского округа Актогайского района Карагандинской области от 22 августа 2024 года № 04 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении ветеринарного режима карантинной зоны с введением ограничительных мероприятий на территорию зимовки "Аксай" Сарытерекского сельского округа Актогайского района Карагандинской области
  kaz: Қарағанды облысы Ақтоғай ауданы Сарытерек селолық округінің "Ақсай" қыстағы аумағына шектеу іс-шараларын енгізе отырып карантин аймағының ветеринариялық режимін белгілеу туралы
