act_code: '43952'
requisite: Решение ХII сессии Каражалского городского маслихата Карагандинской области от 22 декабря 2008 года № 101. Зарегистрировано Управлением юстиции города Каражал Карагандинской области 4 февраля 2009 года № 8-5-63
title:
  rus: О снижении базовых ставок на земли промышленности (включая шахты, карьеры) и их санитарно-защитные, технические и иные зоны, расположенные в черте населенных пунктов, но за пределами селитебной территории
  kaz: Елдi мекендер шегінде, бiрақ селитебтi аумақтан тыс орналасқан өнеркәсiп жерлерiне (шахталарды, карьерлерді қоса алғанда) және олардың санитариялық-қорғаныштық, техникалық және өзге де аймақтарына базалық ставкаларды төмендету туралы
