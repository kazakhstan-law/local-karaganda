    kaz: Қаражал қалалық мәслихатының 2018 жылғы 17 тамыздағы № 228 «Салық салу мақсаттары үшін Қаражал қаласының, Шалғы және Жәйрем кенттерінің жерлерін аймақтарға бөлу жобаларын (схемаларын) бекіту туралы» шешіміне өзгерістер енгізу туралы
