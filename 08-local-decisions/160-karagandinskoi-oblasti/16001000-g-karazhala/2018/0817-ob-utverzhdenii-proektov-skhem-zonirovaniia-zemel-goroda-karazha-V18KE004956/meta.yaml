  title:
    rus: О признании утратившим силу решений Каражалского городского маслихата «Об утверждении проектов (схем) зонирования земель города Каражал, поселков Шалгинск и Жайрем и о корректировке базовых ставок земельного налога» от 17 августа 2018 года № 228 и Каражалского городского маслихата «О внесении изменений в решение Каражалского городского маслихата от 17 августа 2018 года № 228 «Об утверждении проектов (схем) зонирования земель города Каражал, поселков Шалгинск и Жайрем для целей налогообложения» от 23 сентября 2022 года № 183
    kaz: Қаражал қалалық мәслихатының «Қаражал қаласының, Шалғы және Жәйрем кенттерінің жерлерін аймақтарға бөлу жобаларын (схемаларын) бекіту және жер салығының базалық мөлшерлемелерін түзету туралы» 2018 жылғы 17 тамыздағы № 228 және «Қаражал қалалық мәслихатының 2018 жылғы 17 тамыздағы № 228 «Салық салу мақсаттары үшін Қаражал қаласының, Шалғы және Жәйрем кенттерінің жерлерін аймақтарға бөлу жобаларын (схемаларын) бекіту туралы» шешіміне өзгерістер енгізу туралы» 2022 жылғы 23 қыркүйектегі № 183 шешімдерінің күштері жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/220840/rus
