  code: '139622'
  requisite: Решение Каражалского городского маслихата Карагандинской области от 10 февраля 2020 года № 362. Зарегистрировано Департаментом юстиции Карагандинской области 17 февраля 2020 года № 5704. Утратило силу решением Каражалского городского маслихата области Ұлытау от 27 декабря 2023 года № 99 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в решение ХХ сессии Каражалского городского маслихата от 25 декабря 2017 года № 189 «Об утверждении норм образования и накопления коммунальных отходов, а также тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по городу Каражал»
    kaz: Қаражал қалалық мәслихатының 2017 жылғы 25 желтоқсандағы ХХ сессиясының № 189 «Қаражал қаласы бойынша коммуналдық қалдықтардың пайда болуы және жинақталу нормаларын, сондай-ақ тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы» шешіміне өзгерістер енгізу туралы
