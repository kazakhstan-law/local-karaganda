act_code: '118410'
requisite: Решение XX сессии Каражалского городского маслихата Карагандинской области от 25 декабря 2017 года № 189. Зарегистрировано Департаментом юстиции Карагандинской области 19 января 2018 года № 4585. Утратило силу решением Каражалского городского маслихата области Ұлытау от 27 декабря 2023 года № 99 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, а также тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по городу Каражал
  kaz: Қаражал қаласы бойынша коммуналдық қалдықтардың пайда болуы және жинақталу нормаларын, сондай ақ тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы
