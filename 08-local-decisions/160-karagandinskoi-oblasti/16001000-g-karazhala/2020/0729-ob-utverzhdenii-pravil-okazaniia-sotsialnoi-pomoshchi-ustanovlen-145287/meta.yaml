  title:
    rus: О внесении изменений в решение Каражалского городского маслихата от 29 июля 2020 года № 421 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Каражал»
    kaz: Қаражал қалалық мәслихатының 2020 жылғы 29 шілдедегі № 421 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Қаражал қаласының мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
