  title:
    rus: О внесении изменений в решение L сессии Каражалского городского маслихата от 29 июля 2020 года № 421 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Каражал»
