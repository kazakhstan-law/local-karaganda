  title:
    rus: О внесении изменений и дополнения в решение Каражалского городского маслихата от 29 июля 2020 года № 420 «О специализированных местах для организации и проведения мирных собраний и границах, прилегающих территорий, в которых запрещено проведение пикетирования на территории города Каражал»
    kaz: Қаражал қалалық мәслихатының 2020 жылғы 29 шілдедегі № 420 «Қаражал қаласының аумағында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындар және пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекаралары туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
