  title:
    rus: О внесении изменения и дополнения в решение ХХVІ сессии Каражалского городского Маслихата от 13 июля 2006 года № 26/259 "Об утверждении правил предоставления малообеспеченным гражданам города Каражал жилищных пособий на содержания жилья, оплату коммунальных услуг, компенсацию повышения тарифов абонентской платы за телефон абонентам городских сетей телекоммуникаций"
    kaz: '"Қаражал қаласының аз қамтылған азаматтарына тұрғын үйді ұстау, коммуналдық қызметтер ақысын төлеу, қалалық телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің көтерілуіне байланысты өтемақы төлеу үшін тұрғын үй жәрдемақысын беру Қағидасын бекіту туралы" қалалық Мәслихаттың XXV сессиясының 2006 жылғы 13 шілдедегі № 26/259 шешіміне толықтыру мен өзгеріс енгізу туралы'
