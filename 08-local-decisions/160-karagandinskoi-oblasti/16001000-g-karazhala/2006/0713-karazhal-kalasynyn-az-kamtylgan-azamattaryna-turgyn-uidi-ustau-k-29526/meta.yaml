  title:
    rus: О внесении изменений и дополнений в решение XXVI сессии Каражалского городского Маслихата от 13 июля 2006 года № 26/259 "Об утверждении Правил предоставления малообеспеченным гражданам города Каражал жилищных пособий на содержание жилья, оплату коммунальных услуг, компенсацию повышения тарифов абонентской платы за телефон абонентам городских сетей телекоммуникаций"
    kaz: Қаражал қалалық Мәслихатының 2006 жылғы 13 шілдедегі XXVI сессиясының "Қаражал қаласының аз қамтылған азаматтарына тұрғын үйді ұстау, коммуналдық қызметтер ақысын төлеу, қалалық телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің көтерілуіне байланысты өтемақы төлеу үшін тұрғын үй жәрдемақысын беру Қағидасын бекіту туралы" № 26/259 шешіміне өзгерістер мен толықтырулар енгізу туралы
