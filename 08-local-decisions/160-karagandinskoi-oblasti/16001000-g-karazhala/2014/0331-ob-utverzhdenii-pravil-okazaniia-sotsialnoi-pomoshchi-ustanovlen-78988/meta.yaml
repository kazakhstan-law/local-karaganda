  title:
    rus: О внесении изменений и дополнений в решение XXVIII сессии Каражалского городского маслихата от 31 марта 2014 года № 216 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Каражал»
    kaz: Қаражал қалалық мәслихатының 2014 жылғы 31 наурыздағы ХХVIII сессиясының № 216 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Қаражал қаласының мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
