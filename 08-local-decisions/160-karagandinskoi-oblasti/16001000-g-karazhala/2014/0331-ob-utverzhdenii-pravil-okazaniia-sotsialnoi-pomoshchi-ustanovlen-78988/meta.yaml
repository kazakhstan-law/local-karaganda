  title:
    rus: О внесении изменения в решение XXVIII сессии Каражалского городского маслихата от 31 марта 2014 года № 216 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Каражал»
    kaz: Қаражал қалалық мәслихатының 2014 жылғы 31 наурыздағы XXVIII сессиясының № 216 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Қаражал қаласының мұқтаж азаматтарының жекелеген санаттарының  тізбегін айқындау қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
