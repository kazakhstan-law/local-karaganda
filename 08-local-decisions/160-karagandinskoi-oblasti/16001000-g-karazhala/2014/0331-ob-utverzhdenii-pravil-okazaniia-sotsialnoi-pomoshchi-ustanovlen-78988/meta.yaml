requisite: Решение ХXVIII сессии Каражалского городского маслихата Карагандинской области от 31 марта 2014 года № 216. Зарегистрировано Департаментом юстиции Карагандинской области 18 апреля 2014 года № 2593. Утратило силу решением Каражалского городского маслихата Карагандинской области от 29 июля 2020 года № 421 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Каражал
  kaz: Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Қаражал қаласының мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы
