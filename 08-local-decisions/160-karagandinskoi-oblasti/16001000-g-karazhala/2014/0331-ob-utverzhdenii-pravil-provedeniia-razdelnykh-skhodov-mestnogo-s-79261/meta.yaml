  title:
    rus: О внесении изменения в решение XXVIII сессии Каражалского городского маслихата от 31 марта 2014 года № 219 «Об утверждении правил проведения раздельных сходов местного сообщества жителей улицы, многоквартирного жилого дома на территории посёлка Жайрем»
    kaz: Қаражал қалалық мәслихатының 2014 жылғы 31 наурыздағы ХХVIII сессиясының № 219 «Жәйрем кентінің аумағында көшенің, көппәтерлі тұрғын үй тұрғындарының бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
