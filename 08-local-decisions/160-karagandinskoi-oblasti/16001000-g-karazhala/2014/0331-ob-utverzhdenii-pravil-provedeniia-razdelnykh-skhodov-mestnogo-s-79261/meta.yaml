requisite: Решение ХXVIII сессии Каражалского городского маслихата Карагандинской области от 31 марта 2014 года № 219. Зарегистрировано Департаментом юстиции Карагандинской области 28 апреля 2014 года № 2623. Утратило силу решением Каражалского городского маслихата Карагандинской области от 24 декабря 2021 года № 82 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества жителей улицы, многоквартирного жилого дома на территории поселка Жайрем
