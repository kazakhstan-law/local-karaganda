requisite: Решение Темиртауского городского маслихата Карагандинской области от 26 июня 2018 года № 27/6. Зарегистрировано Департаментом юстиции Карагандинской области 12 июля 2018 года № 4873. Утратило силу решением Темиртауского городского маслихата Карагандинской области от 23 января 2026 года № 39/6 (вводится в действие по истечению десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении проекта (схемы) зонирования земель города Темиртау и повышении ставок земельного налога
  kaz: Теміртау қаласының жерлерін аймақтарға бөлу жобасын (схемасын) бекіту және жер салығының мөлшерлемелерін арттыру туралы
