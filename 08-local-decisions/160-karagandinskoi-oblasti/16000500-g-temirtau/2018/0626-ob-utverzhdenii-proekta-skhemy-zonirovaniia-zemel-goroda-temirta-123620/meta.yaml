  requisite: Решение Темиртауского городского маслихата Карагандинской области от 28 ноября 2019 года № 47/6. Зарегистрировано Департаментом юстиции Карагандинской области 10 декабря 2019 года № 5575. Утратило силу решением Темиртауского городского маслихата Карагандинской области от 23 января 2026 года № 39/6 (вводится в действие по истечению десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в решение 27 сессии Темиртауского городского маслихата от 26 июня 2018 года № 27/6 «О понижении или повышении ставок земельного налога и об утверждении схемы зонирования земель города Темиртау для целей налогообложения»
    kaz: Теміртау қалалық мәслихатының 2018 жылғы 26 маусымдағы 27 сессиясының № 27/6 «Жер салығының ставкаларын төмендету немесе жоғарылату туралы және салық салу мақсаты үшін Теміртау қаласы жерлерін аймақтарға бөлу схемасын бекіту туралы» шешіміне өзгеріс енгізу туралы
