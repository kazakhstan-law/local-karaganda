title:
  rus: Об утверждении проекта (схемы) зонирования земель города Темиртау и повышении ставок земельного налога
  kaz: Теміртау қаласының жерлерін аймақтарға бөлу жобасын (схемасын) бекіту және жер салығының мөлшерлемелерін арттыру туралы
