title:
  rus: Об утверждении минимального размера расходов на управление объектом кондоминиума и содержание общего имущества объекта кондоминиума по городу Темиртау и поселку Актау на 2022 год
  kaz: Теміртау қаласы және Ақтау кенті бойынша 2022 жылға арналған кондоминиум объектісін басқаруға және кондоминиум объектісінің ортақ мүлкін күтіп-ұстауға арналған шығыстардың ең төмен мөлшерін бекiту туралы.
