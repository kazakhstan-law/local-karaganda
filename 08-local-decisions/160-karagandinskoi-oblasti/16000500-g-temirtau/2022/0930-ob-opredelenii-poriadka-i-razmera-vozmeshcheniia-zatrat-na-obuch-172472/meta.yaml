  title:
    rus: О внесении изменений в решение Темиртауского городского маслихата Карагандинской области от 30 сентября 2022 года № 33/4 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану по городу Темиртау и поселку Актау»
    kaz: Қарағанды облысы Теміртау қалалық мәслихатының 2022 жылғы 30 қыркүйектегі № 33/4 «Теміртау қаласы мен Ақтау кенті бойынша мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі және мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
