  requisite: Решение Темиртауского городского маслихата Карагандинской области от 3 сентября 2009 года № 20/6. Зарегистрировано Управлением юстиции города Темиртау Карагандинской области 7 октября 2009 года № 8-3-86. Утратило силу - решением Темиртауского городского маслихата Карагандинской области от 14 сентября 2010 года № 31/5
  title:
    rus: О внесении изменений и дополнений в решение 31 сессии Темиртауского городского маслихата от 14 июля 2006 года № 31/7 "Об утверждении Правил предоставления малообеспеченным гражданам жилищного пособия на содержание жилья, оплату коммунальных услуг и компенсацию повышения тарифов абонентской платы за телефон абонентам городских сетей телекоммуникаций"
    kaz: Теміртау қалалық мәслихаттың 2006 жылғы 14 шілдедегі 31 сессиясының № 31/7 "Аз қамтылған азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақыларды беру және қалалық телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы берудің Қағидасын бекіту туралы" шешіміне өзгертулер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/48072/rus
