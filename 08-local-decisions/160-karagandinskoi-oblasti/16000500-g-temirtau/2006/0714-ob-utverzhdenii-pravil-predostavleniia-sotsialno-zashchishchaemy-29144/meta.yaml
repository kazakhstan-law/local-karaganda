requisite: Решение Темиртауского городского маслихата Карагандинской области от 14 июля 2006 года № 31/7. Зарегистрировано Управлением юстиции города Темиртау 3 августа 2006 года № 8-3-24. Утратило силу - решением Темиртауского городского маслихата Карагандинской области от 14 сентября 2010 года № 31/5
title:
  rus: Об утверждении Правил предоставления социально защищаемым гражданам жилищного пособия на содержание жилья, оплату коммунальных услуг и компенсацию повышения тарифов абонентской платы за оказание услуг телекоммуникаций
  kaz: Әлеуметтік тұрғыдан қорғалатын азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақыларды беру және қызмет көрсету үшін абоненттік ақы тарифтерінің арттырылуына өтемақы берудің Қағидасын бекіту туралы
