  title:
    rus: О внесении изменений в решение 35 сессии Темиртауского городского маслихата от 24 декабря 2014 года № 35/5 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Темиртау и поселка Актау»
    kaz: Теміртау қалалық мәслихатының 2014 жылғы 24 желтоқсандағы 35 сессиясының № 35/5 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Теміртау қаласы мен Ақтау кентінің мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
