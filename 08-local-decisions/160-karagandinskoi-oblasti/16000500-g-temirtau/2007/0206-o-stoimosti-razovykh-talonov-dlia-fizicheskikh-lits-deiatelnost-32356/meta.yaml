requisite: Решение Темиртауского городского маслихата Карагандинской области от 6 февраля 2007 года № 38/7. Зарегистрировано управлением юстиции города Темиртау 13 марта 2007 года за № 8-3-37. Утратило силу решением Темиртауского городского маслихата Карагандинской области от 12 марта 2009 года № 16/5
title:
  rus: О стоимости разовых талонов для физических лиц, деятельность которых носит эпизодический характер, ставках сборов на рынках и размерах ставок фиксированного суммарного налога с единицы объектов налогообложения
  kaz: Қызметін эпизотикалық сипатта атқаратын жеке тұлғалар үшін бір реттік талондар құны, базарлардағы алым ставкасы және әр бір салық салынатын обьектілерге бекітілген салық сомасы ставкасы туралы
