    kaz: Теміртау қалалық мәслихаттың 2009 жылғы 12 наурыздағы 16 сессиясының № 16/5 "Қызметін эпизотикалық сипатта атқаратын жеке тұлғалар үшін бір реттік талондар құны, базарлардағы алым ставкасы және әр бір салық салынатын объектілерге бекітілген салық ставкасы туралы" шешіміне өзгертулер енгізу туралы
