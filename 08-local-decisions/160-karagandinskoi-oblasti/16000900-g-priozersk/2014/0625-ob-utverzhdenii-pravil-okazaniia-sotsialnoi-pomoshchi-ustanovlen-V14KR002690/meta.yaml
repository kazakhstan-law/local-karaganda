  title:
    rus: О внесении изменений в решение XXXIV сессии Приозерского городского маслихата от 25 июня 2014 года № 34/238 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Приозерск»
    kaz: Приозерск қалалық мәслихатының 2014 жылғы 25 маусымдағы XXXIV сессиясының № 34/238 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің Приозерск қаласының мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
