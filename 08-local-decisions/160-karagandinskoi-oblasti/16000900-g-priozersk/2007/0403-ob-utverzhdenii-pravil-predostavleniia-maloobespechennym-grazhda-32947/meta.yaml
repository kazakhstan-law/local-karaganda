act_code: '32947'
requisite: Решение Приозерского городского маслихата Карагандинской области от 3 апреля 2007 года № 231/38. Зарегистрировано Управлением юстиции города Балхаша Карагандинской области 24 апреля 2007 года за № 8-4-70. Утратило силу - решением Приозерского городского маслихата Карагандинской области от 13 сентября 2010 года № 201/29
title:
  rus: Об утверждении Правил предоставления малообеспеченным гражданам жилищных пособий на содержание жилья, оплату коммунальных услуг и компенсацию повышения тарифов абонентской платы за телефон абонентам городских сетей телекоммуникаций
  kaz: Аз қамтылған азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақыларын беру және қалалық телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы беру Қағидаларын бекіту туралы
