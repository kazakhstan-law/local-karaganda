  title:
    rus: О внесении изменений и дополнений в решение Приозерского городского маслихата от 22 декабря 2023 года № 12/74 «Об утверждении Правила оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан города Приозерск»
    kaz: Приозерск қалалық мәслихатының 2023 жылғы 22 желтоқсандағы № 12/74 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Приозерск қаласының мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
