  title:
    rus: О внесении дополнения в решение Приозерского городского маслихата от 22 декабря 2023 года № 12/74 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан города Приозерск»
    kaz: Приозерск қалалық мәслихатының 2023 жылғы 22 желтоқсандағы № 12/74 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Приозерск қаласындағы мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне толықтыру енгізу туралы
