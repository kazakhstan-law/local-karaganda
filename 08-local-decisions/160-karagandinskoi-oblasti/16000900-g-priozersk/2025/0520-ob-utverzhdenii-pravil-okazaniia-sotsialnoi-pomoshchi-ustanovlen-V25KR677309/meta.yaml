requisite: Решение Приозерского городского маслихата Карагандинской области от 20 мая 2025 года № 28/216. Зарегистрировано Департаментом юстиции Карагандинской области 21 мая 2025 года № 6773-09. Утратило силу решением Приозерского городского маслихата Карагандинской области от 29 апреля 2026 года № 40/300 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан города Приозерск
  kaz: Приозерск қаласының әлеуметтік көмек көрсетудің, оның мөлшерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы
