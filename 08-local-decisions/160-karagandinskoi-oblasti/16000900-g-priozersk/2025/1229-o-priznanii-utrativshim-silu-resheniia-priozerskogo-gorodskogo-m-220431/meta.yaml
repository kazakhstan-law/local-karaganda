title:
  rus: О признании утратившим силу решения Приозерского городского маслихата от 27 июня 2023 года № 6/42 «О понижении размера ставки налогов при применении специального налогового режима розничного налога в городе Приозерск Карагандинской области»
  kaz: «Қарағанды облысының Приозерск қаласында бөлшек салықтың арнаулы салық режимін қолдану кезінде салық мөлшерлемесінің мөлшерін төмендету туралы» 2023 жылғы 27 маусымдағы № 6/42 Приозерск қалалық мәслихатының шешімінің күшін жою туралы
