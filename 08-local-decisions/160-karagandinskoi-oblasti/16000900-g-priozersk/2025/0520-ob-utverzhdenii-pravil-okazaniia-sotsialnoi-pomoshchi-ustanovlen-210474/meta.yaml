  title:
    rus: О внесении изменений и дополнений в решение Приозерского городского маслихата от 20 мая 2025 года № 28/216 «Правила оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан города Приозерск»
    kaz: Приозерск қалалық мәслихатының 2025 жылғы 20 мамырдағы № 28/216 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
