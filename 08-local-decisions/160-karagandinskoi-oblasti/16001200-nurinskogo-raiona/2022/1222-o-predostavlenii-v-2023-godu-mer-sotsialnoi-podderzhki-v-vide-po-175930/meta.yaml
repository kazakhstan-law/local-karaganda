act_code: '175930'
requisite: Решение Нуринского районного маслихата Карагандинской области от 22 декабря 2022 года № 209
title:
  rus: О предоставлении в 2023 году мер социальной поддержки в виде подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Нуринского района
  kaz: Нұра ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит түрінде әлеуметтік қолдау шараларын 2023 жылы ұсыну туралы
