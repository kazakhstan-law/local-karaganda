requisite: Решение Нуринского районного маслихата Карагандинской области от 7 октября 2022 года № 181
title:
  rus: Об утверждении Порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села Тассуат Нуринского района Карагандинской области для участия в сходе местного сообщества
  kaz: Қарағанды облысы Нұра ауданы Тассуат ауылының жергілікті қоғамдастық жиындарына қатысу үшін жергілікті қоғамдастықтың бөлек жиындарын өткізу тәртібі және ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
