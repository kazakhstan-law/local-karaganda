  title:
    rus: О внесении изменений в решение 2 сессии Нуринского районного маслихата от 16 февраля 2012 года № 20 "О предоставлении мер социальной поддержки в виде подъемного пособия и кредита для покупки жилья специалистам, прибывшим для работы и проживания в сельские населенные пункты Нуринского района в 2012 году"
    kaz: Нұра аудандық мәслихатының 2012 жылғы 16 ақпандағы 2 сессиясының "2012 жылғы Нұра ауданының ауылдық елді мекендерге жұмыс істеуге және тұру үшін келген мамандарына әлеуметтік қолдау шараларын көтерме жәрдемақы және тұрғын үй сатып алу үшін кредит түрінде ұсыну туралы" № 20 шешіміне өзгерістер енгізу туралы
