requisite: Решение 2 сессии Нуринского районного маслихата Карагандинской области от 16 февраля 2012 года № 20. Зарегистрировано Управлением юстиции Нуринского района Карагандинской области 11 марта 2012 года № 8-14-169. Утратило силу решением 17 сессии Нуринского районного маслихата Карагандинской области от 20 марта 2013 года № 166
title:
  rus: О предоставлении в 2012 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Нуринского района
  kaz: 2012 жылға арналған Нұра ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну туралы
