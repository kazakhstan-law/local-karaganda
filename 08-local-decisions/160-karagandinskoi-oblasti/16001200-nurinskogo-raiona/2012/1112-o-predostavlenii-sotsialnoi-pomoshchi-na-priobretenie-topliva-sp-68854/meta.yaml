requisite: Решение 13 сессии Нуринского районного маслихата Карагандинской области от 12 ноября 2012 года № 129. Зарегистрировано Департаментом юстиции Карагандинской области 29 ноября 2012 года № 1994. Утратило силу решением Нуринского районного маслихата Карагандинской области от 19 февраля 2021 года № 17 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
