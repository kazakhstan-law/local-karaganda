title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры и спорта, проживающим и работающим в сельских населенных пунктах
  kaz: Әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мемлекеттік ұйымдарының ауылдық елді мекендерде тұратын және жұмыс істейтін мамандарына отын сатып алуға әлеуметтік көмек беру туралы
