requisite: Решение 17 сессии Нуринского районного маслихата Карагандинской области от 20 марта 2013 года № 166. Зарегистрировано Департаментом юстиции Карагандинской области 15 апреля 2013 года № 2307. Утратило силу решением Нуринского районного маслихата Карагандинской области от 27 марта 2014 года № 240
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Нуринского района в 2013 году
  kaz: 2013 жылға арналған Нұра ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну туралы
