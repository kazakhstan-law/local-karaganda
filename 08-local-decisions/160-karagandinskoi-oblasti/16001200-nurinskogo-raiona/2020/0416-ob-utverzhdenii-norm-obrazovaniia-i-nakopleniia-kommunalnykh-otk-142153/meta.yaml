title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, а также тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Нуринскому району
  kaz: Нұра ауданы бойынша коммуналдық қалдықтардың пайда болуы және жинақталу нормаларын, сондай-ақ тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифті бекіту туралы
