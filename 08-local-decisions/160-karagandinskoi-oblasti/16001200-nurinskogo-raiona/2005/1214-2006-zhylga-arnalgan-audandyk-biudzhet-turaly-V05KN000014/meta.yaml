requisite: Қарағанды облысы Нұра аудандық мәслихатының 20 сессиясының 2005 жылғы 14 желтоқсандағы № 205 шешімі. Қарағанды облысы Нұра ауданы әділет басқармасында 2005 жылғы 21 желтоқсанда № 8-14-14 тіркелді. Қолданылу мерзімінің өтуіне байланысты күші жойылды – Қарағанды облысы Нұра аудандық мәслихатының 2013 жылғы 4 шілдедегі № 54 хатымен
