act_code: '99134'
requisite: Решение 42 сессии Нуринского районного маслихата Карагандинской области от 18 января 2016 года № 441. Зарегистрировано Департаментом юстиции Карагандинской области 10 февраля 2016 года № 3657
title:
  rus: О предоставлении в 2016 году мер социальной  поддержки в виде подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Нуринского района
  kaz: Нұра ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіп кешенінің мамандарына көтерме жәрдемақы  және тұрғын үй сатып алуға немесе салуға бюджеттік несие түрінде әлеуметтік қолдау шараларын 2016  жылы ұсыну туралы
