act_code: '109091'
requisite: Решение 9 сессии Нуринского районного маслихата Карагандинской области от 22 декабря 2016 года № 90. Зарегистрировано Департаментом юстиции Карагандинской области 9 января 2017 года № 4095
title:
  rus: О предоставлении в 2017 году мер социальной поддержки в виде подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Нуринского района
  kaz: Нұра ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіп кешенінің мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға бюджеттік несие түрінде әлеуметтік қолдау шараларын 2017 жылы ұсыну туралы
