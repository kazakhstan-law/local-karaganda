act_code: '86168'
requisite: Решение 33 сессии Нуринского районного маслихата Карагандинской области от 24 декабря 2014 года № 349. Зарегистрировано Департаментом юстиции Карагандинской области 19 января 2015 года № 2936
title:
  rus: О предоставлении мер социальной поддержки в виде подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам здравоохранения,образования, социального обеспечения,культуры, спорта и агропромышленного комплекса, прибывшим  для работы и проживания в сельские населенные пункты Нуринского района в 2015 году
  kaz: 2015 жылы Нұра ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіп кешенінің мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға бюджеттік несие түрінде әлеуметтік қолдау шараларын ұсыну туралы
