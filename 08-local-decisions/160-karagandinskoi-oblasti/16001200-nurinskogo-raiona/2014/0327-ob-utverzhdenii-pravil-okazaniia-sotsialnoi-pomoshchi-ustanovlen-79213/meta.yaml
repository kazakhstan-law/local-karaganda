  title:
    rus: О внесении изменений в решение Нуринского районного маслихата от 27 марта 2014 года № 242 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Нуринского района Карагандинской области»
    kaz: Нұра аудандық мәслихатының 2014 жылғы 27 наурыздағы № 242 «Қарағанды облысы Нұра ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
