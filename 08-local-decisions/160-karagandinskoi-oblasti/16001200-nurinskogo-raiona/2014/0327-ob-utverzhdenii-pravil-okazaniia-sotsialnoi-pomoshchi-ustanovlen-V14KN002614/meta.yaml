    kaz: Нұра аудандық мәслихатының 2014 жылғы 27 наурыздағы 26 сессиясының № 242 «Нұра ауданының Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
