act_code: '79223'
requisite: Решение 26 сессии Нуринского районного маслихата Карагандинской области от 27 марта 2014 года № 240. Зарегистрировано Департаментом юстиции Карагандинской области 24 апреля 2014 года № 2616
title:
  rus: О предоставлении мер социальной поддержки в виде подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Нуринского района в 2014 году
  kaz: 2014 жылы Нұра ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға бюджеттік несие түрінде әлеуметтік қолдау шараларын ұсыну туралы
