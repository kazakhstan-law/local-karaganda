  title:
    rus: О внесении изменений в решение 26 сессии Нуринского районного маслихата от 27 марта 2014 года № 240 "О предоставлении мер социальной поддержки в виде подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Нуринского района в 2014 году"
    kaz: Нұра аудандық мәслихатының 26 сессиясының 2014 жылғы 27 наурыздағы № 240 "2014 жылы Нұра ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген деңсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға бюджеттік несие түрінде әлеуметтік қолдау шараларын ұсыну туралы" шешіміне өзгерістер енгізу туралы
