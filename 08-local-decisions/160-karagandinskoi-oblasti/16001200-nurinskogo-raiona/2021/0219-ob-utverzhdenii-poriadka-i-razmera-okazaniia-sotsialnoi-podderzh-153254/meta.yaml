  title:
    rus: О внесении изменения в решение Нуринского районного маслихата от 19 февраля 2021 года № 17 «Об утверждении порядка и размера оказания социальной поддержки из средств местного бюджета по оплате коммунальных услуг и приобретению топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Нуринского района»
    kaz: Нұра аудандық мәслихатының 2021 жылғы 19 ақпандағы № 17 «Нұра ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мемлекеттік ұйымдарының мамандарына коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдауды жергілікті бюджет қаражатынан тағайындау тәртібі мен мөлшерін бекіту туралы» шешіміне өзгеріс енгізу туралы
