act_code: '153254'
requisite: Решение Нуринского районного маслихата Карагандинской области от 19 февраля 2021 года № 17. Зарегистрировано Департаментом юстиции Карагандинской области 3 марта 2021 года № 6227
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки из средств местного бюджета по оплате коммунальных услуг и приобретению топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Нуринского района
  kaz: Нұра ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мемлекеттік ұйымдарының мамандарына коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдауды жергілікті бюджет қаражатынан тағайындау тәртібі мен мөлшерін бекіту туралы
