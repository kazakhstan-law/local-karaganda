  title:
    rus: О внесении изменений в решение Нуринского районного маслихата от 19 февраля 2021 года № 18 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения и культуры, являющимся гражданскими служащими и работающим в сельских населенных пунктах, а также указанным специалистам, работающим в государственных организациях, финансируемых из местных бюджетов Нуринского района»
    kaz: Нұра аудандық мәслихатының 2021 жылғы 19 ақпандағы № 18 «Азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн әлеуметтiк қамсыздандыру және мәдениет саласындағы мамандарға, сондай-ақ Нұра ауданының жергілікті бюджеттерден қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандарға жиырма бес пайызға лауазымдық жоғарылатылған айлықақылар мен тарифтiк мөлшерлемелер белгілеу туралы» шешіміне өзгерістер енгізу туралы
