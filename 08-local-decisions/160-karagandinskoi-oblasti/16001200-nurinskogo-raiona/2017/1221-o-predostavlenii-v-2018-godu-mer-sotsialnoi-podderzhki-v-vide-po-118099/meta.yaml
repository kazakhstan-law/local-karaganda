act_code: '118099'
requisite: Решение XIX сессии Нуринского районного маслихата Карагандинской области от 21 декабря 2017 года № 198. Зарегистрировано Департаментом юстиции Карагандинской области 12 января 2018 года № 4566
title:
  rus: О предоставлении в 2018 году мер социальной поддержки в виде подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Нуринского района
  kaz: Нұра ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіп кешенінің мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға бюджеттік несие түрінде әлеуметтік қолдау шараларын 2018 жылы ұсыну туралы
