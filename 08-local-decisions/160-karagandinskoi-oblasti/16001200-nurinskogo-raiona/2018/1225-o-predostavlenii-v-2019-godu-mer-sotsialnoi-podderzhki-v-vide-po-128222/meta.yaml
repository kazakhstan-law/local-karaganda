act_code: '128222'
requisite: Решение Нуринского районного маслихата Карагандинской области от 25 декабря 2018 года № 301. Зарегистрировано Департаментом юстиции Карагандинской области 8 января 2019 года № 5133
title:
  rus: О предоставлении в 2019 году мер социальной поддержки в виде подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Нуринского района
  kaz: Нұра ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіп кешенінің мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға бюджеттік несие түрінде әлеуметтік қолдау шараларын 2019 жылы ұсыну туралы
