  title:
    rus: О внесении изменения в решение Нуринского районного маслихата от 25 декабря 2018 года № 301 «О предоставлении в 2019 году мер социальной поддержки в виде подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Нуринского района»
    kaz: Нұра аудандық мәслихатының 2018 жылғы 25 желтоқсандағы № 301 «Нұра ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіп кешенінің мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға бюджеттік несие түрінде әлеуметтік қолдау шараларын 2019 жылы ұсыну туралы» шешіміне өзгеріс енгізу туралы
