requisite: Решение 17 сессии Нуринского районного маслихата Карагандинской области от 24 июня 2009 года № 200. Зарегистрировано Управлением юстиции Нуринского района Карагандинской области 23 июля 2009 года № 8-14-99. Утратило силу - решением 30 сессии Нуринского районного маслихата Карагандинской области от 18 октября 2010 года № 293
title:
  rus: Об утверждении Правил предоставления малообеспеченным гражданам жилищной помощи на содержание жилья, оплату коммунальных услуг и компенсацию повышения тарифов абонентской платы за телефон абонентам сетей телекоммуникаций
  kaz: Аз қамтылған азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақыларды беру және телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы берудің Қағидаларын бекіту туралы
