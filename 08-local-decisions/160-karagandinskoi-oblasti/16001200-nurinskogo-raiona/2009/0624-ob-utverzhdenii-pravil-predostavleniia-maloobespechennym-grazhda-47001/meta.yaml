  title:
    rus: О внесении изменений в решение 17 сессии районного маслихата от 24 июня 2009 года № 200 "Об утверждении Правил предоставления малообеспеченным гражданам, жилищной помощи на содержание жилья, оплату коммунальных услуг и компенсацию повышения тарифов абонентской платы за телефон абонентам сетей телекоммуникации"
    kaz: Аудандық мәслихаттын 2009 жылғы 24 маусымдағы 17 сессиясының "Аз қамтылған азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақыларды беру және телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы берудің Қағидаларын бекіту туралы" № 200 шешіміне өзгерістер енгізу туралы
