act_code: '108863'
requisite: Решение 12 сессии Абайского районного маслихата Карагандинской области от 22 декабря 2016 года № 12/112. Зарегистрировано Департаментом юстиции Карагандинской области 5 января 2017 года № 4082
title:
  rus: О предоставлении в 2017 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Абайского района
  kaz: Абай ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен  саласындағы мамандарға 2017 жылы әлеуметтік қолдау шараларын беру туралы
