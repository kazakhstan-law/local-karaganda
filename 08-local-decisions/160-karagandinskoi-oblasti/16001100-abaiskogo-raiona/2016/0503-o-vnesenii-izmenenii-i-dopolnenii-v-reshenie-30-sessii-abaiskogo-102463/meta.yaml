requisite: Решение 3 сессии Абайского районного маслихата Карагандинской области от 3 мая 2016 года № 3/34. Зарегистрировано Департаментом юстиции Карагандинской области 16 мая 2016 года № 3783. Утратило силу решением Абайского районного маслихата Карагандинской области от 26 декабря 2023 года № 15/147 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
