act_code: '117132'
requisite: Решение 23 сессии Абайского районного маслихата Карагандинской области от 14 декабря 2017 года № 23/242. Зарегистрировано Департаментом юстиции Карагандинской области 25 декабря 2017 года № 4495
title:
  rus: О предоставлении в 2018 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Абайского района
  kaz: Абай ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылы әлеуметтік қолдау шараларын беру туралы
