act_code: '69996'
requisite: Решение 13 сессии Абайского районного маслихата Карагандинской области от 12 декабря 2012 года № 13/120. Зарегистрировано Департаментом юстиции Карагандинской области 11 января 2013 года № 2108. Прекращено действие в связи с истечением срока, на который решение было принято (письмо секретаря Абайского районного маслихата от 18 декабря 2015 года № 3-19-240)
title:
  rus: О предоставлении в 2013 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Абайского района
  kaz: Абай ауданының ауылдық елді мекендерінде жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2013 жылы әлеуметтік қолдау шараларын беру туралы
