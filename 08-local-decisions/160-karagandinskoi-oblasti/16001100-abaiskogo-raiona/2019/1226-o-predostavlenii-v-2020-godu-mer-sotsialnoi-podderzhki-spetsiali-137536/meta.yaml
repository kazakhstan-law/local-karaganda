requisite: Решение Абайского районного маслихата Карагандинской области от 26 декабря 2019 года № 57/609. Зарегистрировано Департаментом юстиции Карагандинской области 27 декабря 2019 года № 5609
title:
  rus: О предоставлении в 2020 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Абайского района
  kaz: Абай ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы әлеуметтік қолдау шараларын беру туралы
