title:
  rus: О повышении или понижении ставок земельного налога для целей налогообложения на территории города Абай Карагандинской области
  kaz: Қарағанды облысы Абай қаласының аумағында салық салу мақсатында жер салығының мөлшерлемелерін арттыру немесе азайту туралы
