  title:
    rus: О внесении изменений в решение Абайского районного маслихата от 10 января 2019 года № 42/460 «Об утверждении схемы зонирования территории города Абай Карагандинской области с понижающими или повышающими ставками земельного налога для целей налогообложения»
    kaz: Абай аудандық мәслихатының 2019 жылғы 10 қаңтардағы № 42/460 «Салық салу мақсаты үшін жер салығының мөлшерлемелері азайтылған немесе арттырылған Қарағанды облысы Абай қаласының аумағын аймақтарға бөлу сызбасын бекіту туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/164779/rus
