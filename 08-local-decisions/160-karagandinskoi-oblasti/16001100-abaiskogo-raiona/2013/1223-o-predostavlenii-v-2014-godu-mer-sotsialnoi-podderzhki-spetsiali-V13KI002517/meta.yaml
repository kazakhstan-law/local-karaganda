requisite: Решение 26 сессии Абайского районного маслихата Карагандинской области от 23 декабря 2013 года № 26/259. Зарегистрировано Департаментом юстиции Карагандинской области 20 января 2014 года № 2517
title:
  rus: О предоставлении в 2014 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Абайского района
  kaz: Абай ауданының ауылдық елді мекендерінде жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына 2014 жылы әлеуметтік қолдау шараларын беру туралы
