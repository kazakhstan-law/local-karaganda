  title:
    rus: О внесении изменений в решение 26 сессии Абайского районного маслихата от 23 декабря 2013 № 26/259 "О предоставлении в 2014 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Абайского района"
    kaz: Абай аудандық мәслихатының 26 сессиясының 2013 жылғы 23 желтоқсандағы № 26/259 «Абай ауданының ауылдық елді мекендерінде жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2014 жылы әлеуметтік қолдау шараларын беру туралы» шешіміне өзгерістер енгізу туралы
