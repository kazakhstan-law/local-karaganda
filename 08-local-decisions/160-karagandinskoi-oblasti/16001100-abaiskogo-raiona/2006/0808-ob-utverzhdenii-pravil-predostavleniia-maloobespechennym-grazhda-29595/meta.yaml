  title:
    rus: О внесении изменений и дополнений в решение 34 сессии районного маслихата № 34/335 от 8 августа 2006 года "Об утверждении Правил Предоставления малообеспеченным гражданам жилищных пособий на содержание жилья, оплату коммунальных услуг и компенсацию повышения тарифов абонентской платы за телефон абонентам городских сетей телекоммуникаций"
    kaz: Аудандық мәслихаттың 2006 жылғы 8 тамыздағы 34 сессиясының № 34/355 "Аз қамтылған азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақыларын беру және қалалық телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы берудің Қағидаларын бекіту туралы" шешіміне өзгертулер мен толықтырулар енгізу туралы
