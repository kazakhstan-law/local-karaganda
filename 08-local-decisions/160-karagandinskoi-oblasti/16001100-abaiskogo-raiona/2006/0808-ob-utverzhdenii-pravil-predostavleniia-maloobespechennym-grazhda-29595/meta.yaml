  title:
    rus: О внесении изменения и дополнений в решение 34 сессии Абайского районного маслихата от 8 августа 2006 года № 34/335 "Об утверждении Правил предоставления малообеспеченным гражданам жилищных пособий на содержание жилья, оплату коммунальных услуг и компенсацию повышения тарифов абонентской платы за телефон абонентам городских сетей телекоммуникаций"
    kaz: Абай аудандық мәслихатының 2006 жылғы 8 тамыздағы 34 сессиясының № 34/355 "Аз қамтылған азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақыларын беру және қалалық телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы берудің Қағидаларын бекіту туралы" шешіміне өзгертулер мен толықтырулар енгізу туралы
