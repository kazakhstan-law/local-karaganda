title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, культуры и спорта, являющимся гражданскими служащими и работающим в сельской местности, финансируемых из районного бюджета
  kaz: Аудандық бюджеттен қаржыландырылатын, азаматтық қызметші болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, мәдениет және спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтiк мөлшерлемелер белгілеу туралы
