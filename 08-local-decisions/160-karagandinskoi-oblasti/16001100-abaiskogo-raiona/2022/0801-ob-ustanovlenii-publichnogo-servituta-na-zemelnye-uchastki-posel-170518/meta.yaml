act_code: '170518'
requisite: Решение акима поселка Карабас Абайского района Карагандинской области от 1 августа 2022 года № 8
title:
  rus: Об установлении публичного сервитута на земельные участки поселка Карабас Абайского района Карагандинской области для проведения геологоразведочных работ товариществом с ограниченной ответственностью «Казахмыс Барлау»
  kaz: «Қазақмыс Барлау» жауапкершілігі шектеулі серіктестігімен геологиялық іздеу жұмыстарын жүргізу үшін Қарағанды облысы Абай ауданы Қарабас кентінің жер учаскелеріне қауымдық сервитут белгілеу туралы
