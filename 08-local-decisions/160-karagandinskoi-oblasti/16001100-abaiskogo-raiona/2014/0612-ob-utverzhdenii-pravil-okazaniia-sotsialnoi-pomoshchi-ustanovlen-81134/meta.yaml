  title:
    rus: О внесении изменения в решение 30 сессии Абайского районного маслихата от 12 июня 2014 года № 30/310 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Абайского района»
    kaz: Абай аудандық мәслихатының 2014 жылғы 12 маусымдағы 30 сессиясының № 30/310 «Абай ауданының Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
