act_code: '86012'
requisite: Решение 37 сессии Абайского районного маслихата Карагандинской области от 23 декабря 2014 года № 37/393. Зарегистрировано Департаментом юстиции Карагандинской области 16 января 2015 года № 2924. Прекращено действие в связи с истечением срока (письмо Абайского районного маслихата Карагандинской области от 17 июня 2016 года № 3-19-154)
title:
  rus: О предоставлении в 2015 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Абайского района
  kaz: Абай ауданының ауылдық елді мекендерінде жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына 2015 жылы әлеуметтік қолдау шараларын беру туралы
