act_code: '151690'
requisite: Решение Абайского районного маслихата Карагандинской области от 28 декабря 2020 года № 74/770. Зарегистрировано Департаментом юстиции Карагандинской области 12 января 2021 года № 6154
title:
  rus: О предоставлении в 2021 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Абайского района
  kaz: Абай ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2021 жылы әлеуметтік қолдау шараларын беру туралы
