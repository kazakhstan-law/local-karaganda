requisite: Решение Абайского районного маслихата Карагандинской области от 15 июня 2020 года № 64/683. Зарегистрировано Департаментом юстиции Карагандинской области 18 июня 2020 года № 5879. Утратило силу решением Абайского районного маслихата Карагандинской области от 25 февраля 2021 года № 3/37 (вводится в действие с 1 января 2021 года)
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры и спорта являющимся гражданскими служащими и работающим в сельской местности, финансируемых из районного бюджета
  kaz: Аудандық бюджеттен қаржыландырылатын, азаматтық қызметші болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет және спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтiк мөлшерлемелер белгілеу туралы
