act_code: '190380'
requisite: Решение Абайского районного маслихата Карагандинской области от 21 декабря 2023 года № 13/126
title:
  rus: О предоставлении в 2024 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Абайского района
  kaz: Абай ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылы әлеуметтік қолдау шараларын беру туралы
