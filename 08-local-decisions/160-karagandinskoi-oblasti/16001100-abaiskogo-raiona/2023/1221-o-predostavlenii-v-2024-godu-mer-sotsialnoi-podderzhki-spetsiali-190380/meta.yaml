  title:
    rus: О внесении изменения в решение Абайского районного маслихата от 21 декабря 2023 года № 13/126 «О предоставлении в 2024 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Абайского района»
    kaz: Абай аудандық мәслихатының 2023 жылғы 21 желтоқсандағы № 13/126 «Абай ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылы әлеуметтік қолдау шараларын беру туралы» шешіміне өзгеріс енгізу туралы
