  title:
    rus: О внесении изменения в решение 40 сессии Абайского районного маслихата № 40/437 от 25 декабря 2018 года «О предоставлении в 2019 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Абайского района»
    kaz: Абай аудандық мәслихатының 2018 жылғы 25 желтоқсандағы 40 сессиясының № 40/437 «Абай ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылы әлеуметтік қолдау шараларын беру туралы» шешіміне өзгеріс енгізу туралы
