requisite: Решение 29 сессии Абайского районного маслихата Карагандинской области от 19 апреля 2018 года № 29/325. Зарегистрировано Департаментом юстиции Карагандинской области 27 апреля 2018 года № 4731. Утратило силу решением Абайского районного маслихата Карагандинской области от 11 марта 2022 года № 20/199 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
