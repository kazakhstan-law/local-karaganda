requisite: Решение Осакаровского районного маслихата Карагандинской области от 28 сентября 2022 года № 300. Утратило силу решением Осакаровского районного маслихата Карагандинской области от 28 февраля 2024 года № 17/159 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей Тельманского сельского округа Осакаровского района Карагандинской области для участия в сходе местного сообщества
  kaz: Қарағанды облысы Осакаров ауданы Тельман ауылдық округінің жергілікті қоғамдастық жиындарына қатысу үшін жергілікті қоғамдастықтың бөлек жиындарын өткізу тәртібі және ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
