act_code: '177281'
requisite: Решение Осакаровского районного маслихата Карагандинской области от 23 декабря 2022 года № 343. Утратило силу решением Осакаровского районного маслихата Карагандинской области от 31 октября 2023 года № 12/111 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей Николаевского сельского округа Осакаровского района Карагандинской области для участия в сходе местного сообщества
  kaz: Қарағанды облысы Осакаров ауданы Николаев ауылдық округінің жергілікті қоғамдастық жиындарына қатысу үшін жергілікті қоғамдастықтың бөлек жиындарын өткізу тәртібі және ауылдық округ тұрғындары өкілдерінің сандық құрамын бекіту туралы
