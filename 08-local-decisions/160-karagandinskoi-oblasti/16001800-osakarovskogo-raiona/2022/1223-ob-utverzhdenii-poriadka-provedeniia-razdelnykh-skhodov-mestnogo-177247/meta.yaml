act_code: '177247'
requisite: Решение Осакаровского районного маслихата Карагандинской области от 23 декабря 2022 года № 340. Утратило силу решением Осакаровского районного маслихата Карагандинской области от 17 ноября 2023 года № 13/131 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей Родниковского сельского округа Осакаровского района Карагандинской области для участия в сходе местного сообщества
  kaz: Қарағанды облысы Осакаров ауданы Родников ауылдық округінің жергілікті қоғамдастық жиындарына қатысу үшін жергілікті қоғамдастықтың бөлек жиындарын өткізу тәртібі және ауылдық округ тұрғындары өкілдерінің сандық құрамын бекіту туралы
