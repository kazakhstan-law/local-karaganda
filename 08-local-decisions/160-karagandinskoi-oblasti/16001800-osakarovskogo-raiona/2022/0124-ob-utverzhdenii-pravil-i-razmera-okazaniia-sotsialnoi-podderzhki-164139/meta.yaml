  title:
    rus: О внесении изменения в решение Осакаровского районного маслихата от 24 января 2022 года № 179 «Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Осакаровского района»
    kaz: «Осакаров ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету Қағидасын және мөлшерін бекіту туралы» 2022 жылғы 24 қантардағы № 179 Осакаров аудандық мәслихатының шешіміне өзгеріс енгізу туралы
