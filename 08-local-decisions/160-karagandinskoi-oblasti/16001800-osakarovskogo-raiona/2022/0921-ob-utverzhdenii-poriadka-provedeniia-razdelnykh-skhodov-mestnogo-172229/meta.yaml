requisite: Решение Осакаровского районного маслихата Карагандинской области от 21 сентября 2022 года № 291. Утратило силу решением Осакаровского районного маслихата Карагандинской области от 17 ноября 2023 года № 13/120 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей сельского округа Жансары Осакаровского района Карагандинской области для участия в сходе местного сообщества
  kaz: Қарағанды облысы Осакаров ауданы Жансары ауылдық округінің жергілікті қоғамдастық жиындарына қатысу үшін жергілікті қоғамдастықтың бөлек жиындарын өткізу тәртібі және ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
