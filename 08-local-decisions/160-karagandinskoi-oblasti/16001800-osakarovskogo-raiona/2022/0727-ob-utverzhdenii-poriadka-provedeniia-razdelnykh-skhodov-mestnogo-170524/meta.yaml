requisite: Решение Осакаровского районного маслихата Карагандинской области от 27 июля 2022 года № 258. Утратило силу решением Осакаровского районного маслихата Карагандинской области от 17 ноября 2023 года № 13/124 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей Маржанкольского сельского округа Осакаровского района Карагандинской области для участия в сходе местного сообщества
  kaz: Қарағанды облысы Осакаров ауданы Маржанкөл ауылдық округының жергілікті қоғамдастық жиындарына қатысу үшін жергілікті қоғамдастықтың бөлек жиындарын өткізу тәртібі және ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
