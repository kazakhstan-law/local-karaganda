requisite: Решение Осакаровского районного маслихата Карагандинской области от 30 ноября 2022 года № 322. Утратило силу решением Осакаровского районного маслихата Карагандинской области от 31 октября 2023 года № 12/112 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей Садового сельского округа Осакаровского района Карагандинской области для участия в сходе местного сообщества
  kaz: Қарағанды облысы Осакаров ауданы Садовый ауылдық округінің жергілікті қоғамдастық жиындарына қатысу үшін жергілікті қоғамдастықтың бөлек жиындарын өткізу тәртібі және ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
