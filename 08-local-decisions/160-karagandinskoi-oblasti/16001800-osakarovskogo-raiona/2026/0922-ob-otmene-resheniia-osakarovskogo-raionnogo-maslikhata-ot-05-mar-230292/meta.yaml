title:
  rus: Об отмене решения Осакаровского районного маслихата от 05 марта 2026 года № 46/452 «Об утверждении минимального размера расходов на управление объектом кондоминиума и содержание общего имущества объекта кондоминиума по Осакаровскому району на 2026 год»
  kaz: Осакаров аудандық мәслихатының 2026 жылғы 05 наурыздағы № 46/452 «Осакаров ауданы бойынша кондоминиум объектісін басқаруға және кондоминиум объектісінің ортақ мүлкін күтіп-ұстауға арналған шығыстардың ең төмен мөлшерін 2026 жылға бекіту туралы» шешімнің күшін жою туралы
