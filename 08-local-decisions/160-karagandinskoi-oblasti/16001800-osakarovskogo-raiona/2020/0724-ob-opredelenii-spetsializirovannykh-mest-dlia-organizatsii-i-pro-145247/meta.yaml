  title:
    rus: О внесении изменения в решение Осакаровского районного маслихата от 24 июля 2020 года № 871 «Об определении специализированных мест для организации и проведения мирных собраний, порядок их использования, норм предельной заполняемости, требований к материально – техническому и организационному обеспечению, а также границы прилегающих территорий, в которых запрещено проведение пикетирования на территории Осакаровского района»
    kaz: Осакаров аудандық мәслихатының 2020 жылғы 24 шілдедегі № 871 «Бейбіт жиналыстарды ұйымдастыру және өткізу үшін мамандандырылған орындарды айқындау, оларды пайдалану тәртібі, шекті толымдылық нормалары, материалдық – техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптар, сондай-ақ Осакаров ауданының аумағында пикет өткізуге тыйым салынған іргелес аумақтардың шекаралары туралы» шешіміне өзгеріс енгізу туралы
