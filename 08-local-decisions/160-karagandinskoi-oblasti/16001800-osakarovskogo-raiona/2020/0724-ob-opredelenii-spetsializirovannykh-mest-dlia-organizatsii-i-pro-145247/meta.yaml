act_code: '145247'
requisite: Решение Осакаровского районного маслихата Карагандинской области от 24 июля 2020 года № 871. Зарегистрировано Департаментом юстиции Карагандинской области 1 августа 2020 года № 5993
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядок их использования, норм предельной заполняемости, требований к материально-техническому и организационному обеспечению, а также границы прилегающих территорий, в которых запрещено проведение пикетирования на территории Осакаровского района
  kaz: Осакаров ауданының аумағында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, олардың шекті толу нормаларын, материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, сондай-ақ пикеттерді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
