requisite: Решение Осакаровского районного маслихата Карагандинской области от 5 мая 2020 года № 830. Зарегистрировано Департаментом юстиции Карагандинской области 14 мая 2020 года № 5841. Утратило силу решением Осакаровского районного маслихата Карагандинской области от 24 января 2022 года № 179 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания социальной поддержки специалистам государственных организаций социального обеспечения, образования, культуры, спорта, проживающим и работающим в сельских населенных пунктах Осакаровского района, по приобретению топлива
  kaz: Осакаров ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт ұйымдарының мамандарына отын сатып алу бойынша әлеуметтік қолдау көрсету Ережесін бекіту туралы
