requisite: Решение 56 сессии Осакаровского районного маслихата Карагандинской области от 9 февраля 2016 года № 600. Зарегистрировано Департаментом юстиции Карагандинской области 2 марта 2016 года № 3686
title:
  rus: О предоставлении в 2016 году мер социальной поддержки специалистам  в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса,  прибывшим для работы  и проживания в сельские населенные пункты Осакаровского района
  kaz: Осакаров ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2016 жылы әлеуметтік  қолдау шараларын ұсыну туралы
