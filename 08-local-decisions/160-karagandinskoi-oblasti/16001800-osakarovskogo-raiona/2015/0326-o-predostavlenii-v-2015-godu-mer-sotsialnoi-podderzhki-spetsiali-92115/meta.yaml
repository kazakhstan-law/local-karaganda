act_code: '92115'
requisite: Решение от 26.03.2015 №434, Маслихат Осакаровского района
title:
  rus: О предоставлении в 2015 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса,  прибывшим для работы  и проживания в сельские населенные пункты Осакаровского района
  kaz: Осакаров ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылы әлеуметтік  қолдау шараларын ұсыну туралы
