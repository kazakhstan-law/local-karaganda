  title:
    rus: О внесении изменения в решение 47 сессии Осакаровского  районного маслихата от 19 августа 2015 года № 505 «О повышении базовых ставок земельного налога, ставок единого земельного налога в десять раз на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения»
    kaz: Осакаров аудандық мәслихатының 2015 жылғы 19 тамыздағы 47 сессиясының № 505 «Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін және бірыңғай жер салығының мөлшерлемелерін он есе жоғарлату туралы» шешіміне өзгеріс енгізу туралы
