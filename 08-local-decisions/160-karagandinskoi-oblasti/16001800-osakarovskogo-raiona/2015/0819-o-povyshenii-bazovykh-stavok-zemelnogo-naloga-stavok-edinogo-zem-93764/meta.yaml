requisite: Решение 47 сессии Осакаровского районного маслихата Карагандинской области от 19 августа 2015 года № 505. Зарегистрировано Департаментом юстиции Карагандинской области 8 сентября 2015 года № 3398. Утратило силу решением Осакаровского районного маслихата Карагандинской области от 13 февраля 2019 года № 599 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О повышении базовых ставок земельного налога, ставок единого земельного налога в десять раз на неиспользуемые в соответствии с земельным законодательством Республики Казахстан  земли сельскохозяйственного назначения
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін және бірыңғай жер салығының мөлшерлемелерін он есе жоғарлату туралы
