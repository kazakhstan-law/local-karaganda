act_code: '117914'
requisite: Решение 29 сессии Осакаровского районного маслихата Карагандинской области от 26 декабря 2017 года № 383. Зарегистрировано Департаментом юстиции Карагандинской области 11 января 2018 года № 4558
title:
  rus: О предоставлении в 2018 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Осакаровского района
  kaz: Осакаров ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылы әлеуметтік қолдау шараларын ұсыну туралы
