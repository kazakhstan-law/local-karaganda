act_code: '110126'
requisite: Решение 12 сессии Осакаровского районного маслихата Карагандинской области от 8 февраля 2017 года № 177. Зарегистрировано Департаментом юстиции Карагандинской области 27 февраля 2017 года № 4158
title:
  rus: О предоставлении в 2017 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Осакаровского района
  kaz: Осакаров ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2017 жылы әлеуметтік қолдау шараларын ұсыну туралы
