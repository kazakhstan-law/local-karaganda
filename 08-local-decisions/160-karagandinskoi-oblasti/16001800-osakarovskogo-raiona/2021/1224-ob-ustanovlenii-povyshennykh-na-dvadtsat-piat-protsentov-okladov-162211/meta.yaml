title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения и культуры, являющимся гражданскими служащими и работающим в сельской местности, финансируемых из районного бюджета
  kaz: Аудандық бюджеттен қаржыландырылатын, азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн әлеуметтiк қамсыздандыру және мәдениет саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
