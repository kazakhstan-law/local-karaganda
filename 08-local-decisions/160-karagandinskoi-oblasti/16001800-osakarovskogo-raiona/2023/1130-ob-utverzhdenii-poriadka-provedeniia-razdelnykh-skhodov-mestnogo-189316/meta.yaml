requisite: Решение Осакаровского районного маслихата Карагандинской области от 30 ноября 2023 года № 14/135
title:
  rus: Об утверждении Порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей Пионерского сельского округа Осакаровского района Карагандинской области для участия в сходе местного сообщества
  kaz: Қарағанды облысы Осакаров ауданы Пионер ауылдық округінің жергілікті қоғамдастық жиынына қатысу үшін жергілікті қоғамдастықтың бөлек жиындарын өткізу тәртібі және тұрғындары өкілдерінің сандық құрамын бекіту туралы
