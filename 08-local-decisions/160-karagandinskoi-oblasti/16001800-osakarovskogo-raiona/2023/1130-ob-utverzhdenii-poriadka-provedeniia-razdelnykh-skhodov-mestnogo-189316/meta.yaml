  title:
    rus: О внесении изменения в решение Осакаровского районного маслихата от 30 ноября 2023 года № 14/135 «Об утверждении Порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей Пионерского сельского округа Осакаровского района Карагандинской области для участия в сходе местного сообщества»
    kaz: Осакаров аудандық мәслихатының 2023 жылғы 30 қарашадағы «Қарағанды облысы Осакаров ауданы Пионер ауылдық округінің жергілікті қоғамдастық жиынына қатысу үшін жергілікті қоғамдастықтың бөлек жиындарын өткізу тәртібі және тұрғындары өкілдерінің сандық құрамын бекіту туралы» № 14/135 шешіміне өзгеріс енгізу туралы
