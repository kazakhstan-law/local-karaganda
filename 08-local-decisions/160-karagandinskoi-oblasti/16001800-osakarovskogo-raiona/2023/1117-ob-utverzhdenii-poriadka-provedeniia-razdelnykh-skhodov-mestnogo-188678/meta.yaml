  title:
    rus: О внесении изменения в решение Осакаровского районного маслихата от 17 ноября 2023 года № 13/129 «Об утверждении Порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей Трудового сельского округа Осакаровского района Карагандинской области для участия в сходе местного сообщества»
    kaz: Осакаров аудандық мәслихатының 2023 жылғы 17 қарашадағы «Қарағанды облысы Осакаров ауданы Трудовой ауылдық округінің жергілікті қоғамдастық жиынына қатысу үшін жергілікті қоғамдастықтың бөлек жиындарын өткізу тәртібі және тұрғындары өкілдерінің сандық құрамын бекіту туралы» № 13/129 шешіміне өзгеріс енгізу туралы
