  title:
    rus: О внесении изменения в решение Осакаровского районного маслихата от 31 октября 2023 года № 12/113 «Об утверждении Порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей сельского округа Сарыозек Осакаровского района Карагандинской области для участия в сходе местного сообщества»
    kaz: Осакаров аудандық мәслихатының 2023 жылғы 31 қазандағы «Қарағанды облысы Осакаров ауданы Сарыөзек ауылдық округінің жергілікті қоғамдастық жиынына қатысу үшін жергілікті қоғамдастықтың бөлек жиындарын өткізу тәртібі және тұрғындары өкілдерінің сандық құрамын бекіту туралы» № 12/113 шешіміне өзгеріс енгізу туралы
