title:
  rus: Об утверждении Порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей поселка Молодежный Осакаровского района Карагандинской области для участия в сходе местного сообщества
  kaz: Қарағанды облысы Осакаров ауданы Молодежный кентінің жергілікті қоғамдастық жиындарына қатысу үшін жергілікті қоғамдастықтың бөлек жиындарын өткізу тәртібі және кент тұрғындары өкілдерінің сандық құрамын бекіту туралы
