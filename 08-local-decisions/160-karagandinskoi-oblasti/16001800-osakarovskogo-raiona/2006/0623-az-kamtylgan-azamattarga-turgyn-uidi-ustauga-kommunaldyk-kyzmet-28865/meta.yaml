  title:
    rus: О внесении изменений и дополнений в решение 26 сессии районного маслихата № 203 от 23 июня 2006 года "Об утверждении Правил предоставления малообеспеченным гражданам жилищных пособий на содержание жилья, оплату коммунальных услуг и компенсацию повышения тарифов абонентской платы за телефон абонентам городских сетей телекоммуникаций и порядка исчисления совокупного дохода семьи (лица), при назначении жилищного пособия"
    kaz: Аудандық мәслихаттың 2006 жылғы 23 маусымдағы 26 сессиясының "Аз қамтылған азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақыларды беру және қалалық телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы берудің және тұрғын үй жәрдемақысын тағайындау кезінде отбасының (адамның) жиынтық табысын есептеу тәртібі туралы Қағидасын бекіту туралы" № 203 шешіміне өзгерістер мен толықтырулар енгізу туралы
