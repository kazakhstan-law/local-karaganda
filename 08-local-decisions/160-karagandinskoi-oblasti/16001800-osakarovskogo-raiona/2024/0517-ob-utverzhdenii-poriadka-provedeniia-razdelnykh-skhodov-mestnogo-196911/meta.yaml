requisite: Решение Осакаровского районного маслихата Карагандинской области от 17 мая 2024 года № 19/190
title:
  rus: Об утверждении Порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей сельского округа Нияз Осакаровского района Карагандинской области для участия в сходе местного сообщества
  kaz: Қарағанды облысы Осакаров ауданы Нияз ауылдық округінің жергілікті қоғамдастық жиынына қатысу үшін жергілікті қоғамдастықтын бөлек жиындарын өткізу тәртібі және тұрғындары өкілдерінің сандық құрамын бекіту туралы
