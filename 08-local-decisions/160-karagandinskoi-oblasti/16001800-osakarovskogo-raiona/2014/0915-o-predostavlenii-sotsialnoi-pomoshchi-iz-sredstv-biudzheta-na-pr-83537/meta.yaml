  title:
    rus: О внесении изменения в решение Осакаровского районного маслихата от 15 сентября 2014 года № 376 «О предоставлении социальной помощи из средств бюджета на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Осакаровского района»
    kaz: Осакаров аудандық мәслихатының 2014 жылғы 15 қыркүйектегі № 376 «Осакаров ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін бюджет қаражаты есебінен әлеуметтік көмек беру туралы» шешіміне өзгеріс енгізу туралы
