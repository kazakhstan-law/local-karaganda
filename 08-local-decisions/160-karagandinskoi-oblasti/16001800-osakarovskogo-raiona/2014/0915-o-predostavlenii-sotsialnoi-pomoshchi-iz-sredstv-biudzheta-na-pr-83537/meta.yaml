act_code: '83537'
requisite: Решение 35 сессии Осакаровского районного маслихата Карагандинской области от 15 сентября 2014 года № 376. Зарегистрировано Департаментом юстиции Карагандинской области 6 октября 2014 года № 2788. Утратило силу решением Осакаровского районного маслихата Карагандинской области от 5 мая 2020 года № 830 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи из средств бюджета на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Осакаровского района
  kaz: Осакаров ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін бюджет қаражаты есебінен әлеуметтік көмек беру туралы
