    kaz: Осакаров аудандық мәслихатының 28 сессиясының 2014 жылғы 12 наурыздағы № 285 "Осакаров ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2014 жылы әлеуметтік қолдау шараларын ұсыну туралы" шешіміне өзгерістер енгізу туралы
