act_code: '78537'
requisite: Решение 28 сессии Осакаровского районного маслихата Карагандинской области от 12 марта 2014 года № 285. Зарегистрировано Департаментом юстиции Карагандинской области 4 апреля 2014 года № 2576
title:
  rus: О предоставлении в 2014 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Осакаровского района
  kaz: Осакаров ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына 2014 жылы әлеуметтік қолдау шараларын ұсыну туралы
