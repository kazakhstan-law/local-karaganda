title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарных специалистов ветеринарных пунктов, прибывшим для работы и проживания в сельские населенные пункты Осакаровского района в 2012 году
  kaz: 2012 жылы Осакаров ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт мамандарына және ветеринария пункттеріндегі ветеринария мамандарына көтерме жәрдемақы және тұрғын үй сатып алу үшін әлеуметтік қолдауды ұсыну туралы
