  title:
    rus: О внесении изменения в решение очередной 45 сессии Осакаровского районного маслихата от 4 мая 2011 года № 349 "О предоставлении в 2011 году подъемного пособия и социальной поддержки для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта прибывшим для работы и проживания в сельские населенные пункты Осакаровского района"
    kaz: Осакаров аудандық мәслихатының 2011 жылғы 4 мамырдағы кезекті 45 сессиясының № 349 "2011 жылы Осакаров ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға әлеуметтік қолдау ұсыну туралы" шешіміне өзгеріс енгізу туралы
