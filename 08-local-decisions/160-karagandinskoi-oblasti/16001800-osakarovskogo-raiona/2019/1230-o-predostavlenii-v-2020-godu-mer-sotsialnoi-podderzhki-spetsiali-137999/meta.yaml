act_code: '137999'
requisite: Решение Осакаровского районного маслихата Карагандинской области от 30 декабря 2019 года № 792. Зарегистрировано Департаментом юстиции Карагандинской области 5 января 2020 года № 5654
title:
  rus: О предоставлении в 2020 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Осакаровского района
  kaz: Осакаров ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы әлеуметтік қолдау шараларын көрсету туралы
