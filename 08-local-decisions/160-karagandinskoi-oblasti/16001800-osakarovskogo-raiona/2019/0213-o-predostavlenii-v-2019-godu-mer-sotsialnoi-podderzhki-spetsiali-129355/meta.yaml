  title:
    rus: О внесении изменения в решение 45 сессии Осакаровского районного маслихата от 13 февраля 2019 года № 600 «О предоставлении в 2019 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Осакаровского района»
    kaz: Осакаров аудандық мәслихатының 2019 жылғы 13 ақпандағы 45 сессиясының № 600 «Осакаров ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылы әлеуметтік қолдау шараларын көрсету туралы» шешіміне өзгеріс енгізу туралы
