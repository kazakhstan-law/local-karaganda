act_code: '73743'
requisite: Решение 20 сессии Осакаровского районного маслихата Карагандинской области от 10 июля 2013 года № 196. Зарегистрировано Департаментом юстиции Карагандинской области 30 июля 2013 года № 2375
title:
  rus: О предоставлении в 2013 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Осакаровского района
  kaz: Осакаров ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2013 жылы әлеуметтік қолдау шараларын ұсыну туралы
