  title:
    rus: О внесении изменений и дополнений в решение Осакаровского районного маслихата от 25 декабря 2013 года № 262 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан»
    kaz: Осакаров аудандық мәслихатының 2013 жылғы 25 желтоқсандағы № 262 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
