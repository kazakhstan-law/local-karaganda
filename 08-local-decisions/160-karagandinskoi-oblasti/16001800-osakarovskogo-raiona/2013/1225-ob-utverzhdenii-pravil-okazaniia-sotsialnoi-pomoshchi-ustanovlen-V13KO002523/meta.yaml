  requisite: Решение Осакаровского районного маслихата Карагандинской области от 27 ноября 2018 года № 531. Зарегистрировано Департаментом юстиции Карагандинской области 11 декабря 2018 года № 5046. Утратило силу решением Осакаровского районного маслихата Карагандинской области от 31 октября 2023 года № 12/110 (вводится в действие по истечению десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в решение 26 сессии Осакаровского районного маслихата от 25 декабря 2013 года № 262 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан»
    kaz: Осакаров аудандық мәслихатының 2013 жылғы 25 желтоқсандағы 26 сессиясының № 262 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
