title:
  rus: О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, медицинских изделий, отдельным категориям граждан Республики Казахстан при амбулаторном лечении бесплатно
  kaz: Қазақстан Республикасы азаматтарының жекелеген санаттарына тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттардың, медициналық бұйымдардың амбулаториялық емдеу кезінде қосымша ұсыну туралы
