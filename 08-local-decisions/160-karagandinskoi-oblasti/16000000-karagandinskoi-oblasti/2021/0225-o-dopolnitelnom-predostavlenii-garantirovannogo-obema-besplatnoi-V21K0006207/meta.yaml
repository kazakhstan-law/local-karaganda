  title:
    rus: О внесении изменения в решение Карагандинского областного маслихата от 25 февраля 2021 года № 34 «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, медицинских изделий, отдельным категориям граждан Республики Казахстан при амбулаторном лечении бесплатно»
    kaz: «Қазақстан Республикасы азаматтарының жекелеген санаттарына тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттардың, медициналық бұйымдардың амбулаториялық емдеу кезінде қосымша ұсыну туралы» Қарағанды облыстық мәслихатының 2021 жылғы 25 ақпандағы № 34 шешіміне өзгеріс енгізу туралы
