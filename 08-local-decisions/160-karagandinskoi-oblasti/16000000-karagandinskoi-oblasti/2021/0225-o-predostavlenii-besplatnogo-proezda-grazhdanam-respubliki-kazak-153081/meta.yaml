requisite: Решение Карагандинского областного маслихата от 25 февраля 2021 года № 35. Зарегистрировано Департаментом юстиции Карагандинской области 26 февраля 2021 года № 6216
title:
  rus: О предоставлении бесплатного проезда гражданам Республики Казахстан за пределы населенного пункта постоянного проживания для получения высокотехнологичных медицинских услуг в рамках гарантированного объема бесплатной медицинской помощи и (или) медицинской помощи в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде жоғары технологиялық медициналық көрсетілетін қызметтерді және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмекті алу үшін Қазақстан Республикасының азаматтарына тұрақты тұратын елді мекеннен тысқары жерлерге тегін жол жүруді ұсыну туралы
