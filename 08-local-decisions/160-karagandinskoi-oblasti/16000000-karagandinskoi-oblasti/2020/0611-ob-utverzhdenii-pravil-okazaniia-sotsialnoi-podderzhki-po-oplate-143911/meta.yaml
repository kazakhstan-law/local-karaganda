act_code: '143911'
requisite: Решение Карагандинского областного маслихата от 11 июня 2020 года № 540. Зарегистрировано Департаментом юстиции Карагандинской области 18 июня 2020 года № 5882
title:
  rus: Об утверждении Правил оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств и их размеров педагогам, осуществляющим профессиональную деятельность в сельских населенных пунктах Карагандинской области
  kaz: Қарағанды облысының ауылдық елді мекендерінде кәсіби қызметті жүзеге асыратын педагогтарға коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша бюджет қаражаты есебінен әлеуметтік қолдау көрсету қағидаларын және оның мөлшерін бекіту туралы
