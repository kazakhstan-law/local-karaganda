act_code: '23409'
requisite: Решение XI сессии Карагандинского областного Маслихата от 17 марта 2005 года № 172. Зарегистрировано Департаментом юстиции Карагандинской области 31 марта 2005 года за № 1752. Утратило силу решением Карагандинского областного маслихата от 23 сентября 2021 года № 109 (вводится в действие со дня его первого официального опубликования вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О проведении расчета за оказанные ритуальные услуги по захоронению с воинскими почестями и установлению надгробий на могилах умерших лиц, удостоенных звания Герой Советского Союза, "Халык Кахарманы", Герой Социалистического Труда, награжденных орденом Славы трех степеней и орденом "Отан" из числа участников и инвалидов войны
  kaz: Кеңес Одағының Батыры, "Халық қаһарманы", Социалистік Еңбек Ері атағына ие болған, Даңқ орденінің үш бірдей дәрежесімен және "Отан" орденімен наградталған соғысқа қатысқандар мен мүгедектер қатарындағы қайтыс болған адамдарға әскери сый-сияпат көрсетіп, жерлеу және қабірінің басына құлпытас қою жөнінде көрсетілген көмекке есеп жүргізу туралы
