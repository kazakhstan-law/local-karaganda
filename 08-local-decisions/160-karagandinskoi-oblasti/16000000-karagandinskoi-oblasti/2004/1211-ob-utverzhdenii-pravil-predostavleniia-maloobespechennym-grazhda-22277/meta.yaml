requisite: Решение X сессии Карагандинского областного Маслихата от 11 декабря 2004 года № 157. Зарегистрировано Департаментом юстиции Карагандинской области 20 декабря 2004 года за № 1661. Утратило силу - решением XXII сессии Карагандинского областного маслихата от 5 июля 2006 года № 332
title:
  rus: Об утверждении Правил предоставления малообеспеченным гражданам жилищных пособий на содержание жилья, оплату коммунальных услуг и компенсации повышения тарифов абонентской платы за телефон абонентам городских сетей телекоммуникаций
  kaz: Аз қамтылған азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақыларды беру және қалалық телекомміникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы берудің Қағидаларын бекіту туралы
