  title:
    rus: О внесении изменения в решение Карагандинского областного маслихата от 20 ноября 2025 года № 334 «Об утверждении размера платы за один кубический метр питьевой воды, поданной из систем водоснабжения, включенных в перечень систем водоснабжения, стоимость услуг по подаче питьевой воды которых подлежит субсидированию по Карагандинской области»
    kaz: Қарағанды облыстық мәслихатының 2025 жылғы 20 қарашадағы № 334 «Қарағанды облысы бойынша ауызсуды беру жөніндегі қызметтердің құны субсидиялауға жататын сумен жабдықтау жүйелерінің тізбесіне енгізілген сумен жабдықтау жүйелерінен берілген ауызсудың бір текше метріне төлемақы мөлшерін бекіту туралы» шешіміне өзгеріс енгізу туралы
