  title:
    rus: О внесении изменений в решение X сессии Карагандинского областного маслихата от 29 сентября 2017 года № 222 «Об утверждении Правил содержания и защиты зеленых насаждений Карагандинской области и Правил благоустройства территорий городов и населенных пунктов Карагандинской области»
    kaz: Қарағанды облыстық мәслихатының 2017 жылғы 29 қыркүйектегі X сессиясының № 222 «Қарағанды облысының жасыл екпелерді күтіп-ұстау және қорғау Қағидалары және Қарағанды облысының қалалар мен елді мекендердің аумақтарын абаттандырудың Қағидаларын бекіту туралы» шешіміне өзгертулер енгізу туралы
