  title:
    rus: О внесении изменений и дополнения в решение X сессии Карагандинского областного маслихата от 29 сентября 2017 года № 222 «Об утверждении Правил содержания и защиты зеленых насаждений, благоустройства территорий городов и населенных пунктов Карагандинской области»
    kaz: Қарағанды облыстық мәслихатының 2017 жылғы 29 қыркүйектегі X сессияның № 222 «Қарағанды облысының жасыл екпелерді күтіп-ұстау және қорғау, қалалары мен елді мекендерінің аумақтарын абаттандырудың Қағидаларын бекіту туралы» шешіміне өзгерістер және толықтыру енгізу туралы
