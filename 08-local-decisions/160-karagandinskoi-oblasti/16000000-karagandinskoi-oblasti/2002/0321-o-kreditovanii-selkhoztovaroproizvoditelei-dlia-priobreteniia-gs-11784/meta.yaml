act_code: '11784'
requisite: Решение акима Карагандинской области от 21 марта 2002 года № 47. Зарегистрировано Управлением юстиции Карагандинской области 27 марта 2002 года за № 700. Утратило силу в связи с истечением срока письмом руководителя аппарата акима Карагандинской области от 21 января 2005 года № 05-11/89
title:
  rus: О кредитовании сельхозтоваропроизводителей для приобретения ГСМ, семян, удобрений, гербицидов, запчастей для сельскохозмашин, аренды или покупки сельскохозяйственной техники на проведение весенне-полевых и уборочных работ 2002 г.
  kaz: Ауыл шаруашылығы тауарын өндірушілерге 2002 жылғы көктемгі егіс және егін жинау жұмыстарына ЖЖМ, тұқымдық дәнді дақылдарды, тыңайтқыш және гербицидті, ауыл шаруашылығы машиналарының қосалқы бөлшектерін техникаларды сатып алуға несие бөлу туралы
