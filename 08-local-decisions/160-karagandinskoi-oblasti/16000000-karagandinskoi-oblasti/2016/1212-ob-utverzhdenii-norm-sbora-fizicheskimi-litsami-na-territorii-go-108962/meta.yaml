act_code: '108962'
requisite: Решение VI сессии Карагандинского областного маслихата от 12 декабря 2016 года № 138. Зарегистрировано Департаментом юстиции Карагандинской области 4 января 2017 года № 4075
title:
  rus: Об утверждении норм сбора физическими лицами на территории государственного лесного фонда для собственных нужд лесных ресурсов и ставок платы за лесные пользования на участках государственного лесного фонда и за использование особо охраняемых природных территорий местного значения Карагандинской области на 2017-2019 годы
  kaz: Қарағанды облысының мемлекеттiк орман қоры аумағында жеке тұлғалардың орман ресурстарын өз мұқтажы үшiн жинау нормаларын және мемлекеттiк орман қоры учаскелерiнде орман пайдалану және жергілікті маңызы бар ерекше қорғалатын табиғи аумақтарды пайдаланғаны үшін 2017-2019 жылдарға арналған төлемақысының ставкаларын бекiту туралы
