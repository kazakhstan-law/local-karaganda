  title:
    rus: О внесении изменения в решение Карагандинского областного маслихата от 30 июня 2016 года № 63 «Об утверждении перечня социально значимых пассажирских межрайонных (междугородных внутриобластных) и пригородных сообщений Карагандинской области»
    kaz: Қарағанды облыстық мәслихатының 2016 жылғы 30 маусымдағы № 63 «Қарағанды облысының әлеуметтік мәні бар ауданаралық (облысішілік қалааралық) және қала маңындағы жолаушылар қатынасының тізбесін бекіту туралы» шешіміне өзгеріс енгізу туралы
