  title:
    rus: О внесении изменений в решение Карагандинского областного маслихата от 29 сентября 2016 года № 84 «Об определении перечня социально значимых городских (сельских), пригородных и внутрирайонных сообщений Карагандинской области»
    kaz: Қарағанды облыстық мәслихатының 2016 жылғы 29 қыркүйектегі № 84 «Қарағанды облысының әлеуметтік маңызы бар қалалық (ауылдық), қала маңындағы және ауданішілік қатынастар тізбесін айқындау туралы» шешіміне өзгерістер енгізу туралы
