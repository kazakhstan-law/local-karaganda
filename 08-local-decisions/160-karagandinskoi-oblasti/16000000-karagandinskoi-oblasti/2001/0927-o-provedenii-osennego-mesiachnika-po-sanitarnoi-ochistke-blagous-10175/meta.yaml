act_code: '10175'
requisite: Решение акима Карагандинской области от 28 сентября 2001 года № 201. Зарегистрировано Управлением юстиции Карагандинской области 10 октября 2001 года за № 452. Утратило силу в связи с истечением срока письмом руководителя аппарата акима Карагандинской области от 21 января 2005 года № 05-11/89
title:
  rus: О проведении осеннего месячника по санитарной очистке, благоустройству, озеленению городов и населенных пунктов области в рамках общенационального движения "Добрые дела-10-летию независимости страны"
  kaz: '"Ел тәуелсіздігінің 10 жылдығына-ізгі істер" жалпыұлттық қозғалысының шеңберінде облыстың қалалары мен елді мекендерін тазалау, көркейту және көгалдандыру жөніндегіүкүзгі айлықты жүргізу туралы'
