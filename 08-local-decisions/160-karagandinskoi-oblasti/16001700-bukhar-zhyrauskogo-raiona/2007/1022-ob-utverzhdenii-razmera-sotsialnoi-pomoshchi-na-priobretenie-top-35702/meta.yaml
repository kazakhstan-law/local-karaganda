  title:
    rus: О внесении изменения в решение 2 сессии Бухар-Жырауского районного Маслихата от 22 октября 2007 года № 5 "Об утверждении размера социальной  помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры и спорта, проживающим и работающим в сельских населенных пунктах"
    kaz: Бұқар жырау аудандық мәслихатының 2007 жылғы 22 қазандағы 2 сессиясының "Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмектің көлемін бекіту туралы" № 5 шешіміне өзгеріс енгізу туралы
