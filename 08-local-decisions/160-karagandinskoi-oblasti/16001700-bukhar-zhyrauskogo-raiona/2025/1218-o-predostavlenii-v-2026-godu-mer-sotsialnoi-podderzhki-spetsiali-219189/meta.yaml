act_code: '219189'
requisite: Решение Бухар-Жырауского районного маслихата Карагандинской области от 18 декабря 2025 года № 39/05
title:
  rus: О предоставлении в 2026 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Бухар-Жырауского района
  kaz: Бұқар жырау ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2026 жылы әлеуметтік қолдау шараларын ұсыну туралы
