requisite: Решение 33 сессии Бухар-Жырауского районного маслихата Карагандинской области от 10 ноября 2010 года № 5. Зарегистрировано Управлением юстиции Бухар-Жырауского района Карагандинской области 23 ноября 2010 года № 8-11-104
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Бухар-Жырауского района в 2010 году
  kaz: 2010 жылы Бұқар жырау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау шараларын ұсыну туралы
