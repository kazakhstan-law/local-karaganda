  title:
    rus: О внесении изменения в решение 10 сессии Бухар-Жырауского районного маслихата от 28 декабря 2023 года № 7 «О предоставлении в 2024 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Бухар-Жырауского района»
    kaz: Бұқар жырау аудандық мәслихатының 10 сессиясының 2023 жылғы 28 желтоқсандағы № 7 «Бұқар жырау ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылы әлеуметтік қолдау шараларын ұсыну туралы» шешіміне өзгеріс енгізу туралы
