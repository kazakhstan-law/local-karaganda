  title:
    rus: О внесении изменений в решение Бухар-Жырауского районного маслихата от 27 июня 2023 года № 10 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Бухар-Жырауском районе»
    kaz: Бұқар жырау аудандық мәслихаттың 2023 жылғы 27 маусымдағы № 10 «Бұқар жырау ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсалған шығындарды өтеу алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
