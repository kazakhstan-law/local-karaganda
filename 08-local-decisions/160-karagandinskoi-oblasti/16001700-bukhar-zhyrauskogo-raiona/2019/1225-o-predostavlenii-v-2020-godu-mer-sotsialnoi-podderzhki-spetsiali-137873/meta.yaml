  title:
    rus: О внесении изменений в решение 43 сессии Бухар-Жырауского районного маслихата от 25 декабря 2019 года № 6 «О предоставлении в 2020 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Бухар-Жырауского района»
    kaz: Бұқар жырау аудандық мәслихатының 43 сессиясының 2019 жылғы 25 желтоқсандағы № 6 «Бұқар жырау ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы әлеуметтік қолдау шараларын ұсыну туралы» шешіміне өзгерістер енгізу туралы
