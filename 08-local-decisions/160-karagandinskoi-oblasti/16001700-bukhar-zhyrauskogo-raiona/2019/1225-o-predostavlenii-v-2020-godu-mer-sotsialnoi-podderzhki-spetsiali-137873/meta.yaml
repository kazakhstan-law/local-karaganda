act_code: '137873'
requisite: Решение Бухар-Жырауского районного маслихата Карагандинской области от 25 декабря 2019 года № 6. Зарегистрировано Департаментом юстиции Карагандинской области 31 декабря 2019 года № 5639
title:
  rus: О предоставлении в 2020 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Бухар-Жырауского района
  kaz: Бұқар жырау ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы әлеуметтік қолдау шараларын ұсыну туралы
