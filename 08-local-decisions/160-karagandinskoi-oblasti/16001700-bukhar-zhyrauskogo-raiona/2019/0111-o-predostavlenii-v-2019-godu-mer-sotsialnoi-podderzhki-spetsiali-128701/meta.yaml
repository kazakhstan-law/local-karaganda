act_code: '128701'
requisite: Решение 31 сессии Бухар-Жырауского районного маслихата Карагандинской области от 11 января 2019 года № 7. Зарегистрировано Департаментом юстиции Карагандинской области 23 января 2019 года № 5159
title:
  rus: О предоставлении в 2019 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Бухар-Жырауского района
  kaz: Бұқар жырау ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылы әлеуметтік қолдау шараларын ұсыну туралы
