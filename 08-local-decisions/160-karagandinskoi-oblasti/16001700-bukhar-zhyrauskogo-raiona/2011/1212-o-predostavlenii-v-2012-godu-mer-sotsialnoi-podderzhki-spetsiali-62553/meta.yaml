  title:
    rus: О внесении изменений и дополнения в решение 49 сессии Бухар-Жырауского районного маслихата от 12 декабря 2011 года № 5 "О предоставлении в 2012 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Бухар-Жырауского района"
    kaz: Бұқар жырау аудандық мәслихатының 2011 жылғы 12 желтоқсандағы 49 сессиясының "Бұқар жырау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау шараларын 2012 жылы ұсыну туралы" № 5 шешіміне өзгерістер мен толықтыру енгізу туралы
