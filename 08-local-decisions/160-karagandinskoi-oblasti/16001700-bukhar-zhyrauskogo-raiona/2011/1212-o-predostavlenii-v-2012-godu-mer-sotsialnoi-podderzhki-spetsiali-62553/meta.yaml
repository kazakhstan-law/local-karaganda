act_code: '62553'
requisite: Решение 49 сессии Бухар-Жырауского районного маслихата Карагандинской области от 12 декабря 2011 года № 5. Зарегистрировано Управлением юстиции Бухар-Жырауского района Карагандинской области 6 января 2012 года № 8-11-130
title:
  rus: О предоставлении в 2012 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Бухар-Жырауского района
  kaz: Бұқар жырау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын 2012 жылы ұсыну туралы
