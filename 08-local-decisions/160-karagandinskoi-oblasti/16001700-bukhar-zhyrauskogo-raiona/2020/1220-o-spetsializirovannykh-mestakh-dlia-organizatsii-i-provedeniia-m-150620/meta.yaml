act_code: '150620'
requisite: Решение Бухар-Жырауского районного маслихата Карагандинской области от 20 декабря 2020 года № 4. Зарегистрировано в Министерстве юстиции Республики Казахстан 28 декабря 2020 года № 21936
title:
  rus: О специализированных местах для организации и проведения мирных собраний, порядок использования специализированных мест для организации и проведения мирных собраний, нормы их предельной заполняемости, а также требования к материально-техническому и организационному обеспечению специализированных мест для организации и проведения мирных собраний и границ прилегающих территорий, в которых запрещено проведение пикетирования в Бухар-Жырауском районе
  kaz: Бұқар жырау ауданының аумағында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды пайдалану тәртібін, олардың шекті толу нормаларын, сондай-ақ бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптар мен пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекаралары туралы
