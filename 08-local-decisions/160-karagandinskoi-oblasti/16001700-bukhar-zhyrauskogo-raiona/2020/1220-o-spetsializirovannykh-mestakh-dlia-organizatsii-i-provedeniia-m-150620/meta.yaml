  title:
    rus: О внесении изменения в решение Бухар – Жырауского районного маслихата от 20 декабря 2020 года № 4 «О специализированных местах для организации и проведения мирных собраний, порядок использования специализированных мест для организации и проведения мирных собраний, нормы их предельной заполняемости, а также требования к материально-техническому и организационному обеспечению специализированных мест для организации и проведения мирных собраний и границ прилегающих территорий, в которых запрещено проведение пикетирования в Бухар-Жырауском районе»
    kaz: Бұқар жырау аудандық мәслихатының 2020 жылғы 20 желтоқсандағы № 4 «Бұқар жырау ауданының аумағында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды пайдалану тәртібін, олардың шекті толу нормаларын, сондай-ақ бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптар мен пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекаралары туралы» шешіміне өзгерісті енгізу туралы
