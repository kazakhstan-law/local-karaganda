  title:
    rus: О внесении изменения и дополнений в решение 21 сессии Бухар-Жырауского районного маслихата от 28 февраля 2014 года № 4 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Бухар-Жырауского района»
    kaz: Бұқар жырау аудандық мәслихатының 21 сессиясының 2014 жылғы 28 ақпандағы № 4 «Бұқар жырау ауданының Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс пен толықтырулар енгізу туралы
