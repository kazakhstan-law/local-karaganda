    kaz: Бұқар жырау аудандық мәслихатының 21 сессиясының 2014 жылғы 28 ақпандағы № 4 "Бұқар жырау ауданының Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы" шешіміне өзгерістер енгізу туралы
