  title:
    rus: О внесении изменений в решение 21 сессии Бухар-Жырауского районного маслихата от 28 февраля 2014 года № 5 "О предоставлении в 2014 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Бухар-Жырауского района"
    kaz: Бұқар жырау аудандық мәслихатының 21 сессиясының 2014 жылғы 28 ақпандағы № 5 "Бұқар жырау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын 2014 жылы ұсыну туралы" шешіміне өзгерістер енгізу туралы
