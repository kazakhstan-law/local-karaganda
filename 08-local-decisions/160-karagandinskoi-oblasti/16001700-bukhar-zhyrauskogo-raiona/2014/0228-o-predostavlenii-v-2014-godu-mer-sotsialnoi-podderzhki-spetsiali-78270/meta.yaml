act_code: '78270'
requisite: Решение 21 сессии Бухар-Жырауского районного маслихата Карагандинской области от 28 февраля 2014 года № 5. Зарегистрировано Департаментом юстиции Карагандинской области 27 марта 2014 года № 2570
title:
  rus: О предоставлении в 2014 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Бухар-Жырауского района
  kaz: Бұқар жырау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына әлеуметтік қолдау шараларын 2014 жылы ұсыну туралы
