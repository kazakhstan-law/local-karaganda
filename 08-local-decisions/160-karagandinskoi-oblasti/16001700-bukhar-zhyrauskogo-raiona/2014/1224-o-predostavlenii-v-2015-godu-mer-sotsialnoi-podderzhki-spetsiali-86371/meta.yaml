act_code: '86371'
requisite: Решение 31 сессии Бухар-Жырауского районного маслихата Карагандинской области от 24 декабря 2014 года № 5. Зарегистрировано Департаментом юстиции Карагандинской области 19 января 2015 года № 2930
title:
  rus: О предоставлении в 2015 году мер социальной поддержки специалистам здравоохранения, образования, социального  обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Бухар-Жырауского района
  kaz: Бұқар жырау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына әлеуметтік қолдау шараларын 2015 жылы  ұсыну туралы
