requisite: Решение 29 сессии Бухар-Жырауского районного маслихата Карагандинской области от 31 октября 2014 года № 5. Зарегистрировано Департаментом юстиции Карагандинской области 20 ноября 2014 года № 2819. Утратило силу решением Бухар-Жырауского районного маслихата Карагандинской области от 9 марта 2021 года № 4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах
  kaz: Ауылдық елдi мекендерде тұратын және жұмыс істейтiн мемлекеттiк әлеуметтiк қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшiн әлеуметтік көмек беру туралы
