act_code: '109083'
requisite: Решение 10 сессии Бухар-Жырауского районного маслихата Карагандинской области от 23 декабря 2016 года № 8. Зарегистрировано Департаментом юстиции Карагандинской области 9 января 2017 года № 4098
title:
  rus: О предоставлении в 2017 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Бухар-Жырауского района
  kaz: Бұқар жырау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына 2017 жылы әлеуметтік қолдау шараларын ұсыну туралы
