requisite: Решение 18 сессии Бухар-Жырауского районного маслихата Карагандинской области от 6 сентября 2005 года № 5. Зарегистрировано Управлением юстиции Бухар-Жырауского района Карагандинской области 16 сентября 2005 года № 8-11-6. Утратило силу решением Бухар-Жырауского районного маслихата Карагандинской области от 31 марта 2009 года № 5
title:
  rus: Об увеличении базовых ставок земельного налога на земли сельскохозяйственного назначения, на земли населенных пунктов (за исключением придомовых участков), на земли промышленности расположенные вне населенных пунктов
  kaz: Елді мекендерден тыс орналасқан өнеркәсіп жерлеріне, елді мекендердің жерлеріне (үй іргесіндегі жер участкелерін қоспағанда), ауыл шаруашылық мақсатындағы жерлерге салынатын базалық салық ставкаларды жоғарылату туралы
