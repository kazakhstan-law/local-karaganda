requisite: Решение 11 сессии Бухар-Жырауского районного маслихата Карагандинской области от 14 января 2009 года № 4. Зарегистрировано Управлением юстиции Бухар-Жырауского района Карагандинской области 02 февраля 2009 года № 8-11-69. Утратило силу решением Бухар-Жырауского районного маслихата Карагандинской области от 28 марта 2019 года № 8 (вводится в действие по истечении десяти календарных дней после первого официального опубликования)
title:
