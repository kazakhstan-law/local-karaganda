act_code: '69997'
requisite: Решение 11 сессии Бухар-Жырауского районного маслихата Карагандинской области от 14 декабря 2012 года № 5. Зарегистрировано Департаментом юстиции Карагандинской области 11 января 2013 года № 2109
title:
  rus: О предоставлении в 2013 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Бухар-Жырауского района
  kaz: Бұқар жырау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын 2013 жылы ұсыну туралы
