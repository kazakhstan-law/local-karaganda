  title:
    rus: О внесении изменений в решение 21 сессии Бухар-Жырауского районного маслихата от 28 декабря 2017 года № 5 «Об утверждении норм образования и накопления коммунальных отходов по Бухар-Жыраускому району, а также тарифов на сбор, вывоз и захоронение твердых бытовых отходов по поселку Ботакара, селам Новоузенка, Доскей, Кокпекты и поселку Кушокы Бухар-Жырауского района»
    kaz: Бұқар жырау аудандық мәслихатының 21 сессиясының 2017 жылғы 28 желтоқсандағы № 5 «Бұқар жырау ауданы бойынша коммуналдық қалдықтардың пайда болу және жинақталу нормаларын, сондай-ақ Ботақара кенті, Новоузенка, Доскей, Көкпекті ауылдары мен Қушоқы кенті бойынша тұрмыстық қатты қалдықтарды жинау, шығару және көмуге арналған тарифтерді бекіту туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/134932/rus
