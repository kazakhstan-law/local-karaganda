act_code: '118146'
requisite: Решение 21 сессии Бухар-Жырауского районного маслихата Карагандинской области от 28 декабря 2017 года № 5. Зарегистрировано Департаментом юстиции Карагандинской области 12 января 2018 года № 4568
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов по Бухар-Жыраускому району, а также тарифов на сбор, вывоз и захоронение твердых бытовых отходов по поселку Ботакара, селам Новоузенка, Доскей, Кокпекты и поселку Кушокы Бухар-Жырауского района
  kaz: Бұқар жырау ауданы бойынша коммуналдық қалдықтардың пайда болу және жинақталу нормаларын, сондай-ақ Ботақара кенті, Новоузенка, Доскей, Көкпекті ауылдары мен Қушоқы кенті бойынша тұрмыстық қатты қалдықтарды жинау, шығару және көмуге арналған тарифтерді бекіту туралы
