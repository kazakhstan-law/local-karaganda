  title:
    rus: О внесении изменений в решение 20 сессии Бухар-Жырауского районного маслихата от 22 декабря 2017 года № 7 «О предоставлении в 2018 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Бухар-Жырауского района»
    kaz: Бұқар жырау аудандық мәслихатының 20 сессиясының 2017 жылғы 22 желтоқсандағы № 7 «Бұқар жырау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына 2018 жылы әлеуметтік қолдау шараларын ұсыну туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/120785/rus
