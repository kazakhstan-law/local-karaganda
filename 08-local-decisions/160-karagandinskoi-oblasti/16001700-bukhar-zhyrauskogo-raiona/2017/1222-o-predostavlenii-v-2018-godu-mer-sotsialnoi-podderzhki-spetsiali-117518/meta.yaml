act_code: '117518'
requisite: Решение 20 сессии Бухар-Жырауского районного маслихата Карагандинской области от 22 декабря 2017 года № 7. Зарегистрировано Департаментом юстиции Карагандинской области 3 января 2018 года № 4527
title:
  rus: О предоставлении в 2018 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Бухар-Жырауского района
  kaz: Бұқар жырау ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылы әлеуметтік қолдау шараларын көрсету туралы
