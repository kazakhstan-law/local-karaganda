act_code: '97739'
requisite: Решение 43 сессии Бухар-Жырауского районного маслихата Карагандинской области от 22 декабря 2015 года № 6. Зарегистрировано Департаментом юстиции Карагандинской области 11 января 2016 года № 3607
title:
  rus: О предоставлении в 2016 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Бухар-Жырауского района
  kaz: Бұқар жырау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына 2016 жылы әлеуметтік қолдау шараларын ұсыну туралы
