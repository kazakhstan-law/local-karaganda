act_code: '205282'
requisite: Решение Бухар-Жырауского районного маслихата Карагандинской области от 26 декабря 2024 года № 6
title:
  rus: О предоставлении в 2025 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Бухар-Жырауского района
  kaz: Бұқар жырау ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2025 жылы әлеуметтік қолдау шараларын ұсыну туралы
