caused_by:
  code: '208553'
  requisite: Решение Бухар-Жырауского районного маслихата Карагандинской области от 27 марта 2025 года № 8
  title:
    rus: О внесении изменений в решение 25 сессии Бухар-Жырауского районного маслихата от 26 декабря 2024 года № 6 «О предоставлении в 2025 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, за исключением лиц, занимающих руководящие должности, прибывшим для работы и проживания в сельские населенные пункты Бухар-Жырауского района»
    kaz: Бұқар жырау аудандық мәслихатының 25 сессиясының 2024 жылғы 26 желтоқсандағы № 6 «Бұқар жырау ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, басшылық лауазымдарды атқаратын адамдарды қоспағанда, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2025 жылы әлеуметтік қолдау шараларын ұсыну туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/208553/rus
