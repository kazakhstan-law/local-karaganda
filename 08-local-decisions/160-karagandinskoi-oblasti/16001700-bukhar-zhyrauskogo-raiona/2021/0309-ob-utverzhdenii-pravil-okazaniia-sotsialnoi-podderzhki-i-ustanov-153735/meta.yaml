requisite: Решение Бухар-Жырауского районного маслихата Карагандинской области от 9 марта 2021 года № 4. Зарегистрировано Департаментом юстиции Карагандинской области 25 марта 2021 года № 6258
title:
  rus: Об утверждении Правил оказания социальной поддержки и установления размера по оплате коммунальных услуг и приобретению топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Бухар-Жырауского района
  kaz: Бұқар жырау ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына коммуналдық қызметтерді төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету және мөлшерін белгілеу қағидаларын бекіту туралы
