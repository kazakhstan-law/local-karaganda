  title:
    rus: О внесении изменения в решение Бухар-Жырауского районного маслихата от 9 марта 2021 года № 4 «Об утверждении Правил оказания социальной поддержки и установления размера по оплате коммунальных услуг и приобретению топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Бухар-Жырауского района»
    kaz: Бұқар жырау аудандық мәслихатының 2021 жылғы 9 наурыздағы № 4 «Бұқар жырау ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына коммуналдық қызметтерді төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету және мөлшерін белгілеу қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
