requisite: Решение 16 сессии Саранского городского маслихата Карагандинской области от 23 июля 2009 года № 282. Зарегистрировано Управлением юстиции города Сарани Карагандинской области 1 сентября 2009 года № 8-7-89. Утратило силу - решением 27 сессии Саранского городского маслихата Карагандинской области от 1 июля 2010 года № 433
title:
  rus: Об утверждении Правил предоставления жилищных пособий на содержание жилья, оплату коммунальных услуг и компенсацию повышения тарифов абонентской платы за оказание услуг телекоммуникаций социально защищаемым гражданам города Сарани
  kaz: Саран қаласының әлеуметтік тұрғыдан қорғалатын азаматтарына тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақыларын беру және телекоммуникация қызметтерін көрсеткені үшін абоненттік төлемақы тарифінің көтерілуіне өтемақы төлеу Қағидаларын бекіту туралы
