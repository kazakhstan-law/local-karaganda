    kaz: «Әлеуметтік көмек көрсетудің, оның мөлшерін белгілеудің және Саран қаласы мен Ақтас кентінің мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Саран қалалық мәслихатының 2013 жылғы 12 желтоқсандағы № 279 шешіміне өзгерістер енгізу туралы
