  title:
    rus: О внесении изменения в решение Саранского городского маслихата от 12 декабря 2013 года № 279 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Сарани и поселка Актас»
    kaz: Саран қалалық мәслихатының 2013 жылғы 12 желтоқсандағы «Әлеуметтік көмек көрсетудің, оның мөлшерін белгілеудің және Саран қаласы мен Ақтас кентінің мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 279 шешіміне өзгеріс енгізу туралы
