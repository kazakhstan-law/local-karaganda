  title:
    rus: О внесении изменений и дополнений в решение № 517 от 22 декабря 2006 года 32 сессии Саранского городского маслихата "Об утверждении Правил предоставления малообеспеченным гражданам жилищных пособий на содержание жилья, оплату коммунальных услуг и компенсацию повышения тарифов абонентской платы за телефон абонентам городских сетей телекоммуникаций"
    kaz: Саран қалалық мәслихатының 2006 жылғы 22 желтоқсандағы 32 сессиясының "Аз қамтылған азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақыларын беру және қалалық телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы беру Қағидасын бекіту туралы" № 517 шешіміне өзгертулер мен толықтырулар енгізу туралы
