requisite: Решение 27 сессии Саранского городского маслихата Карагандинской области от 8 июня 2006 года № 447. Зарегистрировано управлением юстиции города Сарани 3 июля 2006 года № 8-7-27. Утратило силу решением 32 сессии Саранского городского маслихата Карагандинской области от 22 декабря 2006 года № 517
title:
  rus: Об утверждении Правил предоставления малообеспеченным гражданам жилищных пособий на содержание жилья, оплату коммунальных услуг и компенсацию повышения тарифов абонентской платы за телефон абонентам городских сетей телекоммуникаций
  kaz: Аз қамтылған азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақыларын беру және қалалық телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы беру Қағидасын бекіту туралы
