requisite: Решение Саранского городского маслихата Карагандинской области от 23 июня 2022 года № 141
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей поселка Актас города Сарани Карагандинской области для участия в сходе местного сообщества
  kaz: Жергілікті қоғамдастықтың бөлек жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін Қарағанды облысы Саран қаласы Ақтас кентінің тұрғындары өкілдерінің санын айқындау қағидасын бекіту туралы
