title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в городе Сарани и поселке Актас
  kaz: Саран қаласы мен Ақтас кентінде жеке оқу жоспары бойынша мүгедектігі бар балалар қатарындағы кемтар балаларды үйде оқытуға жұмсалған шығындарды  өндіріп алу тәртібі мен мөлшерін айқындау туралы
