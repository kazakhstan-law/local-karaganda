  title:
    rus: О внесении изменения в решение Саранского городского маслихата от 23 ноября 2023 года № 75 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определении перечня отдельных категорий нуждающихся граждан города Сарани и поселка Актас»
