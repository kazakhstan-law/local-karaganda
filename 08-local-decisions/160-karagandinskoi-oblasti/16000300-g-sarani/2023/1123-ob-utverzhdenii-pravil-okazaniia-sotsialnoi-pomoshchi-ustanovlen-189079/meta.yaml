  title:
    rus: О внесении изменения в решение Саранского городского маслихата от 23 ноября 2023 года № 75 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан города Сарани и поселка Актас»
    kaz: Саран қалалық мәслихатының «Әлеуметтік көмек көрсетудің, оның мөлшерін белгілеудің және Саран қаласы мен Ақтас кентінің мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» 2023 жылғы 23 қарашадағы № 75 шешіміне өзгеріс енгізу туралы
