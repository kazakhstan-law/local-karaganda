requisite: Решение Жезказганского городского маслихата Карагандинской области от 11 мая 2016 года № 2/20. Зарегистрировано Департаментом юстиции Карагандинской области 30 мая 2016 года № 3830
title:
  rus: О предоставлении в 2016 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Жезказгана
  kaz: Жезқазған қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына әлеуметтік қолдау шараларын  2016  жылы ұсыну  туралы
