act_code: '119640'
requisite: Решение Жезказганского городского маслихата Карагандинской области от 27 февраля 2018 года № 19/179. Зарегистрировано Департаментом юстиции Карагандинской области 14 марта 2018 года № 4649
title:
  rus: О предоставлении в 2018 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Жезказгана
  kaz: Жезқазған қаласының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын 2018 жылы көрсету туралы
