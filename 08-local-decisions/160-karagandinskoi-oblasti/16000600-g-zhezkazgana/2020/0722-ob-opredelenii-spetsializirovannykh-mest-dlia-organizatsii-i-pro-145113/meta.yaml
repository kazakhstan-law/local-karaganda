  title:
    rus: О внесении изменений и дополнения в решение Жезказганского городского маслихата от 22 июля 2020 года № 49/423 «О специализированных местах для организации и проведения мирных собраний и границах, прилегающих территорий, в которых запрещено проведение пикетирования на территории города Жезказган»
    kaz: Жезқазған қалалық мәслихатының 2020 жылғы 22 шілдедегі № 49/423 «Жезқазған қаласының аумағында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындар және пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекаралары туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
