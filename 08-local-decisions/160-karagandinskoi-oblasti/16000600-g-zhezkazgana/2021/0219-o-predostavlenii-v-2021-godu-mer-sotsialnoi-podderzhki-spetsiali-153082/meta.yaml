act_code: '153082'
requisite: Решение Жезказганского городского маслихата Карагандинской области от 19 февраля 2021 года № 2/14. Зарегистрировано Департаментом юстиции Карагандинской области 26 февраля 2021 года № 6217
title:
  rus: О предоставлении в 2021 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты города Жезказган
  kaz: Жезқазған қаласының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын 2021 жылы көрсету туралы
