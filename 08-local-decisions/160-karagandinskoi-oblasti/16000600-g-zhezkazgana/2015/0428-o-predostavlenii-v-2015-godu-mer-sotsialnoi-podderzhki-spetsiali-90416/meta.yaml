act_code: '90416'
requisite: Решение Жезказганского городского маслихата Карагандинской области от 28 апреля 2015 года № 33/290. Зарегистрировано Департаментом юстиции Карагандинской области 26 мая 2015 года № 3218. Прекращено действие в связи с истечением срока (письмо Жезказганского городского маслихата от 15 февраля 2016 года № 37/01)
title:
  rus: О предоставлении в 2015 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Жезказгана
  kaz: Жезқазған қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына әлеуметтік қолдау шараларын 2015 жылы ұсыну туралы
