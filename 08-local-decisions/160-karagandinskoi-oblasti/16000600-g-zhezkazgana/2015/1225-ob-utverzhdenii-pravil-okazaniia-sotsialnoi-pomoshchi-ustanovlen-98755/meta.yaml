  title:
    rus: О внесении изменений и дополнений в решение Жезказганского городского маслихата от 25 декабря 2015 года № 38/347 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Жезказган»
    kaz: Жезқазған қалалық мәслихатының 2015 жылғы 25 желтоқсандағы № 38/347 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің Жезқазған қаласының мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
