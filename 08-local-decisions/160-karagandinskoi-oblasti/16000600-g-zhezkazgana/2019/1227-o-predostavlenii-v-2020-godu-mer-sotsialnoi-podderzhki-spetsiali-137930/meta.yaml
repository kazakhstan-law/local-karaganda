act_code: '137930'
requisite: Решение Жезказганского городского маслихата Карагандинской области от 27 декабря 2019 года № 42/372. Зарегистрировано Департаментом юстиции Карагандинской области 31 декабря 2019 года № 5647
title:
  rus: О предоставлении в 2020 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Жезказгана
  kaz: Жезқазған қаласының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын 2020 жылы көрсету туралы
