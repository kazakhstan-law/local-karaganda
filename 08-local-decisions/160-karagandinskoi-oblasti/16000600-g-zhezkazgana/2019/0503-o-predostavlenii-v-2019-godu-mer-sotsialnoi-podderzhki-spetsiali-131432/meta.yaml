act_code: '131432'
requisite: Решение Жезказганского городского маслихата Карагандинской области от 3 мая 2019 года № 34/305. Зарегистрировано Департаментом юстиции Карагандинской области 8 мая 2019 года № 5325
title:
  rus: О предоставлении в 2019 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Жезказгана
  kaz: Жезқазған қаласының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын 2019 жылы көрсету туралы
