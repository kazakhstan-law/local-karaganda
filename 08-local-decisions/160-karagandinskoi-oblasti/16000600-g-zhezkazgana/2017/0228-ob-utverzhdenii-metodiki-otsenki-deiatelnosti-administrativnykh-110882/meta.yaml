    kaz: Жезқазған қалалық мәслихатының 2017 жылғы 28 ақпандағы № 8/90 «Жезқазған қалалық мәслихатының аппараты» мемлекеттік мекемесінде «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
