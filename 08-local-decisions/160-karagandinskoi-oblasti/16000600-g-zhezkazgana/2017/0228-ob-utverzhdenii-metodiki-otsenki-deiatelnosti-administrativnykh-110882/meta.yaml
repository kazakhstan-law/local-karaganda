title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» в государственном учреждении «Аппарат Жезказганского городского маслихата»
  kaz: «Жезқазған қалалық мәслихатының аппараты» мемлекеттік мекемесінде «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы
