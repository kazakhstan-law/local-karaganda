act_code: '111648'
requisite: Решение Жезказганского городского маслихата Карагандинской области от 11 апреля 2017 года № 9/98. Зарегистрировано Департаментом юстиции Карагандинской области 20 апреля 2017 года № 4226
title:
  rus: О предоставлении в 2017 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Жезказгана
  kaz: Жезқазған қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына әлеуметтік қолдау шараларын 2017 жылы ұсыну туралы
