requisite: Решение Жезказганского городского маслихата Карагандинской области от 9 июля 2014 года № 25/218. Зарегистрировано Департаментом юстиции Карагандинской области 29 июля 2014 года № 2700.
title:
  rus: О предоставлении в 2014 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Жезказгана
  kaz: Жезқазған қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына әлеуметтік қолдау шараларын 2014 жылы ұсыну туралы
