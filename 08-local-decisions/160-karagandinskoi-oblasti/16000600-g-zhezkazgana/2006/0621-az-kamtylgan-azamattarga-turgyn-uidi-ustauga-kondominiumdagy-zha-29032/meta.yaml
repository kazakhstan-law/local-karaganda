act_code: '29032'
requisite: Қарағанды облысы Жезқазған қалалық мәслихатының 2006 жылғы 21 маусымдағы № 30/343 шешімі. Жезқазған қаласы Әділет басқармасында 2006 жылғы 26 шілдеде № 8-2-31 тіркелді. Күші жойылды - Қарағанды облысы Жезқазған қалалық мәслихатының 2010 жылғы 16 шілдедегі № 24/296 шешімімен
title:
  rus: Аз қамтылған азаматтарға тұрғын үйді ұстауға, кондоминиумдағы жалпы мүлік объектісін күрделі жөндеуден өткізуді қосып, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақысын беру және қалалық телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы берудің Қағидасын бекіту туралы
  kaz: Аз қамтылған азаматтарға тұрғын үйді ұстауға, кондоминиумдағы жалпы мүлік объектісін күрделі жөндеуден өткізуді қосып, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақысын беру және қалалық телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы берудің Қағидасын бекіту туралы
