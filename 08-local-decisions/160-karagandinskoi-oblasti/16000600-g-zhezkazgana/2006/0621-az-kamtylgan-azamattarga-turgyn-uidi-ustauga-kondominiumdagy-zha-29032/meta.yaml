  requisite: Решение Жезказганского городского маслихата Карагандинской области от 23 июля 2008 года № 9/96. Зарегистрировано Управлением юстиции города Жезказгана Карагандинской области 6 августа 2008 года № 8-2-65. Утратило силу - решением Жезказганского городского маслихата Карагандинской области от 16 июля 2010 года N 24/296
  title:
    rus: О внесении изменений и дополнений в решение Жезказганского городского Маслихата от 21 июня 2006 года № 30/343 "Об утверждении Правил предоставления малообеспеченным гражданам жилищных пособий на содержание жилья, включая на капитальный ремонт общего имущества объекта кондоминимума, оплату коммунальных услуг и компенсации повышения тарифов абонентской платы за телефон абонентам городских сетей телекоммуникации"
    kaz: Жезқазған қалалық Маслихаттың 2006 жылғы 21 маусымдағы № 30/343 "Аз қамтылған азаматтарға тұрғын үйді ұстауға, кондоминиумдағы жалпы мүлік объектісін күрделі жөндеуден өткізуді қосып, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақысын беру және қалалық телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы берудің Қағидасын бекіту туралы" шешіміне өзгерістер мен толықтырулар енгізу туралы
