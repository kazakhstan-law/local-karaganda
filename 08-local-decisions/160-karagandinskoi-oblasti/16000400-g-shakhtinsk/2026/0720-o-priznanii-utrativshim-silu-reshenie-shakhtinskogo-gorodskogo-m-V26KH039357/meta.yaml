title:
  rus: О признании утратившим силу решение Шахтинского городского маслихата Карагандинской области от 27 июня 2023 года № 269/4 «О понижении размера ставки налогов при применении специального налогового режима розничного налога»
  kaz: «Бөлшек салықтың арнаулы салық режимін қолдану кезінде салық мөлшерлемесінің мөлшерін төмендету туралы» Қарағанды облысы Шахтинск қалалық мәслихатының 2023 жылғы 27 маусымдағы № 269/4 шешімінің күшін жою туралы
