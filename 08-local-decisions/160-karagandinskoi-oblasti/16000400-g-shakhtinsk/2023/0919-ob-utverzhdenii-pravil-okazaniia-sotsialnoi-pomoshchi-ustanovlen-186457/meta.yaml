  title:
    rus: О внесении изменений и дополнений в решение Шахтинского городского маслихата от 19 сентября 2023 года № 276/5 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан»
    kaz: Шахтинск қалалық мәслихатының 2023 жылғы 19 қыркүйектегі № 276/5 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
