act_code: '42464'
requisite: Решение Шахтинского городского маслихата Карагандинской области от 15 октября 2008 года № 426/7. Зарегистрировано Управлением юстиции города Шахтинск Карагандинской области 27 ноября 2008 года № 8-8-57. Утратило силу - решением Шахтинского городского маслихата Карагандинской области от 6 апреля 2012 года № 812/3
title:
  rus: Об утверждении "Правил организации уборки, санитарного содержания, обеспечения чистоты и благоустройство на территории города Шахтинска и прилегающих поселков", "Правил защиты и содержания зеленых насаждений в городе Шахтинске и прилегающих поселках", "Правил содержания домашних собак, кошек в городе Шахтинске и прилегающих поселках"
  kaz: '"Жинау жұмыстарын ұйымдастыру, санитарлық жабдықтау, тазалықты қамтамасыз ету және Шахтинск қаласының аумағында және маңындағы кенттерде абаттандыру Қағидаларын", "Шахтинск қаласында және маңындағы кенттерде жасыл желектерін қорғау мен күтіп ұстау Ережесін", "Шахтинск қаласында және маңындағы кенттерде үй иттерін, мысықтарды ұстау Ережелерін" бекіту туралы'
