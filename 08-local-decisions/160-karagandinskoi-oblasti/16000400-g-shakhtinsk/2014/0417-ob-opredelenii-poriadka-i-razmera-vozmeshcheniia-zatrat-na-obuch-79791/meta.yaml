requisite: Решение XХVII сессии V созыва Шахтинского городского маслихата Карагандинской области от 17 апреля 2014 года № 1038/27. Зарегистрировано Департаментом юстиции Карагандинской области 11 мая 2014 года № 2635. Утратило силу решением Шахтинского городского маслихата Карагандинской области от 29 ноября 2023 года № 293/6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в городе Шахтинск и прилегающих поселках Долинка, Новодолинский, Шахан
  kaz: Шахтинск қаласында және іргелес Долинка, Новодолинский, Шахан кенттерінде мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы
