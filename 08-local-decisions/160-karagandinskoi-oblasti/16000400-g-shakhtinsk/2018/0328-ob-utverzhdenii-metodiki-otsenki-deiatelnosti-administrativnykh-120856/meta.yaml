requisite: Решение XX сессии VI созыва Шахтинского городского маслихата Карагандинской области от 28 марта 2018 года № 1490/20. Зарегистрировано Департаментом юстиции Карагандинской области 13 апреля 2018 года № 4699. Утратило силу решением Шахтинского городского маслихата Карагандинской области от 22 апреля 2022 года № 144/13 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
