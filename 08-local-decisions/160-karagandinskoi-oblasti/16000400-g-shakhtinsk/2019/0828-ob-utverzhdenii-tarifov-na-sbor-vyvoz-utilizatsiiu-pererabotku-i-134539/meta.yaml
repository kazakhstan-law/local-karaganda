act_code: '134539'
requisite: Решение Шахтинского городского маслихата Карагандинской области от 28 августа 2019 года № 1637/33. Зарегистрировано Департаментом юстиции Карагандинской области 9 сентября 2019 года № 5463. Утратило силу решением Шахтинского городского маслихата Карагандинской области от 10 июля 2023 года № 271/4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по городу Шахтинску, в том числе по поселкам Долинка, Новодолинский, Шахан
  kaz: Шахтинск қаласы бойынша, оның ішінде Долинка, Новодолинский, Шахан кенттері бойынша тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы
