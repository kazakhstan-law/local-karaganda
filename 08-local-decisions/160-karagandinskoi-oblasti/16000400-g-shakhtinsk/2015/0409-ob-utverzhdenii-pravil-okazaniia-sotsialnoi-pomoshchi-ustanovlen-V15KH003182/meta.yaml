  title:
    rus: О внесении изменений в решение XХXIII сессии Шахтинского городского маслихата от 9 апреля 2015 года № 1115/33 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан»
    kaz: Шахтинск қалалық мәслихатының 2015 жылғы 9 сәуірдегі ХХХІІІ сессиясының № 1115/33 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың үлгілік Қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
