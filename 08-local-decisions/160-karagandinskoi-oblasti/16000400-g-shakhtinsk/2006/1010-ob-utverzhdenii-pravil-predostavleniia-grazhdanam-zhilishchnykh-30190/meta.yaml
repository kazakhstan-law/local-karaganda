  title:
    rus: О внесении изменений и дополнений в решение ХХVII сессии городского Маслихата от 10.10.2006 года № 240/27 "Об утверждении Правил предоставления гражданам жилищных пособий на содержание жилья, оплату коммунальных услуг и компенсацию повышения тарифов абонентской платы за телефон абонентам городских сетей телекоммуникаций"
    kaz: Шахтинск қалалық Маслихаттың "Азаматтарға тұрғын үй жәрдем ақыларын және тұрғын үйді ұстауға, коммуналдық қызмет көрсету және қалалық телекоммуникация желілерінің абонентеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы берудегі ұсыныстар Ережесін бекіту туралы" 2006 жылғы 10 қазандағы ХХVІІ сессисының № 240/27 шешіміне өзгерістер және толықтырулар енгізу туралы
