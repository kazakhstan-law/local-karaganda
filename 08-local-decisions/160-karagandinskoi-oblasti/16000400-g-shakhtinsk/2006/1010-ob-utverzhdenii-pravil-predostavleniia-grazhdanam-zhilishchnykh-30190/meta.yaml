  title:
    rus: О внесении изменений в решение ХХVII сессии городского Маслихата от 10 октября 2006 года № 240/27 "Об утверждении Правил предоставления гражданам жилищных пособий на содержание жилья, коммунальных услуг и компенсацию повышения тарифов абонентской платы за телефон абонентам городских сетей телекоммуникаций"
    kaz: Шахтинск қалалық Маслихатының 2006 жылғы 10 қазандағы ХХVІ сессиясының  "Азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақыларды беру және қалалық телекоммуникация желілерінің абонентеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы берудің Ережесін бекіту туралы" № 240/27 шешіміне өзгерістер және толықтырулар енгізу туралы
