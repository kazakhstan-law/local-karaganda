requisite: Решение Шахтинского городского маслихата Карагандинской области от 10 октября 2006 года № 240/27. Зарегистрировано Управлением юстиции города Шахтинска Карагандинской области 3 ноября 2006 года за № 8-8-28. Утратило силу - решением XXI сессии IV созыва Шахтинского городского маслихата Карагандинской области от 9 июля 2010 года № 581/21
title:
  rus: Об утверждении Правил предоставления гражданам жилищных пособий на содержание жилья, коммунальных услуг и компенсацию повышения тарифов абонентской платы за оказание услуг телекоммуникаций
  kaz: Азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақыларды беру және телекоммуникация қызметтерін көрсеткені үшін абоненттік ақы тарифтерінің арттырылуына өтемақы берудің Ережесін бекіту туралы
