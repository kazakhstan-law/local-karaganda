  title:
    rus: О внесении изменений в решение XXVII сессии городского Маслихата от 10 октября 2006 года № 240/27 "Об утверждении Правил предоставления гражданам жилищных пособий на содержание жилья, коммунальных услуг и компенсацию повышения тарифов абонентской платы за телефон абонентам городских сетей телекоммуникаций"
    kaz: Шахтинск қалалық Мәслихатының 2006 жылғы 10 қазандағы ХХVІІ сессиясының "Азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақыларды беру және қалалық телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы берудің Ережесін бекіту туралы" N 240/27 шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/47206/rus
