  title:
    rus: О внесении изменений в решение ХІІІ сессии Сатпаевского городского маслихата от 31 октября 2008 года № 150 "Об определении видов оказания социальной помощи отдельным категориям нуждающихся граждан города Сатпаев"
    kaz: '"Сәтбаев қаласының жекелеген санаттағы мұқтаж азаматтарына әлеуметтік көмек түрлерін анықтау туралы" Сәтбаев қалалық мәслихатының 2008 жылғы 31 қазандағы ХІІІ сессиясының № 150 шешіміне өзгерістер енгізу туралы'
