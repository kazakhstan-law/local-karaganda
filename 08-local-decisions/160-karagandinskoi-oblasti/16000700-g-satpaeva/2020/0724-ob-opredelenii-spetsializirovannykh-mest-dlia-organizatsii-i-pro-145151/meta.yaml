  title:
    rus: О внесении изменений и дополнения в решение Сатпаевского городского маслихата от 24 июля 2020 года № 566 «О специализированных местах для организации и проведения мирных собраний и границах, прилегающих территорий, в которых запрещено проведение пикетирования на территории города Сатпаев»
    kaz: Сәтбаев қалалық мәслихатының 2020 жылғы 24 шілдедегі № 566 «Сәтбаев қаласының аумағында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындар және пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекаралары туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
