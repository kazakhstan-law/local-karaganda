  title:
    rus: О внесении изменения в решение Сатпаевского городского маслихата от 30 июня 2015 года № 355 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Сатпаев и поселка Жезказган»
