  title:
    rus: О внесении изменения в решение Сатпаевского городского маслихата от 30 июня 2015 года № 355 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Сатпаев и поселка Жезказган»
    kaz: Сәтбаев қалалық мәслихатының 2015 жылғы 30 маусымдағы № 355 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Сәтбаев қаласы мен Жезқазған кентінің мұқтаж азаматтарының жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
