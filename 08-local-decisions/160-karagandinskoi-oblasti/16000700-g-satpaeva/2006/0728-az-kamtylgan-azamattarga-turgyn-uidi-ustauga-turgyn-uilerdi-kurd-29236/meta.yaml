  requisite: Решение XIX сессии Сатпаевского городского маслихата Карагандинской области от 24 июля 2009 года № 232. Зарегистрировано Управлением юстиции города Сатпаев Карагандинской области 29 июля 2009 года № 8-6-86. Утратило силу - решением Сатпаевского городского маслихата Карагандинской области от 14 мая 2010 года № 336
  title:
    rus: О внесении изменений в решение ХХХІІІ сессии городского маслихата от 28 июля 2006 года № 359 "Об утверждении Правил предоставления малообеспеченным гражданам жилищного пособия на содержание жилья, включая капитальный ремонт жилого дома, оплату коммунальных услуг и компенсацию повышения тарифов абонентской платы за телефон абонентам городских сетей телекоммуникаций"
    kaz: '"Аз қамтылған азаматтарға тұрғын үйді ұстауға, тұрғын үйлерді күрделі жөндеуден өткізуге, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақысын  және қалалық телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы беру қағидасын бекіту туралы" қалалық мәслихаттың 2006 жылғы 28 шілдедегі ХХХІІІ сессиясының № 359 шешіміне өзгерістер енгізу туралы'
