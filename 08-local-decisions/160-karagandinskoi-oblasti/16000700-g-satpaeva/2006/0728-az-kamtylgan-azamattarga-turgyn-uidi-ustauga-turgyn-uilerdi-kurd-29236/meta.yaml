requisite: Қарағанды облысы Сәтбаев қалалық мәслихатының 2006 жылғы 28 шілдедегі № 359 шешімі. Қарағанды облысы Сәтбаев қаласы Әділет басқармасында 2006 жылғы 4 тамызда № 8-6-30 тіркелді. Күші жойылды - Қарағанды облысы Сәтбаев қалалық мәслихатының 2010 жылғы 14 мамырдағы № 336 шешімімен
title:
  rus: Аз қамтылған азаматтарға тұрғын үйді ұстауға, тұрғын үйлерді күрделі жөндеуден өткізуге, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақысын және қалалық және селолық телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы беру қағидасын бекіту туралы
