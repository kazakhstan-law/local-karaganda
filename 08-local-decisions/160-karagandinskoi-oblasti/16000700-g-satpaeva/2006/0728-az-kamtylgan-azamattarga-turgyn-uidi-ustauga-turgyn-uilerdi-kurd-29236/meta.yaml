  title:
    rus: О внесении изменений и дополнений в решение XXXIII сессии городского маслихата от 28 июля 2006 года № 359 "Об утверждении Правил предоставления малообеспеченным гражданам жилищных пособий на содержание жилья, оплату коммунальных услуг и компенсацию повышения тарифов абонентской платы за телефон абонентам городских сетей телекоммуникаций"
    kaz: '"Аз қамтылған азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақысын және қалалық телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы беру қағидасын бекіту туралы" қалалық мәслихаттың 2006 жылғы 28 шілдедегі XXXIII сессиясының № 359 шешіміне өзгерістер мен толықтырулар енгізу туралы'
