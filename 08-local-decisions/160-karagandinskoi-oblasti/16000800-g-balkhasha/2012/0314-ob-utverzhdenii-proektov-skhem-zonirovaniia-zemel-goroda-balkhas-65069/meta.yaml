title:
  rus: Об утверждении проектов (схем) зонирования земель города Балхаш, поселка Саяк и о корректировке базовых ставок земельного налога
  kaz: Балқаш қаласының, Саяқ кентінің жерлерін аймақтарға бөлу жобаларын (сызбаларын) бекіту және жер салығының базалық мөлшерлемелерін түзету туралы
