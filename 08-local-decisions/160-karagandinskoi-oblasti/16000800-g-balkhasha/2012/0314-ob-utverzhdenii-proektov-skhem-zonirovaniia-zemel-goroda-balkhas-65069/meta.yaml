  title:
    rus: О внесении изменений и дополнений в решение Балхашского городского маслихата от 14 марта 2012 года № 2/20 «Об утверждении схем зонирования земель для целей налогообложения с поправочными коэффициентами к ставкам земельного налога»
    kaz: Балқаш қалалық мәслихатының 2012 жылғы 14 наурыздағы № 2/20 «Жер салығының ставкасына түзету коэффициенттерімен салық салу мақсаты үшін жерлерді аймақтандыру сызбаларын бекіту туралы» шешіміне өзгерістер және толықтырулар енгізу туралы
