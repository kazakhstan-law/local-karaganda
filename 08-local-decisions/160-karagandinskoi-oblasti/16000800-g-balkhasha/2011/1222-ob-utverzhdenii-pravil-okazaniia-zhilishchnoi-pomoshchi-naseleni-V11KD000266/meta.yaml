  requisite: Қарағанды облысы Балқаш қалалық мәслихатының 2013 жылғы 27 наурыздағы № 13/111 шешімі. Қарағанды облысының Әділет департаментінде 2013 жылғы 25 сәуірде № 2314 болып тіркелді. Утратило силу решением Балхашского городского маслихата Карагандинской области от 26 апреля 2021 года № 4/31 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
