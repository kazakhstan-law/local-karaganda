    kaz: Қалалық мәслихаттың 2011 жылғы 22 желтоқсандағы "Балқаш қаласы тұрғындарына тұрғын үй көмегін көрсету Ережесін бекіту туралы" № 55/415 шешіміне өзгерістер енгізу туралы
