  title:
    rus: О внесении изменений и дополнений в решение Балхашского городского маслихата от 3 ноября 2023 года № 8/71 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан»
    kaz: Балқаш қалалық мәслихатының 2023 жылғы 3 қарашадағы № 8/71 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
