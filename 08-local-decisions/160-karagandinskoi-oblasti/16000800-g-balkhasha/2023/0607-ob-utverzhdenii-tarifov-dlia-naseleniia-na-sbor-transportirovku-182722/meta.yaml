  title:
    rus: О внесении изменения в решение Балхашского городского маслихата от 7 июня 2023 года № 4/47 «Об утверждении тарифов для населения на сбор, транспортировку, сортировку и захоронение твердых бытовых отходов по городу Балхаш»
    kaz: Балқаш қалалық мәслихатының 2023 жылғы 7 маусымдағы № 4/47 «Балқаш қаласы бойынша халық үшін тұрмыстық қатты қалдықтарды жинауға, тасымалдауға, сұрыптауға және көмуге арналған тарифтерді бекіту туралы» шешіміне өзгеріс енгізу туралы
