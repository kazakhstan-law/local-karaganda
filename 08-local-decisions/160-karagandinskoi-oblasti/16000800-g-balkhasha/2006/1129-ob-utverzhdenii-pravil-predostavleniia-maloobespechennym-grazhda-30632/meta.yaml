requisite: Решение Балхашского городского маслихата Карагандинской области от 29 ноября 2006 года № 37/352. Зарегистрировано Управлением юстиции города Балхаша Карагандинской области 14 декабря 2006 года за № 8-4-52. Утратило силу - решением Балхашского городского маслихата Карагандинской области от 30 июля 2010 года № 32/259
title:
  rus: Об утверждении Правил предоставления малообеспеченным гражданам жилищных пособий на содержание жилища, оплату коммунальных услуг и компенсацию повышения тарифов абонентской платы за оказание услуг телекоммуникаций
  kaz: Аз қамтылған азаматтарға тұрғын үйді ұстауға, коммуналдық қызметтерді және  телекоммуникация қызметтерін көрсеткені үшін абоненттік ақы тарифтерінің арттырылуына өтемақы төлеуге тұрғын үй жәрдемақыларын беру Қағидаларын бекіту туралы
