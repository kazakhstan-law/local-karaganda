  title:
    rus: О внесении изменений и дополнений в решение городского маслихата от 29 ноября 2006 года № 37/352 "Об утверждении Правил предоставления малообеспеченным гражданам жилищных пособий на содержание жилища, оплату коммунальных услуг и компенсацию повышения тарифов абонентской платы за телефон абонентам городских сетей телекоммуникаций"
    kaz: '"Аз қамтылған азаматтарға тұрғын үйді ұстауға, коммуналдық қызметтерді және қалалық телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы төлеуге тұрғын үй жәрдемақыларын беру Қағидаларын бекіту туралы" қалалық мәслихаттың 2006 жылғы 29 қарашадағы № 37/352 шешіміне өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/49089/rus
