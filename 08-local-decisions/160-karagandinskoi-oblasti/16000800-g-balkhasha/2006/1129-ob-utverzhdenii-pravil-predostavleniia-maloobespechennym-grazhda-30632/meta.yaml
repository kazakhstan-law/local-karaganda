  requisite: Решение Балхашского городского маслихата Карагандинской области от 27 июня 2007 года № 44/430. Зарегистрировано Управлением юстиции города Балхаша Карагандинской области 17 июля 2007 года № 8-4-79. Утратило силу - решением Балхашского городского маслихата Карагандинской области от 30 июля 2010 года № 32/259
  title:
    rus: О внесении изменения в решение городского маслихата от 29 ноября 2006 года № 37/352 "Об утверждении Правил предоставления малообеспеченным гражданам жилищных пособий на содержание жилья, оплату коммунальных услуг и компенсацию повышения тарифов абонентской платы за телефон абонентам городских сетей и телекоммуникаций"
    kaz: '"Аз қамтылған азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақыларын беру және қалалық телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы беру Қағидаларын бекіту туралы" қалалық мәслихаттың 2006 жылғы 29 қарашадағы № 37/352 шешіміне өзгеріс енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/34083/rus
