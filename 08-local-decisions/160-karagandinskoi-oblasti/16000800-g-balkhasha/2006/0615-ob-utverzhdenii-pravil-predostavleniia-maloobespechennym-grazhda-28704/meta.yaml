act_code: '28704'
requisite: Решение Балхашского городского маслихата Карагандинской области от 15 июня 2006 года № 34/326. Зарегистрировано управлением юстиции города Балхаша 7 июля 2006 года за № 8-4-40. Утратило силу решением Балхашского городского маслихата Карагандинской области от 29 ноября 2006 года № 37/352
title:
  rus: Об утверждении Правил предоставления малообеспеченным гражданам жилищных пособий на содержания жилья, оплату коммунальных услуг и компенсацию повышения тарифов абонентской платы за телефон абонентам городских сетей и телекоммуникаций
  kaz: Аз қамтылған азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақыларын беру және қалалық телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы беру Қағидаларын бекіту туралы
