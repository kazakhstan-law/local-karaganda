act_code: '144126'
requisite: Решение Каркаралинского районного маслихата Карагандинской области от 18 июня 2020 года № VI-57/487. Зарегистрировано Департаментом юстиции Карагандинской области 25 июня 2020 года № 5910
title:
  rus: Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Каркаралинского района
  kaz: Қарқаралы ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына коммуналдық қызметтерді төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету қағидаларын және мөлшерін бекіту туралы
