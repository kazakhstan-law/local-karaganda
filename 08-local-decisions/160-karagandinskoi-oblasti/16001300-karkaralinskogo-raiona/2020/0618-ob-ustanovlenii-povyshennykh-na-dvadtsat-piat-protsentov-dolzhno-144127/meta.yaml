  title:
    rus: О внесении изменений в решение Каркаралинского районного маслихата от 18 июня 2020 года № VI-57/484 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры и спорта, являющимся гражданскими служащими и работающим в сельской местности»
    kaz: Қарқаралы аудандық мәслихатының 2020 жылғы 18 маусымдағы № VI-57/484 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/158225/rus
