act_code: '64526'
requisite: Решение III сессии Каркаралинского районного маслихата Карагандинской области от 29 марта 2012 года N 3/28. Зарегистрировано Управлением юстиции Каркаралинского района Карагандинской области 10 апреля 2012 года N 8-13-118. Прекращено действие в связи с истечением срока, на который решение было принято (письмо Каркаралинского районного маслихата Карагандинской области от 3 марта 2016 года № 51)
title:
  rus: О предоставлении мер социальной поддержки в виде подъемного пособия и кредита для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Каркаралинского района в 2012 году
  kaz: 2012 жылы Қарқаралы ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға кредит түрінде әлеуметтік қолдау шараларын ұсыну туралы
