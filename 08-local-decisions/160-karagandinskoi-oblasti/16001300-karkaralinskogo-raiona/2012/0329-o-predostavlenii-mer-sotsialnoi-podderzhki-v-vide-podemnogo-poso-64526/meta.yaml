  title:
    rus: О внесении изменений и дополнений в решение районного маслихата от 29 марта 2012 года № 3/28 "О предоставлении мер социальной поддержки в виде подъемного пособия и кредита для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Каркаралинского района в 2012 году"
    kaz: Аудандық мәслихаттың 2012 жылғы 29 наурыздағы "2012 жылы Қарқаралы ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға кредит түрінде әлеуметтік қолдау шараларын ұсыну туралы" № 3/28 шешіміне өзгерістер мен толықтырулар енгізу туралы
