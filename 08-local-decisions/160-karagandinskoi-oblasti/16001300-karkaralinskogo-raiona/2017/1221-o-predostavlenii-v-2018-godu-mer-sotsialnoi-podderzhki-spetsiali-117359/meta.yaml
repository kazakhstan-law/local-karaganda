  title:
    rus: О внесении изменений в решение Каркаралинского районного маслихата от 21 декабря 2017 года № VI-21/179 «О предоставлении в 2018 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Каркаралинского района
    kaz: Қарқаралы аудандық мәслихатының 2017 жылғы 21 желтоқсандағы № VI-21/179 «Қарқаралы ауданының ауылдық елдi мекендерiне жұмыс iстеу және тұру үшін келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына әлеуметтiк қолдау шараларын 2018 жылы ұсыну туралы» шешіміне өзгерістер енгізу туралы
