act_code: '117359'
requisite: Решение XXI сессии Каркаралинского районного маслихата Карагандинской области от 21 декабря 2017 года № VI-21/179. Зарегистрировано Департаментом юстиции Карагандинской области 28 декабря 2017 года № 4507
title:
  rus: О предоставлении в 2018 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Каркаралинского района
  kaz: Қарқаралы ауданының ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтiк қолдау шараларын 2018 жылы ұсыну туралы
