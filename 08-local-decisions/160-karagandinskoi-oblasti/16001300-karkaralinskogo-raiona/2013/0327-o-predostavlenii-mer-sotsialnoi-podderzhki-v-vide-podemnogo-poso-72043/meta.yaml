act_code: '72043'
requisite: Решение XIV сессии Каркаралинского районного маслихата Карагандинской области от 27 марта 2013 года N 14/122. Зарегистрировано Департаментом юстиции Карагандинской области 15 апреля 2013 года N 2308. Прекращено действие в связи с истечением срока, на который решение было принято (письмо Каркаралинского районного маслихата Карагандинской области от 3 марта 2016 года № 51)
title:
  rus: О предоставлении мер социальной поддержки в виде подъемного пособия и кредита для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Каркаралинского района в 2013 году
  kaz: 2013 жылы Қарқаралы ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін кредит түрінде әлеуметтік қолдау шараларын ұсыну туралы
