    kaz: Қарқаралы аудандық мәслихатының 2013 жылғы 24 желтоқсандағы XXV сессиясының № 25/203 «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
