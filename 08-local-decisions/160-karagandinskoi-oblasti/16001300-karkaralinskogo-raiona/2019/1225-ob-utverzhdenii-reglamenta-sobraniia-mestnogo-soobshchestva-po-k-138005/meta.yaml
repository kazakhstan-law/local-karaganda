  title:
    rus: О внесении изменений в решение Каркаралинского районного маслихата от 25 декабря 2019 года № VI-51/429 «Об утверждении Регламента собрания местного сообщества на территории населенных пунктов Каркаралинского района»
    kaz: Қарқаралы аудандық мәслихатының 2019 жылғы 25 желтоқсандағы № VI-51/429 «Қарқаралы ауданының елді мекендері аумағында жергілікті қоғамдастық жиналысының регламентін бекіту туралы» шешіміне өзгерістер енгізу туралы
