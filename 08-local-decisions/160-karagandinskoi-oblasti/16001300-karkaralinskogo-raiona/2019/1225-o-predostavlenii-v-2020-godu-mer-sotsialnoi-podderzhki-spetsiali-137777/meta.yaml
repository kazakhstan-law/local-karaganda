act_code: '137777'
requisite: Решение Каркаралинского районного маслихата Карагандинской области от 25 декабря 2019 года № VI-51/419. Зарегистрировано Департаментом юстиции Карагандинской области 30 декабря 2019 года № 5629
title:
  rus: О предоставлении в 2020 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Каркаралинского района
  kaz: Қарқаралы ауданының ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтiк қолдау шараларын 2020 жылы ұсыну туралы
