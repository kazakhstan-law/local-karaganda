  title:
    rus: О внесении изменения в решение Каркаралинского районного маслихата от 10 января 2019 года № VI-39/334 «О предоставлении в 2019 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Каркаралинского района»
    kaz: Қарқаралы аудандық маслихатының 2019 жылғы 10 қаңтардағы № VI-39/334 «Қарқаралы ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын 2019 жылы ұсыну туралы» шешіміне өзгеріс енгізу туралы
