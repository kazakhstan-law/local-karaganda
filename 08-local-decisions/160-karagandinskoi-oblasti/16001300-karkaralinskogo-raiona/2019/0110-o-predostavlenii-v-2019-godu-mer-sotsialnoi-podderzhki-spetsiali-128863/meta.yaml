act_code: '128863'
requisite: Решение Каркаралинского районного маслихата Карагандинской области от 10 января 2019 года № VI-39/334. Зарегистрировано Департаментом юстиции Карагандинской области 23 января 2019 года № 5158
title:
  rus: О предоставлении в 2019 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Каркаралинского района
  kaz: Қарқаралы ауданының ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтiк қолдау шараларын 2019 жылы ұсыну туралы
