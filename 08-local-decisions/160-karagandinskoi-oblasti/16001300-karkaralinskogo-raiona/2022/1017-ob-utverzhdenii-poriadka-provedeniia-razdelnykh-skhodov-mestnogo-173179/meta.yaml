  kaz: Қарағанды облысы Қарқаралы ауданының Балқантау ауылдық округінің жергілікті қоғамдастық жиындарына қатысу үшін бөлек жергілікті қоғамдастық жиындарын өткізу тәртібі және ауыл тұрғындары өкілдерінің сандық құрамын бекіту туралы
