act_code: '36401'
requisite: Қарағанды облысы Қарқаралы аудандық мәслихатының 2007 жылғы 24 желтоқсандағы № 4/31 шешімі. Қарағанды облысы Қарқаралы ауданы әділет басқармасында 2007 жылғы 28 желтоқсанда № 8-13-39 тіркелді
title:
  rus: Қаркаралы ауданы бойынша 2008 жылға кәсіпкерлік қызметтің қейбір түрлері үшін объекті бірліктеріне тіркелген жиынтық салық ставкаларынын мөлшерін, аудан базарларында бір жолғы талонның бағасын және сырткы (көрнекі) жарнамаларды орналастырғаны үшін төлемакы ставкаларын белгілеу туралы
  kaz: Қаркаралы ауданы бойынша 2008 жылға кәсіпкерлік қызметтің қейбір түрлері үшін объекті бірліктеріне тіркелген жиынтық салық ставкаларынын мөлшерін, аудан базарларында бір жолғы талонның бағасын және сырткы (көрнекі) жарнамаларды орналастырғаны үшін төлемакы ставкаларын белгілеу туралы
