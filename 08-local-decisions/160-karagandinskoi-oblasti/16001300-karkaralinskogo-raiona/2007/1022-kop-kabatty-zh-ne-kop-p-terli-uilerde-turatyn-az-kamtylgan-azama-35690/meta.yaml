act_code: '35690'
requisite: Қарағанды облысы Қарқаралы аудандық мәслихатының 2007 жылғы 22 қазандағы № 3/24 шешімі. Қарағанды облысы Қарқаралы ауданы Әділет басқармасында 2007 жылғы 7 қарашада № 8-13-35 тіркелді. Күші жойылды - Қарағанды облысы Қарқаралы аудандық мәслихатының 2010 жылғы 23 желтоқсандағы № 28/281 шешімімен
title:
  rus: Көп қабатты және көп пәтерлі үйлерде тұратын аз қамтылған азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақыларды беру және телекоммуникация қызметтерін көрсеткені үшін абоненттік ақы тарифтерінің арттырылуына өтемақы беру Қағидасын бекіту туралы
  kaz: Көп қабатты және көп пәтерлі үйлерде тұратын аз қамтылған азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақыларды беру және телекоммуникация қызметтерін көрсеткені үшін абоненттік ақы тарифтерінің арттырылуына өтемақы беру Қағидасын бекіту туралы
