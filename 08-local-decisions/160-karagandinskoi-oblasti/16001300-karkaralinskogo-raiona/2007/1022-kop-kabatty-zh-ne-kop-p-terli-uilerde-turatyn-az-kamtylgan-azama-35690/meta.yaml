  requisite: Решение Каркаралинского районного маслихата Карагандинской области от 16 октября 2008 года № 9/99. Зарегистрировано Управлением юстиции Каркаралинского района Карагандинской области 31 октября 2008 года № 8-13-53. Утратило силу - решением Каркаралинского районного маслихата Карагандинской области от 23 декабря 2010 года № 28/281
  title:
    rus: О внесении изменения и дополнения в решение третьей сессии Каркаралинского районного Маслихата от 22 октября 2007 года № 3/24 "Об утверждении Правил предоставления малообеспеченным гражданам, проживающим в многоэтажных, многоквартирных домах, жилищных пособий на содержание жилья, оплату коммунальных услуг и компенсации повышения тарифов абонентской платы за телефон абонентам городских сетей телекоммуникаций"
    kaz: '"Көп қабатты және көп пәтерлі үйлерде тұратын аз қамтылған азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақыларды беру және қалалық телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы беру Қағидасын бекіту туралы" Қарқаралы аудандық Мәслихаттың үшінші сессиясыңың 2007 жылғы 22 қазандағы № 3/24 шешіміне өзгерту мен толықтыру енгізу туралы'
