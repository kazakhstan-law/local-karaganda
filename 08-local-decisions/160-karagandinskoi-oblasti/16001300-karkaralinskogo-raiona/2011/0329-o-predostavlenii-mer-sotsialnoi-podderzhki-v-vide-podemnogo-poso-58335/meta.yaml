act_code: '58335'
requisite: Решение Каркаралинского районного маслихата Карагандинской области от 29 марта 2011 года № 32/321. Зарегистрировано Управлением юстиции Каркаралинского района Карагандинской области 18 апреля 2011 года № 8-13-98
title:
  rus: О предоставлении мер социальной поддержки в виде подъемного пособия и кредита для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Каркаралинского района в 2011 году
  kaz: 2011 жылы Қарқаралы ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға кредит түрінде әлеуметтік қолдау шараларын ұсыну туралы
