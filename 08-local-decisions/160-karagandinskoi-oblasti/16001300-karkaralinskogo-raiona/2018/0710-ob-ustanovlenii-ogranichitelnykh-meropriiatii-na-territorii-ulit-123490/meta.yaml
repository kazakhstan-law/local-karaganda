requisite: Решение акима Каршигалинского сельского округа Каркаралинского района Карагандинской области от 10 июля 2018 года № 01. Зарегистрировано Департаментом юстиции Карагандинской области 12 июля 2018 года № 4874. Утратило силу решением акима Каршигалинского сельского округа Каркаралинского района Карагандинской области от 13 февраля 2019 года № 01 (вводится в действие со дня его первого официального опубликования)
title:
