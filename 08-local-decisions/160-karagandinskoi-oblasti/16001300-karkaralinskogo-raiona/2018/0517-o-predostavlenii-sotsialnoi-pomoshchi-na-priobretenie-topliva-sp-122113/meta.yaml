act_code: '122113'
requisite: Решение XXVIII сессии Каркаралинского районного маслихата Карагандинской области от 17 мая 2018 года № VI-28/251. Зарегистрировано Департаментом юстиции Карагандинской области 28 мая 2018 года № 4785. Утратило силу решением Каркаралинского районного маслихата Карагандинской области от 18 июня 2020 года № VI-57/487 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии проживающим и работающим в сельских населенных пунктах Каркаралинского района
  kaz: Қарқаралы ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек ұсыну туралы
