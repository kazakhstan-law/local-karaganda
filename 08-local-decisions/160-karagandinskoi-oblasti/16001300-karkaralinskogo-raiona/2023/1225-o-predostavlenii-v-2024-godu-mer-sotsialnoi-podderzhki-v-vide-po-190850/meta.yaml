  title:
    rus: О внесении изменения в решение Каркаралинского районного маслихата от 25 декабря 2023 года № VIII - 15/113 «О предоставлении в 2024 году мер социальной поддержки в виде подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Каркаралинского района»
    kaz: Қарқаралы аудандық мәслихатының 2023 жылғы 25 желтоқсандағы № VIII - 15/113 «Қарқаралы ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит түрінде әлеуметтік қолдау шараларын 2024 жылы ұсыну туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/201728/rus
