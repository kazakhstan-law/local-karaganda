requisite: Решение Каркаралинского районного маслихата Карагандинской области от 23 октября 2023 года № VIII-11/79. Зарегистрировано в Департаменте юстиции Карагандинской области 26 октября 2023 года № 6508-09
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Каркаралинском районе
