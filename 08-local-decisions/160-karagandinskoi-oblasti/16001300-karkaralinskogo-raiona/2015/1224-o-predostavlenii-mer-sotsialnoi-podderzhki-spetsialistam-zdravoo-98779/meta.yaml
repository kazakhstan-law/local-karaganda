requisite: Решение XLIV сессии Каркаралинского районного маслихата Карагандинской области от 24 декабря 2015 года № 44/388. Зарегистрировано Департаментом юстиции Карагандинской области 19 января 2016 года № 3623
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Каркаралинского района в 2016 году
  kaz: 2016 жылы Қарқаралы ауданының ауылдық елдi мекендерiне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына әлеуметтiк қолдау шараларын ұсыну туралы
