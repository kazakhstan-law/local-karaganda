  title:
    rus: О внесении изменения в решение Каркаралинского районного маслихата от 16 мая 2024 года № VIII-22/166 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Каркаралинского района»
    kaz: Қарқаралы аудандық мәслихатының 2024 жылғы 16 мамырдағы № VIII-22/166 «Қарқаралы ауданының Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
