act_code: '204784'
requisite: Решение Каркаралинского районного маслихата Карагандинской области от 25 декабря 2024 года № VIII-30/224
title:
  rus: О предоставлении в 2025 году мер социальной поддержки в виде подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Каркаралинского района
  kaz: Қарқаралы ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит түрінде әлеуметтік қолдау шараларын 2025 жылы ұсыну туралы
