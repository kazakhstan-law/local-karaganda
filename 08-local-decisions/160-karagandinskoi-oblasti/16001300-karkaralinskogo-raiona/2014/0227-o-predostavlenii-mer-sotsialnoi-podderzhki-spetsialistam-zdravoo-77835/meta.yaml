  title:
    rus: О внесении изменений в решение 26 сессии Каркаралинского районного маслихата от 27 февраля 2014 года № 26/217 "О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Каркаралинского района в 2014 году"
    kaz: Қарқаралы аудандық мәслихатының 26 сессиясының 2014 жылғы 27 ақпандағы № 26/217 "2014 жылы Қарқаралы ауданының ауылдық елдi мекендерiне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтiк қолдау шараларын ұсыну туралы" шешіміне өзгерістер енгізу туралы
