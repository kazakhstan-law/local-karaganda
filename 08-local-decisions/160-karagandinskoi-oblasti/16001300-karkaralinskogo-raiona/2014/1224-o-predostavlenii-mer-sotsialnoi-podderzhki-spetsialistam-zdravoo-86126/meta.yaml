act_code: '86126'
requisite: Решение от 24.12.2014 №34/290, Маслихат Каркаралинского района. Утратило силу решением Каркаралинского районного маслихата Карагандинской области от 24 декабря 2015 года № 44/388
title:
  rus: 'О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Каркаралинского района  '
  kaz: 'Қарқаралы ауданының ауылдық елдi мекендерiне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына әлеуметтiк қолдау шараларын ұсыну туралы '
