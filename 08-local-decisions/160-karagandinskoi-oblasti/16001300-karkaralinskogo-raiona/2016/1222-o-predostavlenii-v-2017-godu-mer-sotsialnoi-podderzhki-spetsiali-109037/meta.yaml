act_code: '109037'
requisite: Решение X сессии Каркаралинского районного маслихата Карагандинской области от 22 декабря 2016 года № VI-10/77. Зарегистрировано Департаментом юстиции Карагандинской области 5 января 2017 года № 4080
title:
  rus: О предоставлении в 2017 году мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Каркаралинского района
  kaz: Қарқаралы ауданының ауылдық елдi мекендерiне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына әлеуметтiк қолдау шараларын 2017 жылы ұсыну туралы
