act_code: '30992'
requisite: Қарағанды облысы Қарқаралы аудандық мәслихатының 2006 жылғы 21 желтоқсандағы № 29/166 шешімі. Қарағанды облысы Қарқаралы ауданы әділет басқармасында 2006 жылғы 28 желтоқсанда № 8-13-25 тіркелді
title:
  rus: Қарқаралы ауданы бойынша 2007 жылға кәсіпкерлік қызметтің кейбір түрлері үшін объекті бірліктеріне тіркелген жиынтық салық ставкаларының мөлшерін, аудан базарларында бір жолғы талонның бағасын және сыртқы (көрнекі) жарнамаларды орналастырғаны үшін төлемақы ставкаларын белгілеу туралы
  kaz: Қарқаралы ауданы бойынша 2007 жылға кәсіпкерлік қызметтің кейбір түрлері үшін объекті бірліктеріне тіркелген жиынтық салық ставкаларының мөлшерін, аудан базарларында бір жолғы талонның бағасын және сыртқы (көрнекі) жарнамаларды орналастырғаны үшін төлемақы ставкаларын белгілеу туралы
