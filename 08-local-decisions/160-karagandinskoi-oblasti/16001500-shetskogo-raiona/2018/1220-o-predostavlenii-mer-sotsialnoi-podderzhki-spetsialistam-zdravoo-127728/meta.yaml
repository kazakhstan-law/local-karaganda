  title:
    rus: О внесении изменения в решение Шетского районного маслихата от 20 декабря 2018 года № 26/230 «О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Шетского района в 2019 году»
    kaz: Шет аудандық мәслихатының 2018 жылғы 20 желтоқсандағы № 26/230 «2019 жылы Шет ауданының ауылдық елдi мекендерiне жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсiп кешенi мамандарына әлеуметтiк қолдау шараларын ұсыну туралы» шешіміне өзгеріс енгізу туралы
