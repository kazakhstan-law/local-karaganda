  kaz: 2019 жылы Шет ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіп кешені мамандарына әлеуметтік қолдау шараларын ұсыну туралы
