act_code: '141010'
requisite: Решение Шетского районного маслихата Карагандинской области от 27 марта 2020 года № 37/338. Зарегистрировано Департаментом юстиции Карагандинской области 2 апреля 2020 года № 5780
title:
  rus: О предоставлении в 2020 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Шетского района
  kaz: Шет ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы әлеуметтік қолдау шараларын көрсету туралы
