  title:
    rus: О внесении изменений в решение Шетского районного маслихата от 27 марта 2020 года № 37/339 «Об утверждении Правил предоставления социальной помощи по приобретению топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Шетского района»
    kaz: Шет аудандық мәслихатының 2020 жылғы 27 наурыздағы № 37/339 «Шет ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек көрсету Ережесін бекіту туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/163117/rus
