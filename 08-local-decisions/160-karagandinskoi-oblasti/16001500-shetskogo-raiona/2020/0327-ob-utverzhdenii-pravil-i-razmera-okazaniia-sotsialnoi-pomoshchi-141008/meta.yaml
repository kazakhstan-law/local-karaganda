  title:
    rus: О внесении изменения в решение Шетского районного маслихата от 27 марта 2020 года № 37/339 «Об утверждении правил и размера оказания социальной помощи по приобретению топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Шетского района»
    kaz: Шет аудандық мәслихатының 2020 жылғы 27 наурыздағы № 37/339 «Шет ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек көрсету қағидалары мен мөлшерін бекіту туралы» шешіміне өзгеріс енгізу туралы
