  title:
    rus: О внесении изменения в решение Шетского районного маслихата от 29 декабря 2020 года № 44/408 «О специализированных местах для организации и проведения мирных собраний, порядке использования специализированных мест для организации и проведения мирных собраний, нормах их предельной заполняемости, а также требованиях к материально-техническому и организационному обеспечению специализированных мест для организации и проведения мирных собраний и границ прилегающих территорий, в которых запрещено проведение пикетирования на территории Шетского района»
    kaz: Шет аудандық мәслихатының 2020 жылғы 29 желтоқсандағы № 44/408 «Шет ауданының аумағында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды пайдалану тәртібін, олардың шекті толу нормаларын, сондай-ақ бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптар мен пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекаралары туралы» шешіміне өзгеріс енгізу туралы
