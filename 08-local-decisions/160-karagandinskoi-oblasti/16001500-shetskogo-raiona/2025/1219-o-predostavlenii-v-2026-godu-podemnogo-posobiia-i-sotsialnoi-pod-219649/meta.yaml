act_code: '219649'
requisite: Решение Шетского районного маслихата Карагандинской области от 19 декабря 2025 года № 28/248
title:
  rus: О предоставлении в 2026 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохрания, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов и поселков, прибывшим для работы и проживания в сельские населенные пункты Шетского района
  kaz: 2026 жылы «Шет ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық огургтер мен кенттер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы»
