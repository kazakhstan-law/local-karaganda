requisite: Решение Шетского районного маслихата Карагандинской области от 23 декабря 2014 года № 27/232. Зарегистрировано Департаментом юстиции Карагандинской области 19 января 2015 года № 2926
title:
  rus: 'О предоставлении  мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса,  прибывшим для работы и проживания в сельские населенные пункты Шетского района в 2015 году '
  kaz: '2015 жылы Шет ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіп кешені мамандарына әлеуметтік қолдау шараларын ұсыну туралы  '
