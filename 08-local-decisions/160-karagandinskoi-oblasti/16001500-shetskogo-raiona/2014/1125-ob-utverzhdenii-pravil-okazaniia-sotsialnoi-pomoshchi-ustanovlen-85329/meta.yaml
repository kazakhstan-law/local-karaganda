  title:
    rus: О внесении изменений в решение ХХVI сессии Шетского районного маслихата от 25 ноября 2014 года № 26/223 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан»
    kaz: Шет аудандық мәслихатының 2014 жылғы 25 қарашадағы  ХХVI сессиясының «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 26/223 шешіміне өзгерістер енгізу туралы
