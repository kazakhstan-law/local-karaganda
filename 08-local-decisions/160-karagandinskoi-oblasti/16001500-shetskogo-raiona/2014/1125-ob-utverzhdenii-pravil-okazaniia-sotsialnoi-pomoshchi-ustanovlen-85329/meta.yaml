  title:
    rus: О внесении изменения в решение ХХVІ сессии Шетского районного маслихата от 25 ноября 2014 года № 26/223 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан»
    kaz: Шет аудандық мәслихатының 2014 жылғы 25 қарашадағы ХХVI сессиясының «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» № 26/223 шешіміне өзгеріс енгізу туралы
