requisite: Решение Шетского районного маслихата Карагандинской области от 19 марта 2015 года № 28/247. Зарегистрировано Департаментом юстиции Карагандинской области 10 апреля 2015 года № 3122. Утратило силу решением Шетского районного маслихата Карагандинской области от 29 марта 2018 года № 20/166
title:
  rus: О предоставлении  социальной  помощи  из  средств районного  бюджета  на  приобретение  топлива специалистам  государственных  организаций здравоохранения,  социального  обеспечения, образования,  культуры,  спорта  и  ветеринарии, проживающим  и  работающим  в  сельских населенных  пунктах  Шетского  района
  kaz: Шет ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мемлекеттік ұйымдардың мамандарына отын сатып алу үшін аудандық бюджет қаражаты есебінен  әлеуметтік қөмек беру туралы
