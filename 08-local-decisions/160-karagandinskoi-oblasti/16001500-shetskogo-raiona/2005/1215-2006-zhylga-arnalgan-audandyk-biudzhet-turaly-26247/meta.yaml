requisite: Қарағанды облысы Шет аудандық мәслихатының 2005 жылғы 15 желтоқсандағы № 23/230 шешімі. Қарағанды облысы Шет ауданы Әділет басқармасында 2005 жылғы 29 желтоқсанда № 8-17-10 тіркелді. Қолданылу мерзімінің уақытының бітуіне байланысты күші жойылды – Қарағанды облысы Шет аудандық мәслихатының 2018 жылғы 22 қазандағы № 3-2/1516 хатымен
