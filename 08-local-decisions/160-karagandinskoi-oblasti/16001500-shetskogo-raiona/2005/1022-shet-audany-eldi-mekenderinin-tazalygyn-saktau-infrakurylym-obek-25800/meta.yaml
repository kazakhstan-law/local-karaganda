act_code: '25800'
requisite: Қарағанды облысы Шет аудандық мәслихатының 2005 жылғы 22 қазандағы № 21/220 шешімі. Шет ауданы Әділет басқармасында 2005 жылғы 10 қарашада № 8-17-7 тіркелді.
