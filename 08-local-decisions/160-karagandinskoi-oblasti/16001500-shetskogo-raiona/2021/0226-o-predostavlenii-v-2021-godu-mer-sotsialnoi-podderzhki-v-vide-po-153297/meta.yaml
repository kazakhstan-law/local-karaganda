act_code: '153297'
requisite: Решение Шетского районного маслихата Карагандинской области от 26 февраля 2021 года № 2/18. Зарегистрировано Департаментом юстиции Карагандинской области 9 марта 2021 года № 6235
title:
  rus: О предоставлении в 2021 году мер социальной поддержки в виде подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов и поселков прибывшим для работы и проживания в сельские населенные пункты Шетского района
  kaz: Шет ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюжеттік кредит түрінде әлеуметтік қолдау шараларын 2021 жылы ұсыну туралы
