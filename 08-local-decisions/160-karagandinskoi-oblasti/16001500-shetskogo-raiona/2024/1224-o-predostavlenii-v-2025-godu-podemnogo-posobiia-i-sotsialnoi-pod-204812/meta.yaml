act_code: '204812'
requisite: Решение Шетского районного маслихата Карагандинской области от 24 декабря 2024 года № 19/169
title:
  rus: О предоставлении в 2025 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов и поселков, прибывшим для работы и проживания в сельские населенные пункты Шетского района
  kaz: 2025 жылы Шет ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер мен кенттер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы»
