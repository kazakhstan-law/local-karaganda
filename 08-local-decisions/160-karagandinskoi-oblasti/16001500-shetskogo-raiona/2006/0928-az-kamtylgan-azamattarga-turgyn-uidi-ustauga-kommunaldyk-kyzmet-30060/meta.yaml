requisite: Қарағанды облысы Шет аудандық мәслихатының 2006 жылғы 28 қыркүйектегі № 31/303 шешімі. Қарағанды облысы Шет ауданы Әділет басқармасында 2006 жылғы 27 қазанда № 8-17-27 тіркелді. Күші жойылды - Қарағанды облысы Шет аудандық мәслихатының 2010 жылғы 28 қыркүйектегі № 26/273 шешімімен
