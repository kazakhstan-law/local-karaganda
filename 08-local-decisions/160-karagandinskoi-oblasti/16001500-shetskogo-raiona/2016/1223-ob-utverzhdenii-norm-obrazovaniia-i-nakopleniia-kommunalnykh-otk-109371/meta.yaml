  title:
    rus: О внесении изменения в решение Шетского районного маслихата от 23 декабря 2016 года № 9/68 «Об утверждении норм образования и накопления коммунальных отходов, а также тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Шетскому району»
    kaz: Шет аудандық мәслихатының 2016 жылғы 23 желтоқсандағы № 9/68 «Шет ауданы бойынша коммуналдық қалдықтардың пайда болуы және жинақталу нормаларын, сондай ақ тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифті бекіту туралы» шешіміне өзгеріс енгізу туралы
