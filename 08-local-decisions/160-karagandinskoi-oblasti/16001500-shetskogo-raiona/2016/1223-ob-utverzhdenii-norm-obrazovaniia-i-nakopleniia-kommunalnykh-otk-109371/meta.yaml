act_code: '109371'
requisite: Решение Шетского районного маслихата Карагандинской области от 23 декабря 2016 года № 9/68. Зарегистрировано Департаментом юстиции Карагандинской области 23 января 2017 года № 4127. Утратило силу решением Шетского районного маслихата Карагандинской области от 22 декабря 2022 года № 19/196 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, а также тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Шетскому району
  kaz: Шет ауданы бойынша коммуналдық қалдықтардың пайда болуы және жинақталу нормаларын, сондай ақ тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифті бекіту туралы
