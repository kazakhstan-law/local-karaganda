requisite: Решение Шетского районного маслихата Карагандинской области от 22 декабря 2016 года № 9/67. Зарегистрировано Департаментом юстиции Карагандинской области 9 января 2017 года № 4093
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Шетского района в 2017 году
  kaz: 2017 жылы Шет ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіп кешені мамандарына әлеуметтік қолдау шараларын ұсыну туралы
