act_code: '176819'
requisite: Решение Шетского районного маслихата Карагандинской области от 22 декабря 2022 года № 19/199
title:
  rus: О предоставлении в 2023 году мер социальной поддержки в виде подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов и поселков прибывшим для работы и проживания в сельские населенные пункты Шетского района
  kaz: Шет ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюжеттік кредит түрінде әлеуметтік қолдау шараларын 2023 жылы ұсыну туралы
