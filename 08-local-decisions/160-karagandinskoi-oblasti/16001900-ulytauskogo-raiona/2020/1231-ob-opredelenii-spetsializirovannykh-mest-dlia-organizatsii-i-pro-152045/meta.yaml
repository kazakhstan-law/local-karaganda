  title:
    rus: О внесении изменений и дополнения в решение Улытауского районного маслихата от 31 декабря 2020 года № 427 «О специализированных местах для организации и проведения мирных собраний и границах, прилегающих территорий, в которых запрещено проведение пикетирования на территории Улытауского района»
    kaz: Ұлытау аудандық мәслихатының 2020 жылғы 31 желтоқсандағы № 427 «Ұлытау ауданының аумағында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындар және пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекаралары туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
