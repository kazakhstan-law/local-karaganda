act_code: '151689'
requisite: Решение Улытауского районного маслихата Карагандинской области от 30 декабря 2020 года № 417. Зарегистрировано Департаментом юстиции Карагандинской области 12 января 2021 года № 6153
title:
  rus: Об утверждении Правил оказания социальной поддержки и установления размера по оплате коммунальных услуг и приобретению топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Улытауского района
  kaz: Ұлытау ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына коммуналдық қызметтерді төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету және мөлшерін белгілеу қағидаларын бекіту туралы
