requisite: Қарағанды облысы Ұлытау аудандық мәслихатының ІХ сессиясының 2008 жылғы 25 желтоқсандағы № 123 шешімі. Қарағанды облысы Ұлытау ауданы Әділет басқармасында 2009 жылғы 20 қаңтарда № 8-16-38 тіркелді. Күші жойылды - Қарағанды облысы Ұлытау аудандық мәслихатының 2018 жылғы 23 шілдедегі № 201 (алғашқы ресми жарияланған күнінен кейін күнтізбелік он күн өткен соң қолданысқа енгiзiледi) шешімімен
