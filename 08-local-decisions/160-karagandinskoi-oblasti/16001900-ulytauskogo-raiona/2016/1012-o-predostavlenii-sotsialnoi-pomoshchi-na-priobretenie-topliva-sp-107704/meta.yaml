act_code: '107704'
requisite: Решение V сессии Улытауского районного маслихата Карагандинской области от 12 октября 2016 года № 48. Зарегистрировано Департаментом юстиции Карагандинской области 26 октября 2016 года № 4015. Утратило силу решением Улытауского районного маслихата Карагандинской области от 30 декабря 2020 года № 417 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии, работающим и проживающим в сельских населенных пунктах
  kaz: Ауылдық елді мекендерде жұмыс істейтін және тұратын мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
