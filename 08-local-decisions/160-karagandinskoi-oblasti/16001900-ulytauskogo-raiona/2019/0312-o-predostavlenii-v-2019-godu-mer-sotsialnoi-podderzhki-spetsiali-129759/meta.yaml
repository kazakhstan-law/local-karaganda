  title:
    rus: О внесении изменения в решение Улытауского районного маслихата от 12 марта 2019 года № 262 «О предоставлении в 2019 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Улытауского района»
    kaz: Ұлытау аудандық мәслихатының 2019 жылғы 12 наурыздағы № 262 «Ұлытау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылы әлеуметтік қолдау шараларын ұсыну туралы» шешіміне өзгеріс енгізу туралы
