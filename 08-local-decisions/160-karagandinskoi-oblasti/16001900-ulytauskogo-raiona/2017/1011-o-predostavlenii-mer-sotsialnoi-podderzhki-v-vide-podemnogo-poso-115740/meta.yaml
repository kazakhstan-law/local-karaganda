act_code: '115740'
requisite: Решение XVI сессии Улытауского районного маслихата Карагандинской области от 11 октября 2017 года № 131. Зарегистрировано Департаментом юстиции Карагандинской области 27 октября 2017 года № 4423
title:
  rus: О предоставлении мер социальной поддержки в виде подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам в области здравоохранения,  образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Улытауского района в 2017 году
  kaz: 2017 жылы Ұлытау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй салу немесе сатып алуға бюджеттік кредит түріндегі әлеуметтік қолдау шараларын ұсыну туралы
