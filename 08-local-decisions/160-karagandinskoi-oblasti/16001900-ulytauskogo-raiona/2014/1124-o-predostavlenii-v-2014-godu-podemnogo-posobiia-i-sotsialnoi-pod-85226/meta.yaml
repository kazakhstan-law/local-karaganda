act_code: '85226'
requisite: Решение XХIII сессии Улытауского районного маслихата Карагандинской области от 24 ноября 2014 года № 196. Зарегистрировано Департаментом юстиции Карагандинской области 22 декабря 2014 года № 2886
title:
  rus: О предоставлении в 2014 году подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Улытауского района
  kaz: 2014 жылға Ұлытау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарына көтерме жәрдемақы және тұрғын үй сатып алу үшін несие түрінде әлеуметтік қолдау шараларын ұсыну туралы
