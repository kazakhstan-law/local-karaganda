act_code: '65231'
requisite: Решение II сессии Улытауского районного маслихата Карагандинской области от 12 апреля 2012 года № 17. Зарегистрировано Управлением юстиции Улытауского района Карагандинской области 4 мая 2012 года № 8-16-79
title:
  rus: О предоставлении мер социальной поддержки в виде подъемного пособия и кредита для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Улытауского района
  kaz: Ұлытау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және тұрғын үй сатып алу үшін несие түрінде әлеуметтік қолдау шараларын ұсыну туралы
