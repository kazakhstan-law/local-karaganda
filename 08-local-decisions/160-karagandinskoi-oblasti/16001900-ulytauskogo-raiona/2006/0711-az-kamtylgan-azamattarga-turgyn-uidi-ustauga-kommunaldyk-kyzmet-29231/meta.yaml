act_code: '29231'
requisite: Қарағанды облысы Ұлытау аудандық мәслихатының XX сессиясының 2006 жылғы 11 шілдедегі № 20-8 шешімі. Қарағанды облысы Ұлытау ауданы Әділет басқармасында 2006 жылғы 3 тамызда № 8-16-16 тіркелді. Күші жойылды - Қарағанды облысы Ұлытау аудандық мәслихатының XXXII сессиясының 2011 жылғы 14 қарашадағы № 378 шешімімен
title:
