act_code: '28264'
requisite: Қарағанды облысы Ұлытау аудандық мәслихатының ХIX сессиясының 2006 жылғы 6 мамырдағы № 19-7 шешімі. Қарағанды облысы Ұлытау ауданы Әділет басқармасында 2006 жылғы 3 маусымда № 8-16-13 тіркелді. Күші жойылды - Қарағанды облысы Ұлытау аудандық мәслихатының 2018 жылғы 23 шілдедегі № 201 (алғашқы ресми жарияланған күнінен кейін күнтізбелік он күн өткен соң қолданысқа енгiзiледi) шешімімен
title:
  rus: «Жер учаскелерінің кадастрлық (бағалау) құнын анықтау мен салық салу мақсаты үшін Ұлытау селосы, Жезді кенті аумақтарының аймақтандыру схемаларын» және Ұлытау ауданы ауылдық елді мекендер аумақтарының жер-шаруашылық орналастыу жобаларын бекіту туралы
  kaz: «Жер учаскелерінің кадастрлық (бағалау) құнын анықтау мен салық салу мақсаты үшін Ұлытау селосы, Жезді кенті аумақтарының аймақтандыру схемаларын» және Ұлытау ауданы ауылдық елді мекендер аумақтарының жер-шаруашылық орналастыу жобаларын бекіту туралы
