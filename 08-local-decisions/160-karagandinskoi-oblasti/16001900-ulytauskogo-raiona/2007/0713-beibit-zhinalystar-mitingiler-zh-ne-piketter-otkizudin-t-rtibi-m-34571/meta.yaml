requisite: Қарағанды облысы Ұлытау аудандық мәслихатының XXVI сессиясының 2007 жылғы 13 шілдедегі № 26-6 шешімі. Қарағанды облысы Ұлытау ауданы әділет басқармасында 2007 жылғы 2 тамызда № 8-16-25 тіркелді. Күші жойылды - Қарағанды облысы Ұлытау аудандық мәслихатының 2016 жылғы 4 тамыздағы № 32 шешімімен
