act_code: '31853'
requisite: Қарағанды облысы Ұлытау аудандық мәслихатының XXIII сессиясының 2007 жылғы 12 қаңтардағы № 23-4 шешімі. Ұлытау ауданы әділет басқармасында 2007 жылғы 12 ақпанда № 8-16-21 тіркелді. Күші жойылды - Қарағанды облысы Ұлытау аудандық мәслихатының 2018 жылғы 23 шілдедегі № 201 (алғашқы ресми жарияланған күнінен кейін күнтізбелік он күн өткен соң қолданысқа енгiзiледi) шешімімен
title:
