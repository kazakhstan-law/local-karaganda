act_code: '46226'
requisite: Қарағанды облысы Ұлытау аудандық мәслихатының XI сессиясының 2009 жылғы 24 сәуірдегі № 139 шешімі. Қарағанды облысы Ұлытау ауданы Әділет басқармасында 2009 жылғы 30 мамырда № 8-16-42 тіркелді. Күші жойылды - Қарағанды облысы Ұлытау аудандық мәслихатының 2018 жылғы 23 шілдедегі № 201 (алғашқы ресми жарияланған күнінен кейін күнтізбелік он күн өткен соң қолданысқа енгiзiледi) шешімімен
