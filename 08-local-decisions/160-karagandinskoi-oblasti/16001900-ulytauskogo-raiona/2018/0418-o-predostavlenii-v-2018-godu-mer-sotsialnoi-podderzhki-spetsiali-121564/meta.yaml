act_code: '121564'
requisite: Решение XXI сессии Улытауского районного маслихата Карагандинской области от 18 апреля 2018 года № 186. Зарегистрировано Департаментом юстиции Карагандинской области 4 мая 2018 года № 4744
title:
  rus: О предоставлении в 2018 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Улытауского района
  kaz: Ұлытау ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылы әлеуметтік қолдау шараларын ұсыну туралы
