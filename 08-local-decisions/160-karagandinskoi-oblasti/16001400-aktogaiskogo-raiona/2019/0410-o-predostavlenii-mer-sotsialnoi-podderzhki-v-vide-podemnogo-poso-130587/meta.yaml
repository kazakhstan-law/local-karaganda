act_code: '130587'
requisite: Решение Актогайского районного маслихата Карагандинской области от 10 апреля 2019 года № 296. Зарегистрировано Департаментом юстиции Карагандинской области 12 апреля 2019 года № 5286
title:
  rus: О предоставлении мер социальной поддержки в виде подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Актогайского района в 2019 году
  kaz: 2019 жылы Ақтоғай ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға бюджеттік несие түрінде әлеуметтік қолдау шараларын ұсыну туралы
