act_code: '137649'
requisite: Решение Актогайского районного маслихата Карагандинской области от 26 декабря 2019 года № 354. Зарегистрировано Департаментом юстиции Карагандинской области 30 декабря 2019 года № 5616
title:
  rus: О предоставлении в 2020 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Актогайского района
  kaz: Ақтоғай ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы әлеуметтік қолдау шараларын көрсету туралы
