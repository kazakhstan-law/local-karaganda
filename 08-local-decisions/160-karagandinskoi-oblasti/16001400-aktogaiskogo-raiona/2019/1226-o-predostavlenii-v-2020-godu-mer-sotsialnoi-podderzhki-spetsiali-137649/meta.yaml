  title:
    rus: О внесении изменений в решение Актогайского районного маслихата от 26 декабря 2019 года № 354 «О предоставлении в 2020 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Актогайского района»
    kaz: Ақтоғай аудандық мәслихатының 2019 жылғы 26 желтоқсандағы «Ақтоғай ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылы әлеуметтік қолдау шараларын көрсету туралы» № 354 шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/151170/rus
