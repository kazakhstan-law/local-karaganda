act_code: '39729'
requisite: Қарағанды облысы Ақтоғай аудандық мәслихатының 5 сессиясының 2008 жылғы 31 наурыздағы № 70 шешімі. Қарағанды облысы Ақтоғай ауданы Әділет басқармасында 2008 жылғы 23 мамырда № 8-10-64 тіркелді. Күші жойылды - Қарағанды облысы Ақтоғай аудандық мәслихатының 2012 жылғы 10 сәуірдегі № 34 шешімімен
