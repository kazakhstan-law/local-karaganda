requisite: Қарағанды облысы Ақтоғай аудандық мәслихатының 9 сессиясының 2008 жылғы 18 қарашадағы № 105 шешімі. Қарағанды облысы Ақтоғай ауданы Әділет басқармасында 2008 жылғы 26 қарашада № 8-10-70 тіркелді. Күші жойылды - Қарағанды облысы Ақтоғай аудандық мәслихатының 32 сессиясының 2011 жылғы 9 маусымдағы № 309 шешімімен
