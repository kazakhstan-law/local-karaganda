  title:
    rus: О внесении изменений в решение Актогайского районного маслихата от 26 декабря 2023 года № 111 «Предоставить меры социальной поддержки в виде подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Актогайского района в 2024 году»
    kaz: Ақтоғай аудандық мәслихатының 2023 жылғы 26 желтоқсандағы № 111 «2024 жылы Ақтоғай ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарды, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға бюджеттік кредит түрінде әлеуметтік қолдау шараларын ұсыну туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/201550/rus
