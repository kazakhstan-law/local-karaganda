  kaz: Ақтоғай ауданы Ақтоғай ауылы мен Шашубай кенті жерлерін аймақтарға бөлу жобасын (схемасын), бағалау аймақтарының шекаралары және жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффициенттерін бекіту туралы
