requisite: Решение 38 сессии Актогайского районного маслихата Карагандинской области от 10 ноября 2011 года № 360. Зарегистрировано Управлением юстиции Актогайского района Карагандинской области 6 декабря 2011 года № 8-10-138
title:
  rus: О предоставлении мер социальной поддержки в виде подъемного пособия и кредита для приобретение жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Актогайского района в 2011 году
  kaz: 2011 жылы Ақтоғай ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы және тұрғын үй сатып алу үшін кредит түрінде әлеуметтік қолдау шараларын ұсыну туралы
