act_code: '45545'
requisite: Қарағанды облысы Ақтоғай аудандық мәслихатының 11 сессиясының 2009 жылғы 31 наурыздағы № 131 шешімі. Қарағанды облысы Ақтоғай ауданы Әділет басқармасында 2009 жылғы 30 сәуірде № 8-10-82 тіркелді. Күші жойылды - Қарағанды облысы Ақтоғай аудандық мәслихатының 18 сессиясының 2009 жылғы 23 желтоқсандағы № 192 шешімімен
