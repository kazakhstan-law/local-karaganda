act_code: '49565'
requisite: Қарағанды облысы Ақтоғай аудандық мәслихатының 18 сессиясының 2009 жылғы 23 желтоқсандағы № 191 шешімі. Қарағанды облысы Ақтоғай ауданының Әділет басқармасында 2009 жылғы 28 желтоқсанда № 8-10-95 тіркелді. Күші жойылды – Қарағанды облысы Ақтоғай аудандық мәслихатының 2020 жылғы 24 маусымдағы № 405 (алғашқы ресми жариялаған күнінен бастап қолданысқа енгізіледі) шешімімен
