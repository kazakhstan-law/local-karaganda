act_code: '143483'
requisite: Решение Актогайского районного маслихата Карагандинской области от 26 мая 2020 года № 396. Зарегистрировано Департаментом юстиции Карагандинской области 3 июня 2020 года № 5853
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры и спорта, являющимся гражданскими служащими и работающим в сельских населенных пунктах, а также указанным специалистам, работающим в государственных организациях, финансируемых из местных бюджетов
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандарға, сондай-ақ жергілікті бюджеттерден қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтiк мөлшерлемелер белгілеу туралы
