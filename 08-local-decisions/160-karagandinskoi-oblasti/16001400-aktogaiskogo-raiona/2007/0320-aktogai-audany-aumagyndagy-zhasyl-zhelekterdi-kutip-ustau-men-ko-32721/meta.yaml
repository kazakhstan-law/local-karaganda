act_code: '32721'
requisite: Қарағанды облысы Ақтоғай аудандық мәслихатының 34 сессиясының 2007 жылғы 20 наурыздағы № 383 шешімі. Ақтоғай ауданы әділет басқармасында 2007 жылғы 13 сәуірде № 8-10-40 тіркелді
