  title:
    rus: О внесении изменений и дополнений в решение 21 сессии Актогайского районного маслихата от 11 апреля 2014 года № 197 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Актогайского района»
    kaz: Ақтоғай аудандық мәслихатының 21 сессиясының 2014 жылғы 11 сәуірдегі № 197 «Ақтоғай ауданындағы әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау  қағидасын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
