  title:
    rus: О внесении изменения в решение Актогайского районного маслихата от 20 июля 2016 года № 31/5 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Актогайского района»
    kaz: Ақтоғай аудандық мәслихатының 2016 жылғы 20 шілдедегі «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және Ақтоғай ауданының мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» № 31/5 шешіміне өзгеріс енгізу туралы
