requisite: Решение маслихата Актогайского района Павлодарской области от 3 марта 2016 года № 246/57. Зарегистрировано Департаментом юстиции Павлодарской области 25 марта 2016 года № 5015. Утратило силу решением маслихата Актогайского района Павлодарской области от 27 июня 2019 года № 246/50 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О повышении ставки земельного налога и ставки единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Актогайского района Павлодарской области
  kaz: Қазақстан Республикасының жер заңнамасына сәйкес Павлодар облысы Ақтоғай ауданының ауыл шаруашылығы мақсатындағы пайдаланылмайтын жерлердің жер салығының мөлшерлемесін және бірыңғай жер салығының мөлшерлемесін жоғарылату туралы
