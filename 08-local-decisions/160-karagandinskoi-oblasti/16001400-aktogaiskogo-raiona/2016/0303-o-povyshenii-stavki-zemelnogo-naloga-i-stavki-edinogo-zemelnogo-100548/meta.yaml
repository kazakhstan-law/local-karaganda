  title:
    rus: О внесении изменений в решение Актогайского районного маслихата от 3 марта 2016 года № 246/57 "О повышении ставки земельного налога и ставки единого земельного налога на не используемые в соответствии с земельным законодательством Республики Казахстан земли сельскохозяйственного назначения Актогайского района Павлодарской области"
    kaz: Ақтоғай аудандық мәслихаттың 2016 жылғы 3 наурыздағы «Қазақстан Республикасының жер заңнамасына сәйкес Павлодар облысы Ақтоғай ауданының ауыл шаруашылығы мақсатындағы пайдаланылмайтын жерлердің жер салығының мөлшерлемесін және бірыңғай жер салығының мөлшерлемесін жоғарылату туралы» № 246/57 шешіміне өзгерістер енгізу туралы
