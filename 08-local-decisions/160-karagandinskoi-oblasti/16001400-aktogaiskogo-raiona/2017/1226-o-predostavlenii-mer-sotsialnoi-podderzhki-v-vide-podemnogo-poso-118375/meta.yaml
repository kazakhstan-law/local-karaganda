act_code: '118375'
requisite: Решение 19 сессии Актогайского районного маслихата Карагандинской области от 26 декабря 2017 года № 178. Зарегистрировано Департаментом юстиции Карагандинской области 19 января 2018 года № 4589
title:
  rus: О предоставлении мер социальной поддержки в виде подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Актогайского района в 2018 году
  kaz: 2018 жылы Ақтоғай ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға бюджеттік несие түрінде әлеуметтік қолдау шараларын ұсыну туралы
