requisite: Решение акима Кызыларайского сельского округа Актогайского района Карагандинской области от 17 мая 2013 года № 01. Зарегистрировано Департаментом юстиции Карагандинской области 17 мая 2013 года № 2330. Утратило силу решением акима Кызыларайского сельского округа Актогайского района Карагандинской области от 26 декабря 2013 года № 02
title:
  rus: Об установлении ветеринарного режима карантинной зоны с введением ограничительных мероприятий на территорию зимовки "Данбай" Кызыларайского сельского округа Актогайского района Карагандинской области
  kaz: Қарағанды облысы Ақтоғай ауданы Қызыларай селолық округінің "Дәнбай" қыстағы аумағына шектеу іс-шараларын енгізе отырып карантин аймағының ветеринариялық режимін белгілеу туралы
