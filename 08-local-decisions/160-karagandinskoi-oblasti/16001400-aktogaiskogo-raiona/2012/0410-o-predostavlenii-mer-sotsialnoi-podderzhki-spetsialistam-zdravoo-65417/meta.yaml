requisite: Решение 3 сессии Актогайского районного маслихата Карагандинской области от 10 апреля 2012 года № 30. Зарегистрировано Управлением юстиции Актогайского района Карагандинской области 11 мая 2012 года № 8-10-149. Утратило силу решением 11 сессии Актогайского районного маслихата Карагандинской области от 13 февраля 2013 года № 106
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Актогайского района в 2012 году
  kaz: 2012 жылы Ақтоғай ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну туралы
