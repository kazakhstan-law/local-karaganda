act_code: '29053'
requisite: Қарағанды облысы Ақтоғай аудандық мәслихатының 28 сессиясының 2006 жылғы 22 маусымдағы № 308 шешімі. Ақтоғай ауданы Әділет басқармасында 2006 жылғы 25 шілдеде № 8-10-27 тіркелді. Күші жойылды - Қарағанды облысы Ақтоғай аудандық мәслихатының 12 сессиясының 2009 жылғы 24 сәуірдегі № 141 шешімімен
title:
  rus: Аз қамтылған азаматтарға тұрғын үйді ұстауға, коммуналдық қызмет көрсету үшін тұрғын үй жәрдемақыcын беру және телекоммуникация желілерінің абоненттеріне телефон үшін абоненттік ақы тарифтерінің арттырылуына өтемақы берудің Қағидасын бекіту туралы
