act_code: '99263'
requisite: Решение 38 сессии Актогайского районного маслихата Карагандинской области от 22 декабря 2015 года № 351. Зарегистрировано Департаментом юстиции Карагандинской области 19 января 2016 года № 3624
title:
  rus: О предоставлении мер социальной поддержки в виде подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам здравоохранения, образования, социального  обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Актогайского района в 2016 году
  kaz: 2016 жылы Ақтоғай ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіп кешенінің мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға бюджеттік несие түрінде әлеуметтік қолдау шараларын ұсыну туралы
