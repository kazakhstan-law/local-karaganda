requisite: Решение 31 сессии Актогайского районного маслихата Карагандинской области от 31 марта 2015 года № 281. Зарегистрировано Департаментом юстиции Карагандинской области 16 апреля 2015 года № 3151
title:
  rus: 'О предоставлении мер социальной поддержки в виде подъемного пособия и бюджетного кредита для  приобретения или строительства жилья специалистам  здравоохранения, образования, социального  обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Актогайского района в 2015 году '
  kaz: '2015 жылы Ақтоғай ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт  және агроөнеркәсіп кешенінің мамандарына көтерме жәрдемақы және тұрғын үй сатып алуға немесе салуға бюджеттік несие түрінде әлеуметтік қолдау шараларын ұсыну туралы '
