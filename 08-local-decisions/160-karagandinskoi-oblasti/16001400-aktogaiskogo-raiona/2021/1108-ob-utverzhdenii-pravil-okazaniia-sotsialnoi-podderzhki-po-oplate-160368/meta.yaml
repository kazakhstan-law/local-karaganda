act_code: '160368'
requisite: Решение Актогайского районного маслихата Карагандинской области от 8 ноября 2021 года № 95. Зарегистрировано в Министерстве юстиции Республики Казахстан 19 ноября 2021 года № 25230
title:
  rus: Об утверждении Правил оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Актогайского района
  kaz: Ақтоғай ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету Қағидасын бекіту туралы
