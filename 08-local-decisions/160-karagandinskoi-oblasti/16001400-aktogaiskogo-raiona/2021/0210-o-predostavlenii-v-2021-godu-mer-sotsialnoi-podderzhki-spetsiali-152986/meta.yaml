act_code: '152986'
requisite: Решение Актогайского районного маслихата Карагандинской области от 10 февраля 2021 года № 16. Зарегистрировано Департаментом юстиции Карагандинской области 19 февраля 2021 года № 6195
title:
  rus: О предоставлении в 2021 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов села, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Актогайского района
  kaz: Ақтоғай ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауыл, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2021 жылы әлеуметтік қолдау шараларын ұсыну туралы
